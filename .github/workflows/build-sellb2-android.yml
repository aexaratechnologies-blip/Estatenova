name: Build SELLB2 Production Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-sellb2-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare release signing key
        shell: bash
        env:
          SELLB2_KEYSTORE_B64: ${{ secrets.SELLB2_KEYSTORE_B64 }}
          SELLB2_STORE_PASSWORD_SECRET: ${{ secrets.SELLB2_STORE_PASSWORD }}
          SELLB2_KEY_ALIAS_SECRET: ${{ secrets.SELLB2_KEY_ALIAS }}
          SELLB2_KEY_PASSWORD_SECRET: ${{ secrets.SELLB2_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/sellb2-release.jks"
          if [ -n "${SELLB2_KEYSTORE_B64:-}" ] && [ -n "${SELLB2_STORE_PASSWORD_SECRET:-}" ] && [ -n "${SELLB2_KEY_ALIAS_SECRET:-}" ] && [ -n "${SELLB2_KEY_PASSWORD_SECRET:-}" ]; then
            printf '%s' "$SELLB2_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            echo "SELLB2_STORE_PASSWORD=$SELLB2_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "SELLB2_KEY_ALIAS=$SELLB2_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "SELLB2_KEY_PASSWORD=$SELLB2_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -alias sellb2-production \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass sellb2-production-store \
              -keypass sellb2-production-key \
              -dname "CN=SELLB2, OU=Aexara Technologies, O=Aexara Technologies Pvt Ltd, L=India, ST=Bihar, C=IN"
            echo "SELLB2_STORE_PASSWORD=sellb2-production-store" >> "$GITHUB_ENV"
            echo "SELLB2_KEY_ALIAS=sellb2-production" >> "$GITHUB_ENV"
            echo "SELLB2_KEY_PASSWORD=sellb2-production-key" >> "$GITHUB_ENV"
          fi
          echo "SELLB2_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build production APK and AAB
        working-directory: android
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK" android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: SELLB2-production-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: SELLB2-production-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
