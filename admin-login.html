<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>EstateNova Admin</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050816;color:#fff;font-family:system-ui,-apple-system,sans-serif}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 0,#172b61,transparent 35%),radial-gradient(circle at 90% 0,#3c155c,transparent 32%),#050816}.card{width:min(440px,92%);padding:30px;border:1px solid #ffffff20;border-radius:26px;background:#0b1530ee;box-shadow:0 25px 80px #0008}.brand{font-size:30px;font-weight:900}.grad{color:#a78bfa}.eyebrow{font-size:10px;letter-spacing:3px;color:#91a0bf}input,button{width:100%;padding:14px;border-radius:13px;font:inherit}input{margin-top:10px;background:#07112a;border:1px solid #26375f;color:#fff}button{margin-top:16px;border:0;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:850;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{margin-top:13px;color:#ff9eb3}</style></head><body><div class="login"><main class="card"><div class="brand">Estate<span class="grad">Nova</span></div><div class="eyebrow">PRIVATE ADMIN CONSOLE</div><h1>Admin sign in</h1><p>Authorized administrator access only.</p><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"><button id="login" type="button">Sign in</button><div id="error" class="error"></div></main></div><script>'use strict';const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console',el=id=>document.getElementById(id);function error(m){el('error').textContent=m||''}async function login(){error('');const password=el('password').value.trim();if(!password)return error('Enter the admin password.');const b=el('login');b.disabled=true;b.textContent='Signing in…';try{const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',body:JSON.stringify({action:'login',email:'satyanshraj774@gmail.com',password})});const d=await r.json();if(!r.ok||!d.ok)throw Error('Invalid admin password.');sessionStorage.setItem('estatenova_admin_session',d.token);location.replace('/admin-dashboard.html')}catch(e){error(e.message||'Sign in failed.');b.disabled=false;b.textContent='Sign in'}}el('login').onclick=login;el('password').onkeydown=e=>{if(e.key==='Enter')login()};if(sessionStorage.getItem('estatenova_admin_session'))location.replace('/admin-dashboard.html');</script></body></html>
