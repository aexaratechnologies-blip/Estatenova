<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova Admin Sign In</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 0,#172b61,transparent 35%),radial-gradient(circle at 90% 0,#3c155c,transparent 32%),#050816;color:#f5f7ff;font-family:Inter,system-ui,sans-serif}.card{width:min(480px,100%);padding:30px;border:1px solid #ffffff18;border-radius:28px;background:#0b1530ee;box-shadow:0 25px 80px #0008}.brand{font-size:30px;font-weight:900}.grad{background:linear-gradient(90deg,#60a5fa,#a78bfa,#f0abfc);-webkit-background-clip:text;color:transparent}.eyebrow{margin-top:6px;font-size:11px;letter-spacing:3px;color:#91a0bf}h1{font-size:34px;margin:30px 0 8px}p{color:#91a0bf;line-height:1.5}label{display:block;margin:20px 0 8px;font-weight:700;font-size:13px}input{width:100%;padding:15px;border-radius:14px;border:1px solid #26375f;background:#07112a;color:#fff;font-size:16px;outline:0}input:focus{border-color:#7887ff;box-shadow:0 0 0 3px #6d4aff22}.btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#2563eb,#6d4aff);color:#fff;font-weight:850;font-size:16px}.error{margin-top:15px;padding:13px;border-radius:12px;color:#ff9eb3;background:#7e23401c;border:1px solid #c33f612f}.hint{font-size:12px;margin-top:14px}</style></head><body><main class="card"><div class="brand">Estate<span class="grad">Nova</span></div><div class="eyebrow">PRIVATE ADMIN CONSOLE</div><h1>Admin sign in</h1><p>Only the authorized EstateNova administrator can access this dashboard.</p><label>Email</label><input id="email" value="satyanshraj774@gmail.com" readonly><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password"><button id="login" class="btn">Sign in to dashboard</button><div id="error" class="error" hidden></div><p class="hint">Your password is never stored in this page.</p></main><script>const sb=supabase.createClient('https://bttujypzchanhvdmqutv.supabase.co','sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0');const ADMIN='satyanshraj774@gmail.com';const $=id=>document.getElementById(id);function fail(m){$('error').hidden=false;$('error').textContent=m}async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user||user.email?.toLowerCase()!==ADMIN)return false;const {data,error}=await sb.rpc('is_admin');return !error&&data===true}async function go(){const p=$('password').value;if(!p)return fail('Enter the admin password.');$('login').disabled=true;$('login').textContent='Signing in…';$('error').hidden=true;let result=await sb.auth.signInWithPassword({email:ADMIN,password:p});if(result.error&&p.length>1){const legacy=p[0]===p[0].toUpperCase()?p[0].toLowerCase()+p.slice(1):null;if(legacy&&legacy!==p)result=await sb.auth.signInWithPassword({email:ADMIN,password:legacy});}if(result.error){fail('Invalid admin password.');$('login').disabled=false;$('login').textContent='Sign in to dashboard';return}if(!(await isAdmin())){await sb.auth.signOut();fail('This account is not authorized for the admin dashboard.');$('login').disabled=false;$('login').textContent='Sign in to dashboard';return}if(result.error===null&&p){const u=await sb.auth.updateUser({password:p});if(u.error){await sb.auth.signOut();fail('Login worked, but the requested password could not be saved.');$('login').disabled=false;$('login').textContent='Sign in to dashboard';return}}location.replace('/admin.html?fresh='+Date.now())}$('login').addEventListener('click',go);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
