<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova Admin</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 0,#172b61,transparent 35%),radial-gradient(circle at 90% 0,#3c155c,transparent 32%),#050816;color:#fff;font-family:system-ui}.card{width:min(440px,92%);padding:30px;border:1px solid #ffffff20;border-radius:26px;background:#0b1530ee;box-shadow:0 25px 80px #0008}.brand{font-size:30px;font-weight:900}.grad{color:#a78bfa}.eyebrow{font-size:10px;letter-spacing:3px;color:#91a0bf}input,button{width:100%;padding:14px;border-radius:13px;font:inherit}input{margin-top:10px;background:#07112a;border:1px solid #26375f;color:#fff}button{margin-top:16px;border:0;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:850}.error{margin-top:13px;color:#ff9eb3}</style></head><body><main class="card"><div class="brand">Estate<span class="grad">Nova</span></div><div class="eyebrow">PRIVATE ADMIN CONSOLE</div><h1>Admin sign in</h1><p>Authorized administrator access only.</p><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"><button id="login">Sign in</button><div id="error" class="error"></div></main><script>const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console';const p=document.getElementById('password'),b=document.getElementById('login'),e=document.getElementById('error');async function go(){e.textContent='';if(!p.value){e.textContent='Enter the admin password.';return}b.disabled=true;b.textContent='Signing in…';try{const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',email:'satyanshraj774@gmail.com',password:p.value})});const j=await r.json();if(!r.ok||!j.ok)throw Error('Invalid admin password.');sessionStorage.setItem('estatenova_admin_session',j.token);location.replace('/admin-dashboard.html')}catch(x){e.textContent=x.message;b.disabled=false;b.textContent='Sign in'}}b.onclick=go;p.onkeydown=x=>x.key==='Enter'&&go();</script></body></html>
