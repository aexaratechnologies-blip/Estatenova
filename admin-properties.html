<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>SELLB2 Admin — Listings</title><style>*{box-sizing:border-box}body{margin:0;background:#050816;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.eyebrow,.muted{color:#93a4c7}.eyebrow{font-size:10px;letter-spacing:3px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#6d4aff;color:#fff;font-weight:800;cursor:pointer}.danger{background:#9d294a}.tools{margin:18px 0;display:grid;gap:10px}.search{width:100%;padding:13px;border-radius:12px;background:#07112a;border:1px solid #26375f;color:#fff;font:inherit}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #26375f;background:#07112a;color:#cbd6ee;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.tabs button.on{background:#6d4aff;color:#fff;border-color:#6d4aff}.item{margin:14px 0;background:#0b1530;border:1px solid #ffffff15;border-radius:20px;padding:20px}.title{font-size:21px;font-weight:850}.badge{display:inline-block;margin-left:7px;padding:4px 9px;border-radius:99px;background:#17264a;color:#c9d3eb;font-size:11px}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}.kv{padding:10px;border-radius:10px;background:#07112a}.k{font-size:11px;color:#7182a8;text-transform:uppercase}.v{margin-top:3px;word-break:break-word}.desc{margin-top:14px;padding:13px;background:#07112a;border-radius:12px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}@media(max-width:650px){.details{grid-template-columns:1fr}.wrap{padding:16px}.top h1{font-size:25px}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">SELLB2 CONTROL CENTER</div><h1>Marketplace Listings</h1><div class="muted" id="summary">Loading…</div></div><button class="btn" onclick="location.href='/admin-dashboard'">← Dashboard</button></div><div class="tools"><input id="q" class="search" placeholder="Search title, city, locality, owner or listing type…"><div class="tabs"><button data-cat="all" class="on" onclick="setCat('all')">All</button><button data-cat="property" onclick="setCat('property')">Properties</button><button data-cat="vehicle" onclick="setCat('vehicle')">Vehicles</button><button data-cat="business" onclick="setCat('business')">Businesses</button></div></div><div id="list">Loading listings…</div></div><script>'use strict';const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console',token=sessionStorage.getItem('estatenova_admin_session');let listings=[],users=[],category=new URLSearchParams(location.search).get('category')||'all';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function api(a,x={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token||''},cache:'no-store',body:JSON.stringify({action:a,...x})});if(r.status===401){sessionStorage.removeItem('estatenova_admin_session');location.href='/admin';throw Error('Session expired.')}if(!r.ok)throw Error('Admin service error');return r.json()}function val(v){return v===null||v===undefined||v===''?'—':Array.isArray(v)?v.join(', '):String(v)}function setCat(c){category=c;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.cat===c));render()}function card(x){const owner=users.find(u=>u.id===x.owner_id),c=x.category||'property',d=x.details||{};const fields=c==='property'?[['Listing ID',x.id],['Owner',owner?.full_name||x.owner_id],['Owner email',owner?.email],['Owner phone',owner?.phone],['Property type',x.property_type],['Listing type',x.listing_type],['Price',x.price_label||x.price],['Area',x.area&&x.area_unit?x.area+' '+x.area_unit:x.area],['Bedrooms',x.bedrooms],['Bathrooms',x.bathrooms],['Furnishing',x.furnishing],['Possession',x.possession],['Facing',x.facing],['Parking',x.parking],['Locality',x.locality],['City',x.city],['District',x.district],['State',x.state],['Status',x.status],['Views',x.views],['Created',x.created_at?new Date(x.created_at).toLocaleString():'—']]:c==='vehicle'?[['Listing ID',x.id],['Owner',owner?.full_name||x.owner_id],['Owner email',owner?.email],['Vehicle type',d.vehicle_type||x.property_type],['Brand',d.brand],['Model',d.model],['Model year',d.model_year],['Purchase year',d.purchase_year],['Wheels',d.wheels],['Condition',d.condition],['Fuel',d.fuel],['KM driven',d.km_driven],['Ownership count',d.ownership_count],['City',x.city],['District',x.district],['State',x.state],['Status',x.status],['Views',x.views],['Created',x.created_at?new Date(x.created_at).toLocaleString():'—']]:[['Listing ID',x.id],['Owner',owner?.full_name||x.owner_id],['Owner email',owner?.email],['Business type',d.business_type||x.property_type],['Registered',d.registered],['Established year',d.established_year],['Ownership type',d.ownership_type],['Owners',d.owners],['GST registered',d.gst_registered],['City',x.city],['District',x.district],['State',x.state],['Status',x.status],['Views',x.views],['Created',x.created_at?new Date(x.created_at).toLocaleString():'—']];return '<article class="item"><div class="title">'+esc(x.title||'Untitled')+' <span class="badge">'+esc(c)+'</span></div><div class="desc">'+esc(x.description||'No description provided.')+'</div><div class="details">'+fields.map(f=>'<div class="kv"><div class="k">'+esc(f[0])+'</div><div class="v">'+esc(val(f[1]))+'</div></div>').join('')+'</div><div class="actions"><button class="btn danger" onclick="del(\''+esc(x.id)+'\')">Delete listing</button></div></article>'}function render(){const q=$('q').value.trim().toLowerCase(),a=listings.filter(x=>(category==='all'||(x.category||'property')===category)&&(!q||[x.title,x.city,x.locality,x.address,x.property_type,x.listing_type,x.owner_id,x.details&&JSON.stringify(x.details)].some(v=>String(v||'').toLowerCase().includes(q))));$('summary').textContent=listings.length+' total listings · '+a.length+' shown';$('list').innerHTML=a.length?a.map(card).join(''):'<p class="muted">No listings found.</p>'}async function load(){if(!token){location.href='/admin';return}try{const d=await api('overview');listings=Array.isArray(d.listings)?d.listings:[];users=Array.isArray(d.users)?d.users:[];document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.cat===category));render()}catch(e){$('list').textContent=e.message}}async function del(id){if(confirm('Delete this listing permanently?')){try{await api('delete_listing',{id});await load()}catch(e){alert(e.message)}}}$('q').addEventListener('input',render);load();</script></body></html>
