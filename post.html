<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova — List Property</title><style>:root{--bg:#050816;--text:#f5f7ff;--muted:#9ba9c5;--blue:#2563eb;--violet:#7c3aed;--line:#25365f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#17316d,transparent 34%),radial-gradient(circle at 90% 0,#40156d,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}.wrap{max-width:850px;margin:auto;padding:0 20px}.nav{border-bottom:1px solid #fff2;background:#050816e8}.navin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900;color:#fff;text-decoration:none}.g{background:linear-gradient(90deg,#60a5fa,#a78bfa,#e9d5ff);-webkit-background-clip:text;color:transparent}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));font-weight:800;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.55;cursor:not-allowed}.ghost{background:#ffffff0d;border:1px solid #ffffff18}.panel{margin:35px 0;background:#08132cdd;border:1px solid #ffffff18;border-radius:24px;padding:26px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.input{width:100%;padding:12px;background:#07122a;border:1px solid #25365f;color:#fff;border-radius:11px;outline:0}.input:focus{border-color:#6d7efc;box-shadow:0 0 0 3px #5865f233}.error{color:#fca5a5;min-height:22px;margin:10px 0}.success{color:#86efac;min-height:22px;margin:10px 0}.upload{padding:16px;border:1px dashed #3a4c79;border-radius:14px;background:#07122a}.upload small{display:block;color:var(--muted);margin-top:6px}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#14234a;border:1px solid #ffffff12}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;left:6px;bottom:6px;padding:4px 7px;border-radius:7px;background:#000b;color:#fff;font-size:11px}@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.preview{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Estate<span class="g">Nova</span></a><a class="btn ghost" href="/properties">Browse properties</a></div></header><main class="wrap"><div class="panel"><span style="display:inline-block;padding:6px 10px;border-radius:99px;background:#7c3aed22;color:#c4b5fd;font-size:12px">LIST PROPERTY</span><h1>Submit a property</h1><p style="color:var(--muted)">Add clear photos of the building, flat, house, land, shop, office or other real-estate asset. Your listing stays private until admin review.</p><div class="form"><input id="title" class="input full" placeholder="Property title"><select id="listing_type" class="input"><option value="sale">Sale</option><option value="rent">Rent</option></select><select id="property_type" class="input"><option>Apartment</option><option>Flat</option><option>House</option><option>Villa</option><option>Plot / Land</option><option>Commercial</option><option>Office</option><option>Shop</option><option>Building</option><option>Warehouse</option><option>Industrial</option><option>Other</option></select><input id="price" class="input" type="number" min="0" placeholder="Price"><input id="area" class="input" type="number" min="0" placeholder="Area"><input id="area_unit" class="input" placeholder="Area unit (sq ft)"><input id="city" class="input" placeholder="City"><input id="locality" class="input" placeholder="Locality"><input id="district" class="input" placeholder="District"><input id="state" class="input" placeholder="State"><input id="pincode" class="input" placeholder="Pincode"><input id="address" class="input full" placeholder="Address"><textarea id="description" class="input full" rows="6" placeholder="Property description"></textarea><div class="upload full"><b>Property photos</b><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple style="display:block;margin-top:10px;width:100%"><small>Upload up to 12 images. JPG, PNG, WEBP or GIF, maximum 8 MB each.</small><div id="preview" class="preview"></div></div></div><div id="message" class="error"></div><button id="submit" class="btn" style="width:100%" type="button">Submit for review</button></div></main><script>const API='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0';const $=id=>document.getElementById(id);function clearSession(){['en_access_token','en_refresh_token','en_user_id','en_email'].forEach(k=>localStorage.removeItem(k));location.href='/auth?next='+encodeURIComponent('/post')}async function refresh(){const rt=localStorage.getItem('en_refresh_token');if(!rt)return null;const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});if(!r.ok){clearSession();return null}const d=await r.json();localStorage.setItem('en_access_token',d.access_token);if(d.refresh_token)localStorage.setItem('en_refresh_token',d.refresh_token);if(d.user?.id)localStorage.setItem('en_user_id',d.user.id);if(d.user?.email)localStorage.setItem('en_email',d.user.email);return d.access_token}async function getSession(){let t=localStorage.getItem('en_access_token');if(!t)return refresh();let r=await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t}});return r.ok?t:await refresh()}async function uploadPhoto(file,uid,token,index){if(file.size>8*1024*1024)throw Error(file.name+' is larger than 8 MB.');if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw Error(file.name+' is not a supported image.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path='listings/'+uid+'/'+Date.now()+'-'+index+'.'+ext;const r=await fetch(API+'/storage/v1/object/property-images/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':file.type,x-upsert:'true'},body:file});if(!r.ok){const e=await r.text();throw Error('Photo upload failed for '+file.name+'. '+e.slice(0,120))}return API+'/storage/v1/object/public/property-images/'+path}function renderPreview(){const files=[...$('photos').files].slice(0,12);$('preview').innerHTML=files.map((f,i)=>'<div class="thumb"><img src="'+URL.createObjectURL(f)+'" alt="Selected property photo"><span>'+(i===0?'Cover':'Photo '+(i+1))+'</span></div>').join('')}$('photos').onchange=()=>{if($('photos').files.length>12){$('message').textContent='Please select no more than 12 photos.';$('photos').value='';$('preview').innerHTML='';return}renderPreview()};async function init(){const t=await getSession(),user=localStorage.getItem('en_user_id');if(!t||!user)clearSession()}init();$('submit').onclick=async()=>{const message=$('message');message.className='error';message.textContent='';const token=await getSession(),user=localStorage.getItem('en_user_id');if(!token||!user){clearSession();return}if(!$('title').value.trim()||!$('price').value||!$('city').value.trim()||!$('district').value.trim()||!$('state').value.trim()){message.textContent='Title, price, city, district and state are required.';return}const files=[...$('photos').files].slice(0,12);$('submit').disabled=true;try{message.textContent=files.length?'Uploading '+files.length+' photo'+(files.length>1?'s':'')+'…':'Creating listing…';const imageUrls=[];for(let i=0;i<files.length;i++){message.textContent='Uploading photo '+(i+1)+' of '+files.length+'…';imageUrls.push(await uploadPhoto(files[i],user,token,i))}const body={title:$('title').value.trim(),listing_type:$('listing_type').value,property_type:$('property_type').value,price:Number($('price').value),area:$('area').value?Number($('area').value):null,area_unit:$('area_unit').value.trim()||'sq ft',city:$('city').value.trim(),locality:$('locality').value.trim()||null,district:$('district').value.trim(),state:$('state').value.trim(),pincode:$('pincode').value.trim()||null,address:$('address').value.trim()||null,description:$('description').value.trim()||null,owner_id:user,status:'active',approval_status:'pending',cover_image_url:imageUrls[0]||null,image_urls:imageUrls};let r=await fetch(API+'/rest/v1/listings',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});if(r.status===401){const fresh=await refresh();if(fresh){body.owner_id=localStorage.getItem('en_user_id');r=await fetch(API+'/rest/v1/listings',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+fresh,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)})}}if(!r.ok){const e=await r.text();throw Error('Could not submit the property. '+e.slice(0,180))}message.className='success';message.textContent='Property submitted successfully with '+files.length+' photo'+(files.length===1?'':'s')+'. It is waiting for admin review.';document.querySelectorAll('input,textarea,select').forEach(e=>{if(e.id!=='submit'&&e.id!=='photos')e.value=''});$('photos').value='';$('preview').innerHTML=''}catch(e){message.className='error';message.textContent=e.message||'Unable to submit property.'}finally{$('submit').disabled=false}};</script></body></html>
