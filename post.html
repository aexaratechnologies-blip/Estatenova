<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="List a property on EstateNova."><title>EstateNova — List Property</title><link rel="stylesheet" href="/site.css"></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Estate<span class="g">Nova</span></a><div><a class="btn ghost" href="/properties">Browse properties</a></div></div></header><main class="wrap"><div class="panel en-reveal" style="margin:35px 0;padding:30px"><span class="tag">LIST PROPERTY</span><h1>Submit a property</h1><p class="muted">Add accurate details and clear photos. Your listing stays pending until admin review.</p><div class="form"><input id="title" class="input full" placeholder="Property title *"><select id="listing_type" class="input"><option value="sale">For sale</option><option value="rent">For rent</option></select><select id="property_type" class="input"><option>Apartment</option><option>Flat</option><option>House</option><option>Villa</option><option>Plot / Land</option><option>Commercial</option><option>Office</option><option>Shop</option><option>Building</option><option>Warehouse</option><option>Industrial</option><option>Other</option></select><input id="price" class="input" type="number" min="0" placeholder="Price *"><input id="area" class="input" type="number" min="0" placeholder="Area"><input id="area_unit" class="input" placeholder="Area unit (sq ft)"><input id="bedrooms" class="input" type="number" min="0" placeholder="Bedrooms"><input id="bathrooms" class="input" type="number" min="0" placeholder="Bathrooms"><input id="balconies" class="input" type="number" min="0" placeholder="Balconies"><input id="floor" class="input" type="number" min="0" placeholder="Floor"><input id="total_floors" class="input" type="number" min="0" placeholder="Total floors"><select id="furnishing" class="input"><option value="">Furnishing</option><option>Unfurnished</option><option>Semi-furnished</option><option>Fully furnished</option></select><input id="construction_year" class="input" type="number" min="1800" max="2100" placeholder="Construction year"><input id="possession" class="input" placeholder="Possession (e.g. Ready to move)"><select id="facing" class="input"><option value="">Facing</option><option>North</option><option>South</option><option>East</option><option>West</option><option>North-East</option><option>North-West</option><option>South-East</option><option>South-West</option></select><input id="parking" class="input" placeholder="Parking"><input id="city" class="input" placeholder="City *"><input id="locality" class="input" placeholder="Locality"><input id="district" class="input" placeholder="District *"><input id="state" class="input" placeholder="State *"><input id="pincode" class="input" inputmode="numeric" placeholder="Pincode"><input id="address" class="input full" placeholder="Address"><textarea id="description" class="input full" rows="6" maxlength="5000" placeholder="Property description"></textarea><input id="amenities" class="input full" placeholder="Amenities, comma separated (e.g. Lift, CCTV, Garden)"><div class="en-drop full" id="drop"><strong>Property photos</strong><div class="muted" style="font-size:13px;margin:5px 0 12px">Up to 12 images · JPG, PNG, WEBP or GIF · maximum 8 MB each · first image becomes the cover</div><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple style="max-width:100%"><div id="preview" class="en-file-grid"></div></div></div><div id="message" style="margin-top:14px;min-height:24px" aria-live="polite"></div><button id="submit" class="btn" style="width:100%;margin-top:10px" type="button">Submit for review</button></div></main><script>const API='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0',$=id=>document.getElementById(id);let selected=[];function clearSession(){['en_access_token','en_refresh_token','en_user_id','en_email'].forEach(k=>localStorage.removeItem(k));location.href='/auth?next='+encodeURIComponent('/post')}function timeout(ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return{signal:c.signal,done:()=>clearTimeout(t)}}async function refresh(){const rt=localStorage.getItem('en_refresh_token');if(!rt)return null;const z=timeout(12000);try{const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt}),signal:z.signal});if(!r.ok)return null;const d=await r.json();localStorage.setItem('en_access_token',d.access_token||'');if(d.refresh_token)localStorage.setItem('en_refresh_token',d.refresh_token);if(d.user?.id)localStorage.setItem('en_user_id',d.user.id);if(d.user?.email)localStorage.setItem('en_email',d.user.email);return d.access_token||null}catch{return null}finally{z.done()}}async function getToken(){let t=localStorage.getItem('en_access_token');if(!t)return refresh();let z=timeout(10000);try{const r=await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t},signal:z.signal});if(r.ok)return t}catch{}finally{z.done()}return refresh()}function msg(t,ok=false){$('message').textContent=t;$('message').className=ok?'en-success':'en-error'}function render(){const p=$('preview');p.innerHTML='';selected.forEach((f,i)=>{const d=document.createElement('div');d.className='en-file';d.innerHTML='<img alt="Property photo '+(i+1)+'"><span style="position:absolute;left:6px;bottom:6px;background:#000b;color:#fff;border-radius:7px;padding:4px 7px;font-size:11px">'+(i===0?'Cover':'Photo '+(i+1))+'</span><button type="button" aria-label="Remove photo">×</button>';d.querySelector('img').src=URL.createObjectURL(f);d.querySelector('button').onclick=()=>{selected.splice(i,1);render()};p.appendChild(d)})}$('photos').onchange=()=>{const incoming=[...$('photos').files];if(selected.length+incoming.length>12){msg('You can upload a maximum of 12 photos.');$('photos').value='';return}for(const f of incoming){if(f.size>8*1024*1024){msg(f.name+' is larger than 8 MB.');continue}if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)){msg(f.name+' is not a supported image.');continue}selected.push(f)}$('photos').value='';render()};$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');const incoming=[...e.dataTransfer.files];if(selected.length+incoming.length>12){msg('You can upload a maximum of 12 photos.');return}for(const f of incoming){if(f.size<=8*1024*1024&&/^image\/(jpeg|png|webp|gif)$/.test(f.type))selected.push(f)}render()};async function uploadPhoto(file,uid,token,index){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path='listings/'+uid+'/'+crypto.randomUUID()+'-'+index+'.'+ext,z=timeout(45000);try{const r=await fetch(API+'/storage/v1/object/property-images/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':file.type,'x-upsert':'false','cache-control':'3600'},body:file,signal:z.signal});if(!r.ok){const e=await r.text().catch(()=> '');throw Error('Upload failed for '+file.name+' ('+r.status+'): '+e.slice(0,140))}return API+'/storage/v1/object/public/property-images/'+path}catch(e){if(e.name==='AbortError')throw Error('Upload timed out for '+file.name+'.');throw e}finally{z.done()}}async function submit(){const token=await getToken(),uid=localStorage.getItem('en_user_id');if(!token||!uid){clearSession();return}if(!$('title').value.trim()||!$('price').value||!$('city').value.trim()||!$('district').value.trim()||!$('state').value.trim()){msg('Title, price, city, district and state are required.');return}const body={title:$('title').value.trim(),listing_type:$('listing_type').value,property_type:$('property_type').value,price:Number($('price').value),area:$('area').value?Number($('area').value):null,area_unit:$('area_unit').value.trim()||'sq ft',bedrooms:$('bedrooms').value?Number($('bedrooms').value):null,bathrooms:$('bathrooms').value?Number($('bathrooms').value):null,balconies:$('balconies').value?Number($('balconies').value):null,floor:$('floor').value?Number($('floor').value):null,total_floors:$('total_floors').value?Number($('total_floors').value):null,furnishing:$('furnishing').value||null,construction_year:$('construction_year').value?Number($('construction_year').value):null,possession:$('possession').value.trim()||null,facing:$('facing').value||null,parking:$('parking').value.trim()||null,city:$('city').value.trim(),locality:$('locality').value.trim()||null,district:$('district').value.trim(),state:$('state').value.trim(),pincode:$('pincode').value.trim()||null,address:$('address').value.trim()||null,description:$('description').value.trim()||null,amenities:$('amenities').value.split(',').map(x=>x.trim()).filter(Boolean),owner_id:uid,status:'active',approval_status:'pending',cover_image_url:null,image_urls:[]};$('submit').disabled=true;try{const urls=[];for(let i=0;i<selected.length;i++){msg('Uploading photo '+(i+1)+' of '+selected.length+'…');urls.push(await uploadPhoto(selected[i],uid,token))}body.cover_image_url=urls[0]||null;body.image_urls=urls;msg(selected.length?'Saving listing and photos…':'Saving listing…');let r=await fetch(API+'/rest/v1/listings',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});if(r.status===401){const fresh=await refresh();if(fresh)r=await fetch(API+'/rest/v1/listings',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+fresh,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)})}if(!r.ok){const e=await r.text().catch(()=> '');throw Error('Could not submit the property ('+r.status+'). '+e.slice(0,180))}msg('Property submitted successfully. It is now waiting for admin review.','ok');document.querySelectorAll('input,textarea,select').forEach(e=>{if(!['photos'].includes(e.id))e.value=''});selected=[];render()}catch(e){msg(e.message||'Unable to submit property.')}finally{$('submit').disabled=false}}$('submit').onclick=submit;getToken().then(t=>{if(!t)clearSession()});</script><script src="/site.js"></script></body></html>
