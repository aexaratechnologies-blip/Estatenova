<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova — Property</title><style>:root{--bg:#050816;--text:#f5f7ff;--muted:#9ba9c5;--blue:#2563eb;--violet:#7c3aed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#17316d,transparent 34%),radial-gradient(circle at 90% 0,#40156d,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}.wrap{max-width:1100px;margin:auto;padding:0 20px}.nav{position:sticky;top:0;z-index:30;background:#050816e8;backdrop-filter:blur(20px);border-bottom:1px solid #fff1}.navin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900;color:#fff;text-decoration:none}.g{background:linear-gradient(90deg,#60a5fa,#a78bfa,#e9d5ff);-webkit-background-clip:text;color:transparent}.links{display:flex;gap:20px}.links a{color:#aebbd5;text-decoration:none}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));font-weight:800;text-decoration:none;cursor:pointer}.ghost{background:#ffffff0d;border:1px solid #ffffff18}.panel{margin:38px 0;background:#08132cdd;border:1px solid #ffffff18;border-radius:24px;overflow:hidden}.heroimg{height:min(52vw,520px);background:#14234a}.heroimg img{width:100%;height:100%;object-fit:cover}.body{padding:28px}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:22px}.tag{display:inline-block;padding:6px 10px;border-radius:99px;background:#7c3aed22;color:#c4b5fd;font-size:12px}.price{font-size:32px;font-weight:950;margin:10px 0}.muted{color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.fact{padding:14px;background:#ffffff08;border:1px solid #ffffff12;border-radius:13px}.contact{padding:22px;border-radius:20px}.input{width:100%;padding:12px;background:#07122a;border:1px solid #25365f;border-radius:11px;color:#fff;outline:0;margin:6px 0}.error{color:#fca5a5;min-height:20px}.footer{padding:45px 0;border-top:1px solid #fff2;color:#8998b7}@media(max-width:760px){.grid{grid-template-columns:1fr}.links{display:none}.facts{grid-template-columns:1fr 1fr}}</style></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Estate<span class="g">Nova</span></a><nav class="links"><a href="/">Home</a><a href="/properties?listing=buy">Buy</a><a href="/properties?listing=rent">Rent</a><a href="/post">Sell / Post</a></nav><a class="btn ghost" href="/auth">Sign in</a></div></header><main class="wrap"><div id="root" class="panel">Loading property…</div></main><footer class="footer"><div class="wrap">EstateNova · Verify ownership, title, approvals and dues before any transaction.</div></footer><script>const URL='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0',id=new URLSearchParams(location.search).get('id')||location.pathname.split('/').filter(Boolean).pop();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n)>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':Number(n)>=1e5?'₹'+(n/1e5).toFixed(1)+' L':'₹'+Number(n||0).toLocaleString('en-IN');const getToken=()=>localStorage.getItem('en_access_token');async function load(){if(!id){root.innerHTML='<div class="body"><h2>Property not found</h2></div>';return}const r=await fetch(URL+'/rest/v1/listings?id=eq.'+encodeURIComponent(id)+'&status=eq.active&approval_status=eq.approved&select=*',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});const d=await r.json();const x=d[0];if(!x){root.innerHTML='<div class="body"><h2>Property not found</h2><a class="btn" href="/properties">Back to properties</a></div>';return}const img=x.cover_image_url||'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1400&q=85';root.innerHTML='<div class="heroimg"><img src="'+esc(img)+'" alt="'+esc(x.title)+'"></div><div class="body"><div class="grid"><section><span class="tag">'+esc(x.property_type)+' · '+esc(x.listing_type||'')+'</span><h1>'+esc(x.title)+'</h1><div class="price">'+money(x.price)+'</div><p class="muted">'+esc(x.locality||x.city||'')+' · '+esc(x.district||'')+' · '+esc(x.state||'')+(x.pincode?' · '+esc(x.pincode):'')+'</p><div class="facts">'+(x.bedrooms!=null?'<div class="fact"><b>'+esc(x.bedrooms)+'</b><br><span class="muted">Bedrooms</span></div>':'')+(x.bathrooms!=null?'<div class="fact"><b>'+esc(x.bathrooms)+'</b><br><span class="muted">Bathrooms</span></div>':'')+(x.area!=null?'<div class="fact"><b>'+esc(x.area)+' '+esc(x.area_unit||'sq ft')+'</b><br><span class="muted">Area</span></div>':'')+'</div><h2>Description</h2><p class="muted" style="line-height:1.7">'+esc(x.description||'No description provided.')+'</p></section><aside id="contact" class="contact" style="background:#ffffff08;border:1px solid #ffffff12"><h2>Contact seller</h2><p class="muted">Send your requirement directly from this property page.</p><input id="phone" class="input" placeholder="Your phone (optional)"><textarea id="message" class="input" rows="5" placeholder="I am interested in this property…"></textarea><div id="err" class="error"></div><button class="btn" id="send" style="width:100%">Send inquiry</button></aside></div></div>';send.onclick=()=>inquiry(x)}async function inquiry(x){const token=getToken();if(!token){location.href='/auth?next='+encodeURIComponent(location.pathname+location.search+'#contact');return}const message=document.getElementById('message').value.trim();if(!message){err.textContent='Please enter a message.';return}send.disabled=true;const r=await fetch(URL+'/rest/v1/inquiries',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({listing_id:x.id,seller_id:x.owner_id,buyer_id:localStorage.getItem('en_user_id'),buyer_phone:document.getElementById('phone').value.trim()||null,buyer_email:localStorage.getItem('en_email'),message,status:'new'})});send.disabled=false;if(!r.ok){err.textContent='Unable to send inquiry. Please try again.';return}err.textContent='Inquiry sent successfully.';document.getElementById('message').value=''}load().catch(()=>root.innerHTML='<div class="body"><h2>Unable to load property.</h2></div>');</script></body></html>
