<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="EstateNova property details."><title>EstateNova — Property</title><link rel="stylesheet" href="/site.css"><style>.panel{margin:38px 0;background:var(--en-surface);border:1px solid var(--en-line);border-radius:24px;overflow:hidden;box-shadow:var(--en-shadow)}.heroimg{height:min(58vw,560px);background:var(--en-surface2)}.heroimg img{width:100%;height:100%;object-fit:cover}.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px;background:var(--en-surface2)}.gallery img{width:100%;height:105px;object-fit:cover;border-radius:10px;cursor:pointer}.body{padding:30px}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:25px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.fact{padding:15px;background:var(--en-surface2);border:1px solid var(--en-line);border-radius:13px}.contact{padding:22px;border-radius:20px;background:var(--en-surface2);border:1px solid var(--en-line)}.input{width:100%;padding:12px;background:var(--en-bg);border:1px solid var(--en-line);border-radius:11px;color:var(--en-text);outline:0;margin:6px 0}.error{color:#ef9a9a;min-height:22px}.success{color:#86d99a;min-height:22px}@media(max-width:760px){.grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.gallery{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Estate<span class="g">Nova</span></a><nav class="links"><a href="/">Home</a><a href="/properties?listing=buy">Buy</a><a href="/properties?listing=rent">Rent</a><a href="/post">Sell / Post</a></nav><a id="accountLink" class="btn ghost" href="/auth">Sign in</a></div></header><main class="wrap"><div id="root" class="panel"><div class="en-loading"><div class="en-spinner"></div><span>Loading property…</span></div></div></main><footer class="footer"><div class="wrap">EstateNova · Verify ownership, title, approvals and dues before any transaction.</div></footer><script>const API='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0',id=new URLSearchParams(location.search).get('id')||location.pathname.split('/').filter(Boolean).pop(),root=document.getElementById('root');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n)>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':Number(n)>=1e5?'₹'+(n/1e5).toFixed(1)+' L':'₹'+Number(n||0).toLocaleString('en-IN');function saved(){try{return JSON.parse(localStorage.getItem('en_saved_properties')||'[]')}catch{return[]}}function toggleSave(){let a=saved();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('en_saved_properties',JSON.stringify(a));load()}function timeout(ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return{signal:c.signal,done:()=>clearTimeout(t)}}async function refresh(){const rt=localStorage.getItem('en_refresh_token');if(!rt)return null;const z=timeout(12000);try{const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt}),signal:z.signal});if(!r.ok)return null;const d=await r.json();localStorage.setItem('en_access_token',d.access_token||'');if(d.refresh_token)localStorage.setItem('en_refresh_token',d.refresh_token);if(d.user?.id)localStorage.setItem('en_user_id',d.user.id);if(d.user?.email)localStorage.setItem('en_email',d.user.email);return d.access_token||null}catch{return null}finally{z.done()}}async function getToken(){let t=localStorage.getItem('en_access_token');if(!t)return null;const z=timeout(8000);try{const r=await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t},signal:z.signal});if(r.ok)return t}catch{}finally{z.done()}return refresh()}async function setupAccount(){const link=document.getElementById('accountLink');if(await getToken()){link.textContent='My Profile';link.href='/profile'}}async function load(){try{if(!id)throw Error('Property not found.');const z=timeout(12000),r=await fetch(API+'/rest/v1/listings?id=eq.'+encodeURIComponent(id)+'&status=eq.active&approval_status=eq.approved&select=*',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},signal:z.signal});z.done();if(!r.ok)throw Error('Property could not be loaded.');const d=await r.json(),x=d[0];if(!x){root.innerHTML='<div class="body"><h2>Property not found</h2><a class="btn" href="/properties">Back to properties</a></div>';return}const images=Array.isArray(x.image_urls)&&x.image_urls.length?x.image_urls:(x.cover_image_url?[x.cover_image_url]:[]),img=images[0]||'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1400&q=85',is=saved().includes(x.id),gallery=images.length>1?'<div class="gallery">'+images.map((u,i)=>'<img loading="lazy" src="'+esc(u)+'" alt="Property photo '+(i+1)+'" onclick="document.getElementById(\'hero\').src=this.src">').join('')+'</div>':'';const facts=[['Bedrooms',x.bedrooms],['Bathrooms',x.bathrooms],['Area',x.area!=null?x.area+' '+(x.area_unit||'sq ft'):null],['Balconies',x.balconies],['Floor',x.floor!=null?(x.floor+(x.total_floors!=null?' / '+x.total_floors:'')):null],['Furnishing',x.furnishing],['Facing',x.facing],['Parking',x.parking],['Possession',x.possession],['Construction',x.construction_year]].filter(a=>a[1]!=null&&a[1]!=='').map(a=>'<div class="fact"><b>'+esc(a[1])+'</b><br><span class="muted">'+esc(a[0])+'</span></div>').join('');root.innerHTML='<div class="heroimg"><img id="hero" src="'+esc(img)+'" alt="'+esc(x.title)+'"></div>'+gallery+'<div class="body"><div class="grid"><section><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><span class="tag">'+esc(x.property_type)+' · '+esc(x.listing_type||'')+'</span><h1>'+esc(x.title)+'</h1></div><button class="btn ghost" onclick="toggleSave()">'+(is?'♥ Saved':'♡ Save')+'</button></div><div class="price">'+money(x.price)+'</div><p class="muted">'+esc([x.locality||x.city,x.district,x.state,x.pincode].filter(Boolean).join(' · '))+'</p><div class="facts">'+facts+'</div><h2>Description</h2><p class="muted" style="line-height:1.75;white-space:pre-wrap">'+esc(x.description||'No description provided.')+'</p>'+(Array.isArray(x.amenities)&&x.amenities.length?'<h2>Amenities</h2><p>'+x.amenities.map(a=>'<span class="tag" style="margin:3px">'+esc(a)+'</span>').join('')+'</p>':'')+'</section><aside id="contact" class="contact"><h2>Contact seller</h2><p class="muted">Send your requirement directly from this property page.</p><input id="phone" class="input" placeholder="Your phone (optional)"><textarea id="message" class="input" rows="5" placeholder="I am interested in this property…"></textarea><div id="err" class="error" aria-live="polite"></div><button class="btn" id="send" style="width:100%" type="button">Send inquiry</button></aside></div></div>';document.getElementById('send').onclick=()=>inquiry(x)}catch(e){root.innerHTML='<div class="body"><h2>Unable to load property</h2><p class="muted">'+esc(e.message||'Please try again.')+'</p><a class="btn" href="/properties">Back to properties</a></div>'}}async function inquiry(x){const send=document.getElementById('send'),err=document.getElementById('err');let token=await getToken();if(!token){location.href='/auth?next='+encodeURIComponent(location.pathname+location.search+'#contact');return}const msg=document.getElementById('message').value.trim();if(!msg){err.textContent='Please enter a message.';return}send.disabled=true;err.textContent='Sending…';const body={listing_id:x.id,seller_id:x.owner_id,buyer_id:localStorage.getItem('en_user_id'),buyer_phone:document.getElementById('phone').value.trim()||null,buyer_email:localStorage.getItem('en_email'),message:msg,status:'new'};try{let r=await fetch(API+'/rest/v1/inquiries',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});if(r.status===401){token=await refresh();if(token)r=await fetch(API+'/rest/v1/inquiries',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)})}if(!r.ok){const e=await r.text().catch(()=> '');throw Error('Unable to send inquiry ('+r.status+'). '+e.slice(0,120))}err.className='success';err.textContent='Inquiry sent successfully.';document.getElementById('message').value=''}catch(e){err.className='error';err.textContent=e.message}finally{send.disabled=false}}setupAccount();load();</script><script src="/site.js"></script></body></html>
