<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search EstateNova property listings."><title>EstateNova — Properties</title><link rel="stylesheet" href="/site.css"><style>.head{padding:44px 0 22px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:9px;padding:14px;border-radius:18px;margin:18px 0 28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--en-surface);border:1px solid var(--en-line);border-radius:20px;overflow:hidden;box-shadow:var(--en-shadow)}.pic{height:225px;background:var(--en-surface2);position:relative}.pic img{width:100%;height:100%;object-fit:cover}.save{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:1px solid #fff4;background:#07101dcc;color:#fff;cursor:pointer;font-size:20px}.body{padding:16px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:rgba(79,124,255,.1);color:#7da0ff;font-size:11px}.price{font-size:21px;font-weight:900;margin-top:7px}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}.empty{padding:35px;text-align:center;grid-column:1/-1}.footer{padding:45px 0;margin-top:60px;border-top:1px solid var(--en-line);color:var(--en-muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.filters{grid-template-columns:1fr}.head{padding-top:28px}}</style></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Estate<span class="g">Nova</span></a><nav class="links"><a href="/">Home</a><a href="/properties?listing=buy">Buy</a><a href="/properties?listing=rent">Rent</a><a href="/post">Sell / Post</a><a href="/properties?saved=1">Saved</a></nav><a id="accountLink" class="btn ghost" href="/auth">Sign in</a></div></header><main class="wrap"><section class="head"><div style="display:flex;justify-content:space-between;gap:15px;align-items:end"><div><span class="tag">ESTATENOVA SEARCH</span><h1 id="title">Properties</h1><p class="muted" id="summary">Loading matching properties…</p></div><a class="btn ghost" href="/">New search</a></div><div class="glass filters"><input id="q" class="input" placeholder="City, locality, property…"><select id="state" class="input"><option value="">All states</option></select><input id="district" class="input" placeholder="District"><select id="type" class="input"><option value="">Any property type</option><option>Apartment</option><option>Flat</option><option>House</option><option>Villa</option><option>Plot / Land</option><option>Commercial</option><option>Office</option><option>Shop</option><option>Building</option><option>Warehouse</option><option>Industrial</option><option>Other</option></select><button class="btn" id="apply" type="button">Search</button></div><div id="savedHint" class="muted" style="display:none;margin:-14px 0 18px">Showing only properties you saved.</div><div class="grid" id="cards"></div></section></main><footer class="footer"><div class="wrap"><b>EstateNova</b><p>Verify ownership, title, approvals, dues and identity before any transaction.</p></div></footer><script>const URL='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0',params=new URLSearchParams(location.search),savedOnly=params.get('saved')==='1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n)>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':Number(n)>=1e5?'₹'+(n/1e5).toFixed(1)+' L':'₹'+Number(n||0).toLocaleString('en-IN');const states=['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Delhi','Jammu and Kashmir','Ladakh','Puducherry'];state.innerHTML='<option value="">All states</option>'+states.map(x=>'<option>'+esc(x)+'</option>').join('');q.value=params.get('q')||'';state.value=params.get('state')||'';district.value=params.get('district')||'';type.value=params.get('type')||'';if(savedOnly)document.getElementById('savedHint').style.display='block';function saved(){try{return JSON.parse(localStorage.getItem('en_saved_properties')||'[]')}catch{return[]}}function toggleSave(id){let a=saved();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('en_saved_properties',JSON.stringify(a));load()}function card(x){const is=saved().includes(x.id),img=x.cover_image_url||'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1000&q=80';return '<article class="card"><div class="pic"><img loading="lazy" src="'+esc(img)+'" alt="'+esc(x.title)+'"><button class="save" type="button" aria-label="'+(is?'Remove from saved':'Save property')+'" onclick="toggleSave(\''+esc(x.id)+'\')">'+(is?'♥':'♡')+'</button></div><div class="body"><span class="tag">'+esc(x.property_type)+' · '+esc(x.listing_type||'')+'</span><div class="price">'+money(x.price)+'</div><h3>'+esc(x.title)+'</h3><div class="muted">'+esc([x.locality||x.city,x.district,x.state].filter(Boolean).join(' · '))+'</div><div class="actions"><a class="btn ghost" href="/property/'+encodeURIComponent(x.id)+'">View details</a><a class="btn" href="/property/'+encodeURIComponent(x.id)+'#contact">Contact</a></div></div></article>'}function go(){const p=new URLSearchParams();if(q.value.trim())p.set('q',q.value.trim());if(state.value)p.set('state',state.value);if(district.value.trim())p.set('district',district.value.trim());if(type.value)p.set('type',type.value);if(params.get('listing'))p.set('listing',params.get('listing'));location.href='/properties?'+p.toString()}apply.onclick=go;[q,district].forEach(e=>e.addEventListener('keydown',x=>x.key==='Enter'&&go()));async function setupAccount(){const link=document.getElementById('accountLink'),t=localStorage.getItem('en_access_token');if(!t)return;try{const r=await fetch(URL+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t}});if(r.ok){link.textContent='My Profile';link.href='/profile'}}catch{}}async function load(){const grid=document.getElementById('cards');grid.innerHTML='<div class="glass" style="padding:28px;grid-column:1/-1">Loading properties…</div>';try{const r=await fetch(URL+'/rest/v1/listings?select=*&status=eq.active&approval_status=eq.approved&order=created_at.desc&limit=100',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error();let data=await r.json();if(!Array.isArray(data))data=[];const text=(params.get('q')||'').toLowerCase(),st=(params.get('state')||'').toLowerCase(),di=(params.get('district')||'').toLowerCase(),ty=(params.get('type')||'').toLowerCase(),lt=(params.get('listing')||'').toLowerCase();data=data.filter(x=>(!text||[x.title,x.city,x.locality,x.district,x.state,x.description].some(v=>String(v||'').toLowerCase().includes(text)))&&(!st||String(x.state||'').toLowerCase()===st)&&(!di||String(x.district||'').toLowerCase()===di)&&(!ty||String(x.property_type||'').toLowerCase()===ty));if(lt==='buy')data=data.filter(x=>/sale|buy/i.test(String(x.listing_type||'')));if(lt==='rent')data=data.filter(x=>/rent|lease/i.test(String(x.listing_type||'')));if(savedOnly){const ids=saved();data=data.filter(x=>ids.includes(x.id))}const place=[params.get('q'),params.get('district'),params.get('state')].filter(Boolean).join(', ');title.textContent=savedOnly?'Saved properties':(params.get('listing')==='rent'?'Properties for Rent':params.get('listing')==='buy'?'Properties for Sale':'Properties');summary.textContent=data.length+' matching '+(savedOnly?'saved ':'')+'approved listing'+(data.length===1?'':'s')+(place?' for '+place:'');grid.innerHTML=data.length?data.map(card).join(''):'<div class="glass empty"><h3>No properties found</h3><p class="muted">Try another search, or save properties to build your shortlist.</p><a class="btn" href="/">Start a new search</a></div>'}catch{grid.innerHTML='<div class="en-error" style="grid-column:1/-1">Properties could not be loaded right now. Please retry.</div>'}}setupAccount();load();</script><script src="/site.js"></script></body></html>
