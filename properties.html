<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova — Property Search</title><meta name="description" content="Property search results on EstateNova."><style>:root{--bg:#050816;--text:#f5f7ff;--muted:#9ba9c5;--line:#26365e;--blue:#2563eb;--violet:#7c3aed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#17316d,transparent 34%),radial-gradient(circle at 90% 0,#40156d,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}.wrap{max-width:1220px;margin:auto;padding:0 20px}.nav{position:sticky;top:0;z-index:50;background:#050816e8;backdrop-filter:blur(20px);border-bottom:1px solid #fff1}.navin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900;color:#fff;text-decoration:none}.g{background:linear-gradient(90deg,#60a5fa,#a78bfa,#e9d5ff);-webkit-background-clip:text;color:transparent}.links{display:flex;gap:20px}.links a{color:#aebbd5;text-decoration:none;font-size:14px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:11px 15px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));font-weight:800;text-decoration:none;cursor:pointer}.ghost{background:#ffffff0d;border:1px solid #ffffff18}.head{padding:42px 0 20px}.head h1{font-size:clamp(32px,5vw,54px);margin:0 0 8px}.muted{color:var(--muted)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:9px;padding:14px;border-radius:18px;margin:18px 0 30px}.input{width:100%;background:#07122a;border:1px solid #25365f;color:#fff;padding:12px;border-radius:11px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(180deg,#101c3b,#08122a);border:1px solid #ffffff12;border-radius:20px;overflow:hidden}.pic{height:220px;background:#14234a}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#7c3aed22;color:#c4b5fd;font-size:11px}.price{font-size:21px;font-weight:900;margin-top:7px}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}.empty{padding:32px;text-align:center;grid-column:1/-1}.footer{padding:45px 0;margin-top:60px;border-top:1px solid #fff2;color:#8998b7}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.links{display:none}}@media(max-width:560px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.head{padding-top:28px}}</style></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Estate<span class="g">Nova</span></a><nav class="links"><a href="/">Home</a><a href="/properties?listing=buy">Buy</a><a href="/properties?listing=rent">Rent</a><a href="/post">Sell / Post</a></nav><a id="accountLink" class="btn ghost" href="/auth">Sign in</a></div></header><main class="wrap"><section class="head"><div style="display:flex;justify-content:space-between;gap:15px;align-items:end"><div><span class="tag">DEDICATED RESULTS</span><h1 id="title">Property search</h1><p class="muted" id="summary">Loading matching properties…</p></div><a class="btn ghost" href="/">New search</a></div><div class="filters" style="background:#08132cdd;border:1px solid #ffffff18"><input id="q" class="input" placeholder="City, locality, property…"><select id="state" class="input"><option value="">All states</option></select><input id="district" class="input" placeholder="District"><select id="type" class="input"><option value="">Any property type</option><option>Apartment</option><option>Flat</option><option>House</option><option>Villa</option><option>Plot / Land</option><option>Commercial</option><option>Office</option><option>Shop</option><option>Building</option></select><button class="btn" id="apply">Search</button></div><div class="grid" id="cards"></div></section></main><footer class="footer"><div class="wrap"><b>EstateNova</b><p>Verify title, ownership, approvals, dues and identity before any transaction.</p></div></footer><script>const URL='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0';const params=new URLSearchParams(location.search);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n)>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':Number(n)>=1e5?'₹'+(n/1e5).toFixed(1)+' L':'₹'+Number(n||0).toLocaleString('en-IN');const states=['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Delhi','Jammu and Kashmir','Ladakh','Puducherry'];state.innerHTML='<option value="">All states</option>'+states.map(x=>'<option>'+esc(x)+'</option>').join('');q.value=params.get('q')||'';state.value=params.get('state')||'';district.value=params.get('district')||'';type.value=params.get('type')||'';function card(x){const img=x.cover_image_url||'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1000&q=80';return '<article class="card"><div class="pic"><img src="'+esc(img)+'" alt="Property image"></div><div class="body"><span class="tag">'+esc(x.property_type)+' · '+esc(x.listing_type||'')+'</span><div class="price">'+money(x.price)+'</div><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(x.locality||x.city||'')+' · '+esc(x.district||'')+' · '+esc(x.state||'')+'</div><div class="actions"><a class="btn ghost" href="/property/'+encodeURIComponent(x.id)+'">View details</a><a class="btn" href="/property/'+encodeURIComponent(x.id)+'#contact">Contact</a></div></div></article>'}function go(){const p=new URLSearchParams();if(q.value.trim())p.set('q',q.value.trim());if(state.value)p.set('state',state.value);if(district.value.trim())p.set('district',district.value.trim());if(type.value)p.set('type',type.value);if(params.get('listing'))p.set('listing',params.get('listing'));location.href='/properties?'+p.toString()}apply.onclick=go;[q,district].forEach(e=>e.addEventListener('keydown',x=>x.key==='Enter'&&go()));async function setupAccount(){const link=document.getElementById('accountLink'),t=localStorage.getItem('en_access_token');if(!t)return;let r=await fetch(URL+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t}});if(!r.ok){const rt=localStorage.getItem('en_refresh_token');if(!rt)return;const rr=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});if(!rr.ok)return;const d=await rr.json();localStorage.setItem('en_access_token',d.access_token);if(d.refresh_token)localStorage.setItem('en_refresh_token',d.refresh_token)}link.textContent='My Profile';link.href='/profile'}async function load(){let url=URL+'/rest/v1/listings?select=*&status=eq.active&approval_status=eq.approved&order=created_at.desc&limit=100';const r=await fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});let data=await r.json();if(!Array.isArray(data))data=[];const text=(params.get('q')||'').toLowerCase();const st=(params.get('state')||'').toLowerCase();const di=(params.get('district')||'').toLowerCase();const ty=(params.get('type')||'').toLowerCase();const lt=(params.get('listing')||'').toLowerCase();data=data.filter(x=>(!text||[x.title,x.city,x.locality,x.district,x.state,x.description].some(v=>String(v||'').toLowerCase().includes(text)))&&(!st||String(x.state||'').toLowerCase()===st)&&(!di||String(x.district||'').toLowerCase()===di)&&(!ty||String(x.property_type||'').toLowerCase()===ty));if(lt==='buy')data=data.filter(x=>/sale|buy/i.test(String(x.listing_type||'')));if(lt==='rent')data=data.filter(x=>/rent|lease/i.test(String(x.listing_type||'')));const place=[params.get('q'),params.get('district'),params.get('state')].filter(Boolean).join(', ');title.textContent=(params.get('type')?params.get('type')+' ':'')+(params.get('listing')==='rent'?'Properties for Rent':params.get('listing')==='buy'?'Properties for Sale':'Properties');summary.textContent=(data.length+' matching approved listing'+(data.length===1?'':'s'))+(place?' for '+place:'')+(params.get('type')?' · '+params.get('type'):'');cards.innerHTML=data.length?data.map(card).join(''):'<div class="card empty"><h3>No matching properties found</h3><p class="muted">Try another city, district, property type or listing category.</p><a class="btn" href="/">Start a new search</a></div>'}setupAccount();load().catch(()=>cards.innerHTML='<div class="card empty">Unable to load properties right now.</div>');</script></body></html>
