<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova — Sign in</title><style>:root{--bg:#050816;--text:#f5f7ff;--muted:#9ba9c5;--blue:#2563eb;--violet:#7c3aed}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#17316d,transparent 34%),radial-gradient(circle at 90% 0,#40156d,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}button,input,select{font:inherit}.wrap{width:min(470px,100%)}.brand{display:block;text-align:center;font-size:31px;font-weight:950;color:#fff;text-decoration:none;margin-bottom:24px}.g{background:linear-gradient(90deg,#60a5fa,#a78bfa,#e9d5ff);-webkit-background-clip:text;color:transparent}.panel{background:#08132cdd;border:1px solid #ffffff18;backdrop-filter:blur(18px);border-radius:26px;padding:26px;box-shadow:0 25px 80px #0006}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}.tab{padding:12px;border-radius:11px;border:1px solid #ffffff12;background:#ffffff08;color:#aebbd5;cursor:pointer;font-weight:800}.tab.active{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.input{width:100%;padding:13px;background:#07122a;border:1px solid #25365f;color:#fff;border-radius:11px;outline:0;margin:6px 0}.input:focus{border-color:#6d7efc;box-shadow:0 0 0 3px #5865f233}.btn{width:100%;padding:13px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed);font-weight:900;cursor:pointer;margin-top:10px}.ghost{background:#ffffff0d;border:1px solid #ffffff18}.muted{color:var(--muted)}.error{color:#fca5a5;min-height:22px;margin-top:9px;font-size:13px}.success{color:#86efac;min-height:22px;margin-top:9px;font-size:13px}.back{text-align:center;margin-top:18px}.back a{color:#b9c8e6;text-decoration:none}@media(max-width:480px){.panel{padding:20px}}</style></head><body><div class="wrap"><a class="brand" href="/">Estate<span class="g">Nova</span></a><div class="panel"><div class="tabs"><button id="loginTab" class="tab active">Sign in</button><button id="signupTab" class="tab">Create account</button></div><h1 id="heading" style="margin:0 0 7px">Welcome back</h1><p id="sub" class="muted">Sign in to your EstateNova account.</p><div id="signupFields" style="display:none"><input id="name" class="input" placeholder="Full name"><select id="role" class="input"><option value="buyer">Buyer</option><option value="seller">Seller</option><option value="broker">Broker</option></select></div><input id="email" class="input" type="email" autocomplete="email" placeholder="Email address"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button id="show" class="btn ghost" type="button">Show password</button><div id="message" class="error"></div><button id="submit" class="btn">Sign in</button><div class="back"><a href="/">← Back to EstateNova</a></div></div></div><script>const API='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0',CREATE=API+'/functions/v1/create-estatenova-user';const next=new URLSearchParams(location.search).get('next')||'/';let mode='login';function setMode(m){mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');signupFields.style.display=m==='signup'?'block':'none';heading.textContent=m==='login'?'Welcome back':'Create your account';sub.textContent=m==='login'?'Sign in to your EstateNova account.':'Create an EstateNova account and continue immediately.';submit.textContent=m==='login'?'Sign in':'Create account';message.textContent='';message.className='error'}loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');show.onclick=()=>{password.type=password.type==='password'?'text':'password';show.textContent=password.type==='password'?'Show password':'Hide password'};function valid(){const e=email.value.trim(),p=password.value;if(!/^\S+@\S+\.\S+$/.test(e)){message.textContent='Enter a valid email address.';return false}if(p.length<6){message.textContent='Password must be at least 6 characters.';return false}if(mode==='signup'&&!name.value.trim()){message.textContent='Enter your full name.';return false}return true}async function signIn(){const r=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok){message.textContent='Email or password is incorrect.';return false}localStorage.setItem('en_access_token',d.access_token);localStorage.setItem('en_refresh_token',d.refresh_token||'');localStorage.setItem('en_user_id',d.user?.id||'');localStorage.setItem('en_email',d.user?.email||email.value.trim());return true}async function refreshSession(){const rt=localStorage.getItem('en_refresh_token');if(!rt)return null;const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});if(!r.ok){localStorage.removeItem('en_access_token');localStorage.removeItem('en_refresh_token');localStorage.removeItem('en_user_id');return null}const d=await r.json();localStorage.setItem('en_access_token',d.access_token);if(d.refresh_token)localStorage.setItem('en_refresh_token',d.refresh_token);if(d.user?.id)localStorage.setItem('en_user_id',d.user.id);if(d.user?.email)localStorage.setItem('en_email',d.user.email);return d.access_token}async function ensureSession(){let token=localStorage.getItem('en_access_token');if(!token)return null;let r=await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(r.ok)return token;return await refreshSession()}async function create(){const r=await fetch(CREATE,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok){message.textContent=d.error||'Unable to create account.';return false}return true}async function profile(){const token=localStorage.getItem('en_access_token');if(!token)return;const id=localStorage.getItem('en_user_id');if(!id)return;await fetch(API+'/rest/v1/profiles?on_conflict=id',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,email:email.value.trim(),full_name:name.value.trim()||null,role:role.value||'buyer'})})}submit.onclick=async()=>{if(!valid())return;submit.disabled=true;message.textContent='';try{if(mode==='signup'){const ok=await create();if(!ok)return;const logged=await signIn();if(!logged)return;await profile();message.className='success';message.textContent='Account created. Opening EstateNova…'}else{const logged=await signIn();if(!logged)return;message.className='success';message.textContent='Signed in. Opening EstateNova…'}setTimeout(()=>location.href=next,350)}catch{message.className='error';message.textContent='Unable to complete this action. Please try again.'}finally{submit.disabled=false}};ensureSession().then(token=>{if(token&&new URLSearchParams(location.search).get('force')!=='1')location.href='/profile?next='+encodeURIComponent(next)});if(new URLSearchParams(location.search).get('mode')==='signup')setMode('signup');</script></body></html>
