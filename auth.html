<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in or create a SELLB2 account."><title>SELLB2 — Sign in</title><link rel="stylesheet" href="/site.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:20px}.wrap{width:min(480px,100%)}.brand{display:block;text-align:center;font-size:32px;font-weight:950;color:var(--en-text);text-decoration:none;margin-bottom:24px}.panel{padding:28px;background:var(--en-surface);border:1px solid var(--en-line);border-radius:26px;box-shadow:var(--en-shadow)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}.tab{padding:12px;border-radius:11px;border:1px solid var(--en-line);background:var(--en-surface2);color:var(--en-muted);cursor:pointer;font-weight:800}.tab.active{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-color:transparent}.input{width:100%;padding:13px;background:var(--en-bg);border:1px solid var(--en-line);color:var(--en-text);border-radius:11px;outline:0;margin:6px 0}.btn{width:100%;margin-top:10px}.error{color:#ef6f8a;min-height:22px;margin-top:9px;font-size:13px}.success{color:#59c98b;min-height:22px;margin-top:9px;font-size:13px}.back{text-align:center;margin-top:18px}.back a{color:var(--en-muted)}</style></head><body><div class="wrap"><a class="brand" href="/">SELL<span class="g">B2</span></a><div class="panel en-reveal"><div class="tabs"><button id="loginTab" class="tab active" type="button">Sign in</button><button id="signupTab" class="tab" type="button">Create account</button></div><h1 id="heading" style="margin:0 0 7px">Welcome back</h1><p id="sub" class="muted">Sign in to your SELLB2 account.</p><div id="signupFields" style="display:none"><input id="name" class="input" placeholder="Full name" autocomplete="name"><select id="role" class="input"><option value="buyer">Buyer</option><option value="seller">Seller</option><option value="broker">Broker</option></select></div><input id="email" class="input" type="email" autocomplete="email" placeholder="Email address"><input id="password" class="input" type="password" autocomplete="new-password" placeholder="Password"><button id="show" class="btn ghost" type="button">Show password</button><div id="message" class="error" aria-live="polite"></div><button id="submit" class="btn" type="button">Sign in</button><div class="back"><a href="/">← Back to SELLB2</a></div></div></div><script>const API='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0',CREATE=API+'/functions/v1/create-estatenova-user',next=new URLSearchParams(location.search).get('next')||'/profile';let mode='login';const $=id=>document.getElementById(id);function setMode(m){mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');signupFields.style.display=m==='signup'?'block':'none';heading.textContent=m==='login'?'Welcome back':'Create your account';sub.textContent=m==='login'?'Sign in to your SELLB2 account.':'Create a SELLB2 account and continue immediately.';submit.textContent=m==='login'?'Sign in':'Create account';password.autocomplete=m==='signup'?'new-password':'current-password';message.textContent='';message.className='error'}function setMsg(t,ok=false){message.textContent=t;message.className=ok?'success':'error'}loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');show.onclick=()=>{password.type=password.type==='password'?'text':'password';show.textContent=password.type==='password'?'Show password':'Hide password'};function valid(){const e=email.value.trim(),p=password.value;if(!/^\S+@\S+\.\S+$/.test(e)){setMsg('Enter a valid email address.');return false}if(p.length<6){setMsg('Password must be at least 6 characters.');return false}if(mode==='signup'&&!name.value.trim()){setMsg('Enter your full name.');return false}return true}async function req(url,opt){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{return await fetch(url,{...opt,signal:c.signal})}catch(e){if(e.name==='AbortError')throw Error('The server took too long to respond. Please try again.');throw e}finally{clearTimeout(t)}}function saveSession(s){if(!s?.access_token||!s?.refresh_token)return false;localStorage.setItem('en_access_token',s.access_token);localStorage.setItem('en_refresh_token',s.refresh_token);localStorage.setItem('en_user_id',s.user?.id||'');localStorage.setItem('en_email',s.user?.email||email.value.trim());return true}async function signIn(){const r=await req(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})}),d=await r.json().catch(()=>({}));if(!r.ok){setMsg('Email or password is incorrect.');return false}return saveSession(d)}async function create(){const r=await req(CREATE,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value,full_name:name.value.trim(),role:role.value||'buyer'})}),d=await r.json().catch(()=>({}));if(!r.ok){setMsg(d.error||'Unable to create account.');return false}if(d.session&&saveSession(d.session))return true;setMsg('Account created, but login session could not be established. Please sign in.',false);return false}submit.onclick=async()=>{if(!valid())return;submit.disabled=true;setMsg(mode==='signup'?'Creating account…':'Signing in…');try{if(mode==='signup'){if(!await create())return;setMsg('Account created. Opening SELLB2…',true)}else{if(!await signIn())return;setMsg('Signed in. Opening SELLB2…',true)}setTimeout(()=>location.href=next,250)}catch(e){setMsg(e.message||'Unable to complete this action.')}finally{submit.disabled=false}};async function boot(){const t=localStorage.getItem('en_access_token');if(!t)return;const r=await req(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t}}).catch(()=>null);if(r?.ok&&new URLSearchParams(location.search).get('force')!=='1')location.href='/profile?next='+encodeURIComponent(next)}boot();if(new URLSearchParams(location.search).get('mode')==='signup')setMode('signup');</script><script src="/site.js"></script></body></html>
