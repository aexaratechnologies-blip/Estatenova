<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>EstateNova Admin Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#050816;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.eyebrow{font-size:10px;letter-spacing:3px;color:#91a0bf}.muted{color:#93a4c7}.btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font:inherit;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card{background:#0b1530;border:1px solid #ffffff15;border-radius:20px;padding:20px}.stat{cursor:pointer;transition:.15s}.stat:active{transform:scale(.98)}.label{color:#aab8d5}.n{font-size:34px;font-weight:900;margin-top:6px}.hint{font-size:12px;color:#7182a8;margin-top:7px}.panel{margin-top:14px}.row{padding:13px 0;border-top:1px solid #ffffff15;display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.ok{background:#18a874}.danger{background:#9d294a}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.top h1{font-size:26px}.row{display:block}.row .actions{margin-top:9px}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">ESTATENOVA CONTROL CENTER</div><h1>Admin Dashboard</h1><div class="muted">Connected to EstateNova data</div></div><button class="btn" onclick="logout()">Sign out</button></div><div id="app">Loading dashboard…</div></div><script>'use strict';const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console',token=sessionStorage.getItem('estatenova_admin_session');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(a,x={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token||''},cache:'no-store',body:JSON.stringify({action:a,...x})});if(r.status===401){sessionStorage.removeItem('estatenova_admin_session');location.href='/admin';throw Error('Session expired')}if(!r.ok)throw Error('Admin service error');return r.json()}async function load(){if(!token){location.href='/admin';return}try{const d=await api('overview');const listings=Array.isArray(d.listings)?d.listings:[],users=Array.isArray(d.users)?d.users:[],inquiries=Array.isArray(d.inquiries)?d.inquiries:[],pending=listings.filter(x=>String(x.approval_status||'pending').toLowerCase()==='pending');$('app').innerHTML='<div class="grid"><div class="card stat" onclick="location.href=\'/admin-properties\'"><div class="label">Properties</div><div class="n">'+listings.length+'</div><div class="hint">Open all properties →</div></div><div class="card stat" onclick="location.href=\'/admin-pending\'"><div class="label">Pending approvals</div><div class="n">'+pending.length+'</div><div class="hint">Review pending listings →</div></div><div class="card stat" onclick="location.href=\'/admin-users\'"><div class="label">Registered users</div><div class="n">'+users.length+'</div><div class="hint">Buyers / sellers / all →</div></div><div class="card stat" onclick="location.href=\'/admin-inquiries\'"><div class="label">Inquiries</div><div class="n">'+inquiries.length+'</div><div class="hint">Open every inquiry →</div></div></div><div class="card panel"><h2>Recent properties</h2>'+(listings.length?listings.slice(0,8).map(x=>'<div class="row"><div><b>'+esc(x.title||'Untitled property')+'</b><div class="muted">'+esc([x.locality,x.city,x.state].filter(Boolean).join(', '))+' · '+esc(x.approval_status||'pending')+'</div></div><div class="actions"><button class="btn ok" onclick="act(\''+esc(x.id)+'\',\'approved\')">Approve</button><button class="btn" onclick="act(\''+esc(x.id)+'\',\'rejected\')">Reject</button><button class="btn danger" onclick="del(\''+esc(x.id)+'\')">Delete</button></div></div>').join(''):'<p class="muted">No properties found.</p>')+'</div>'}catch(e){$('app').innerHTML='<div class="card"><h2>Dashboard error</h2><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="load()">Retry</button></div>'}}async function act(id,status){try{await api('approval',{id,status});await load()}catch(e){alert(e.message)}}async function del(id){if(confirm('Delete this property permanently?')){try{await api('delete_listing',{id});await load()}catch(e){alert(e.message)}}}function logout(){sessionStorage.removeItem('estatenova_admin_session');location.href='/admin'}load();</script></body></html>
