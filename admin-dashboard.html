<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova Admin Dashboard</title><style>body{margin:0;background:#050816;color:#fff;font-family:system-ui}.wrap{max-width:1200px;margin:auto;padding:25px}.card{background:#0b1530;border:1px solid #ffffff15;border-radius:18px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.n{font-size:30px;font-weight:900}button{padding:10px 14px;border:0;border-radius:10px;background:#6d4aff;color:#fff;font-weight:700;cursor:pointer}.ok{background:#18a874}.danger{background:#9d294a}.row{padding:12px;border-top:1px solid #ffffff15}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>EstateNova Admin</h1><button onclick="logout()">Sign out</button><div id="app">Loading…</div></div><script>const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console',t=sessionStorage.getItem('estatenova_admin_session');if(!t)location.replace('/admin');async function api(a,x={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','x-admin-token':t},body:JSON.stringify({action:a,...x})});if(!r.ok){sessionStorage.removeItem('estatenova_admin_session');location.replace('/admin');throw Error('Unauthorized')}return r.json()}async function load(){try{const d=await api('overview');document.getElementById('app').innerHTML='<div class="grid"><div class="card">Listings<div class="n">'+d.listings.length+'</div></div><div class="card">Pending<div class="n">'+d.listings.filter(x=>x.approval_status==='pending').length+'</div></div><div class="card">Users<div class="n">'+d.users.length+'</div></div><div class="card">Inquiries<div class="n">'+d.inquiries.length+'</div></div></div><div class="card"><h2>Listings</h2>'+d.listings.map(x=>'<div class="row"><b>'+esc(x.title||'Untitled')+'</b> — '+esc(x.city||'')+' · '+esc(x.approval_status||'pending')+' <button class="ok" onclick="act(\''+x.id+'\',\'approved\')">Approve</button> <button onclick="act(\''+x.id+'\',\'rejected\')">Reject</button> <button class="danger" onclick="del(\''+x.id+'\')">Delete</button></div>').join('')+'</div>'}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function act(id,status){await api('approval',{id,status});load()}async function del(id){if(confirm('Delete permanently?')){await api('delete_listing',{id});load()}}function logout(){sessionStorage.removeItem('estatenova_admin_session');location.replace('/admin')}load();</script></body></html>
