<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>SELLB2 Admin Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#050816;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.eyebrow{font-size:10px;letter-spacing:3px;color:#91a0bf}.muted{color:#93a4c7}.btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font:inherit;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.card{background:#0b1530;border:1px solid #ffffff15;border-radius:20px;padding:20px}.stat{cursor:pointer;transition:.15s}.stat:active{transform:scale(.98)}.label{color:#aab8d5}.n{font-size:34px;font-weight:900;margin-top:6px}.hint{font-size:12px;color:#7182a8;margin-top:7px}.row{padding:13px 0;border-top:1px solid #ffffff15;display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#ffffff12;color:#c8d4ee;font-size:10px;margin-left:6px}.notify-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}.notify-form label{display:block;color:#aab8d5;font-size:13px;margin:12px 0}.notify-form input,.notify-form textarea,.notify-form select{display:block;width:100%;margin-top:7px;padding:13px;border-radius:12px;border:1px solid #26375f;background:#07112a;color:#fff;font:inherit}.notify-form textarea{min-height:140px;resize:vertical}.sendbtn{width:100%;margin-top:8px}.success{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#0c5c42;color:#b7ffe5}.error{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#63233a;color:#ffd0dc}.notice-link{display:inline-block;margin-top:10px;color:#9fc0ff;text-decoration:none}.notice-item{padding:13px 0;border-top:1px solid #ffffff15}.notice-item h3{margin:0 0 5px;font-size:15px}.notice-item p{margin:0 0 6px;white-space:pre-wrap;color:#c8d4ee;line-height:1.45}.notice-meta{font-size:11px;color:#7182a8}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.notify-grid{grid-template-columns:1fr}}@media(max-width:500px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.top h1{font-size:26px}.row{display:block}.row .tag{margin:8px 0 0;display:inline-block}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">SELLB2 CONTROL CENTER</div><h1>Admin Dashboard</h1><div class="muted">Marketplace analytics and monitoring</div></div><button class="btn" onclick="logout()">Sign out</button></div><div id="app">Loading dashboard…</div></div><script>'use strict';const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console',NFN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-notification',token=sessionStorage.getItem('estatenova_admin_session');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function api(a,x={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token||''},cache:'no-store',body:JSON.stringify({action:a,...x})});if(r.status===401){sessionStorage.removeItem('estatenova_admin_session');location.href='/admin-login.html';throw Error('Session expired')}if(!r.ok)throw Error('Admin service error');return r.json()}async function notifyApi(a,x={}){const r=await fetch(NFN,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token||''},cache:'no-store',body:JSON.stringify({action:a,...x})});if(r.status===401){sessionStorage.removeItem('estatenova_admin_session');location.href='/admin-login.html';throw Error('Session expired')}const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'Notification service error');return d}function ist(v){return new Date(v).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})}async function sendNotification(e){e.preventDefault();const title=$('ntitle').value.trim(),message=$('nmessage').value.trim(),type=$('ntype').value,button=$('nsend'),ok=$('nsuccess'),err=$('nerror');ok.style.display='none';err.style.display='none';if(!title||!message)return;button.disabled=true;button.textContent='Sending…';try{await notifyApi('send',{title,message,type});$('nform').reset();ok.textContent='Notification sent to all users. It is now live in the website notification center.';ok.style.display='block';await loadNotifications()}catch(e){err.textContent=e.message||'Could not send notification.';err.style.display='block'}finally{button.disabled=false;button.textContent='Send to all users'}}async function loadNotifications(){try{const d=await notifyApi('list');const items=Array.isArray(d.notifications)?d.notifications:[];$('recent').innerHTML=items.length?items.map(n=>'<div class="notice-item"><h3>'+esc(n.title)+'</h3><p>'+esc(n.message)+'</p><div class="notice-meta">'+esc(n.type||'general')+' · '+esc(ist(n.created_at))+'</div></div>').join(''):'<p class="muted">No notifications sent yet.</p>'}catch(e){$('recent').innerHTML='<p class="muted">Could not load notifications.</p>'}}async function load(){if(!token){location.href='/admin-login.html';return}try{const d=await api('overview'),all=Array.isArray(d.listings)?d.listings:[],users=Array.isArray(d.users)?d.users:[],inq=Array.isArray(d.inquiries)?d.inquiries:[],props=all.filter(x=>(x.category||'property')==='property'),vehicles=all.filter(x=>x.category==='vehicle'),businesses=all.filter(x=>x.category==='business');$('app').innerHTML='<div class="grid"><div class="card stat" onclick="location.href=\'/admin-properties?category=property\'"><div class="label">Properties</div><div class="n">'+props.length+'</div><div class="hint">View properties →</div></div><div class="card stat" onclick="location.href=\'/admin-properties?category=vehicle\'"><div class="label">Vehicles</div><div class="n">'+vehicles.length+'</div><div class="hint">View vehicles →</div></div><div class="card stat" onclick="location.href=\'/admin-properties?category=business\'"><div class="label">Businesses</div><div class="n">'+businesses.length+'</div><div class="hint">View businesses →</div></div><div class="card stat" onclick="location.href=\'/admin-users\'"><div class="label">Registered users</div><div class="n">'+users.length+'</div><div class="hint">Buyers / sellers →</div></div><div class="card stat" onclick="location.href=\'/admin-inquiries\'"><div class="label">Inquiries</div><div class="n">'+inq.length+'</div><div class="hint">View inquiries →</div></div></div><div class="notify-grid"><div class="card"><h2>Send notification</h2><p class="muted">Publish an announcement to every active SELLB2 user.</p><form id="nform" class="notify-form" onsubmit="sendNotification(event)"><label>Title<input id="ntitle" maxlength="120" required placeholder="e.g. New marketplace update"></label><label>Message<textarea id="nmessage" maxlength="2000" required placeholder="Write the notification for all users..."></textarea></label><label>Type<select id="ntype"><option value="general">General</option><option value="update">Update</option><option value="announcement">Announcement</option><option value="maintenance">Maintenance</option></select></label><button id="nsend" class="btn sendbtn" type="submit">Send to all users</button><div id="nsuccess" class="success"></div><div id="nerror" class="error"></div></form><a class="notice-link" href="/notifications">Open live notification center →</a></div><div class="card"><h2>Recent notifications</h2><div id="recent"><p class="muted">Loading…</p></div></div></div><div class="card" style="margin-top:16px"><h2>Latest marketplace listings</h2>'+(all.length?all.slice(0,12).map(x=>'<div class="row"><div><b>'+esc(x.title||'Untitled listing')+'</b><span class="tag">'+esc(x.category||'property')+'</span><div class="muted">'+esc([x.locality,x.city,x.district,x.state].filter(Boolean).join(', '))+'</div></div><div class="muted">'+esc(x.status||'active')+'</div></div>').join(''):'<p class="muted">No listings found.</p>')+'</div>';await loadNotifications()}catch(e){$('app').innerHTML='<div class="card"><h2>Dashboard error</h2><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="load()">Retry</button></div>'}}function logout(){sessionStorage.removeItem('estatenova_admin_session');location.href='/admin-login.html'}load();</script></body></html>
