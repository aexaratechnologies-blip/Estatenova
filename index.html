<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102e68">
<meta name="description" content="EstateNova — India real estate marketplace.">
<title>EstateNova</title>
<link rel="stylesheet" href="/app.css">
<style>
:root{--navy:#102e68;--gold:#f4b21b}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--navy);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}#boot-splash{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;padding:32px 24px}.boot-brand{text-align:center;animation:bootIn .3s ease-out both}.boot-logo{width:92px;height:92px;margin:0 auto 20px;display:block}.boot-name{font-size:34px;line-height:1;font-weight:900;letter-spacing:1px}.boot-sub{margin-top:9px;font-size:11px;letter-spacing:5px;font-weight:700;opacity:.88}.boot-status{margin-top:22px;font-size:12px;opacity:.72}@keyframes bootIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}#app{display:none}
</style>
</head>
<body>
<main id="boot-splash" aria-label="EstateNova">
<div class="boot-brand">
<svg class="boot-logo" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path d="M14 42.5 48 14l34 28.5V82H14V42.5Z" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
<path d="M34 82V57h28v25M28 42h40" stroke="#f4b21b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M48 14v13" stroke="#f4b21b" stroke-width="5" stroke-linecap="round"/>
</svg>
<div class="boot-name">EstateNova</div><div class="boot-sub">REAL ESTATE</div>
<div id="boot-status" class="boot-status">Starting…</div>
</div>
</main>
<div id="app"></div>
<script>
(function(){
'use strict';
var splash=document.getElementById('boot-splash');
var app=document.getElementById('app');
var status=document.getElementById('boot-status');
var started=false;
function showError(message){status.textContent=message;app.style.display='block';app.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;background:#f7f8fb;color:#132039;padding:24px;text-align:center;font-family:system-ui"><div><h2 style="margin:0 0 8px">EstateNova</h2><p style="margin:0 0 18px">Unable to start the application.</p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font-weight:700">Retry</button></div></main>';splash.style.display='none'}
function loadScript(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=src;s.async=true;s.onload=function(){resolve()};s.onerror=function(){reject(new Error('Failed to load '+src))};document.head.appendChild(s)})}
function startApp(){if(started)return;started=true;if(!window.supabase||typeof window.supabase.createClient!=='function'){showError('Database library could not be loaded.');return}status.textContent='Loading EstateNova…';loadScript('/app.js').then(function(){splash.style.display='none';app.style.display='block';if(typeof window.go==='function'){window.go('home',null)}}).catch(function(e){console.error('EstateNova app load failed',e);showError('Application failed to load.')})}
status.textContent='Connecting…';
loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2').then(startApp).catch(function(e){console.warn(e);status.textContent='Retrying connection…';return loadScript('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js').then(startApp)}).catch(function(e){console.error(e);showError('Connection failed.')});
})();
</script>
</body>
</html>
