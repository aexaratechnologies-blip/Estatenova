<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102e68">
<meta name="description" content="SELLB2 — India marketplace for properties, vehicles and businesses.">
<title>SELLB2 — Buy & Sell Properties, Vehicles & Businesses</title>
<link rel="stylesheet" href="/app.css?v=sellb2-1">
<style>
:root{--navy:#102e68;--gold:#7b6af2}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#102e68;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}#boot-splash{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0d2860,#173b80);color:#fff;padding:32px 24px}.boot-brand{text-align:center;animation:bootIn .35s ease-out both}.boot-logo{width:104px;height:104px;margin:0 auto 22px;display:block}.boot-name{font-size:38px;line-height:1;font-weight:900;letter-spacing:-1px}.boot-name span{color:#8b7cf5}.boot-sub{margin-top:10px;font-size:11px;letter-spacing:4px;font-weight:800;opacity:.82}@keyframes bootIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}#app{display:none;min-height:100vh}
</style>
</head>
<body>
<main id="boot-splash" aria-label="SELLB2">
<div class="boot-brand">
<svg class="boot-logo" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<rect x="8" y="8" width="80" height="80" rx="24" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
<path d="M23 46 48 25l25 21v25H23V46Z" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
<path d="M34 71V52h28v19M30 45h36" stroke="#8b7cf5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M48 25v10" stroke="#8b7cf5" stroke-width="5" stroke-linecap="round"/>
</svg>
<div class="boot-name">SELL<span>B2</span></div><div class="boot-sub">BUY · SELL · DISCOVER</div>
</div>
</main>
<div id="app"></div>
<script>
(function(){var s=document.getElementById('boot-splash'),a=document.getElementById('app');function load(u){return new Promise(function(ok,no){var x=document.createElement('script');x.src=u;x.onload=ok;x.onerror=function(){no(new Error('Unable to load '+u))};document.head.appendChild(x)})}async function start(){try{await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');await load('/app.js?v=sellb2-1');setTimeout(function(){s.style.display='none';a.style.display='block'},900)}catch(e){console.error(e);s.innerHTML='<div class="boot-brand"><div class="boot-name">SELL<span>B2</span></div><p>Unable to start. Please refresh.</p><button onclick="location.reload()">Retry</button></div>'}}start()})();
</script>
</body>
</html>
