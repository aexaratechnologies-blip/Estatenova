function messages(){const people=[['Amit Sharma','Hi, I’m interested in this property.','10:30 AM','2'],['Neha Verma','Let’s schedule a visit tomorrow.','09:15 AM','1'],['Rajesh Patel','Please share more details.','Yesterday',''],['Priya Singh','Thanks for the information.','Yesterday',''],['Vikram Mehta','Is the property still available?','2 Aug','']];return `<div class="screen">${header('Messages')}<div>${people.map((p,i)=>`<div class="message-row"><img class="avatar" src="${[imgs.apt,imgs.house,imgs.villa,imgs.lux,imgs.apt][i]}"><div><div class="msg-name">${p[0]}</div><div class="msg-text">${p[1]}</div></div><div class="msg-time">${p[2]}${p[3]?`<div class="unread">${p[3]}</div>`:''}</div></div>`).join('')}</div>${bottom('messages')}</div>`}
function profile(){return `<div class="screen">${top()}<div class="profile-head"><img class="avatar" src="${imgs.house}"><div><div class="profile-name">Rahul Verma</div><div class="profile-phone">+91 98765 43210</div></div><button class="iconbtn" style="margin-left:auto;color:#fff">⚙</button></div><div class="profile-menu">${[['♙','My Profile'],['▤','My Enquiries'],['◷','Scheduled Visits'],['⌕','Saved Searches'],['⌂','My Properties'],['▣','Payment & Invoices'],['♧','Notification Settings'],['?','Help & Support'],['⇥','Logout']].map(x=>`<div class="menu-row" onclick="${x[1]==='Logout'?'logout()':''}"><span class="mi">${x[0]}</span>${x[1]}<span class="arrow">›</span></div>`).join('')}</div>${bottom('profile')}</div>`}
function drawer(){return `<div class="drawer-overlay" onclick="state.drawer=false;render()"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawer-head"><div style="display:flex;align-items:center;gap:9px"><img class="avatar" src="${imgs.house}"><div><div class="profile-name">Rahul Verma</div><div class="profile-phone">+91 98765 43210</div></div></div></div><div class="drawer-menu">${[['⌂','Home','home'],['▦','Properties','properties'],['♡','Saved Properties','saved'],['▣','Messages','messages'],['▤','My Enquiries','profile'],['◷','Scheduled Visits','profile'],['♙','My Profile','profile'],['⚙','Settings','profile'],['?','Help & Support','profile'],['⇥','Logout','splash']].map(x=>`<div class="menu-row" onclick="go('${x[2]}');state.drawer=false"><span class="mi">${x[0]}</span>${x[1]}</div>`).join('')}</div></aside></div>`}
function auth(){return `<div class="screen auth">${top()}<div class="brand-big">AEXARA <span style="font-weight:500">REAL ESTATE</span></div><div class="tabs"><button class="tab ${state.auth==='login'?'active':''}" onclick="state.auth='login';render()">Sign in</button><button class="tab ${state.auth==='signup'?'active':''}" onclick="state.auth='signup';render()">Create account</button></div><h1>${state.auth==='login'?'Welcome back':'Create your account'}</h1><p>${state.auth==='login'?'Sign in to your EstateNova account.':'Create an account and continue.'}</p>${state.auth==='signup'?'<input id="name" class="field" placeholder="Full name">':''}<input id="email" class="field" type="email" placeholder="Email address"><input id="password" class="field" type="password" placeholder="Password"><button class="outline show" onclick="const x=document.getElementById('password');x.type=x.type==='password'?'text':'password'">Show / Hide password</button><div id="authmsg" class="auth-msg"></div><button class="primary full" onclick="doAuth()">${state.auth==='login'?'Sign in':'Create account'}</button><div style="text-align:center;font-size:9px;color:#777;margin-top:16px"><button style="border:0;background:none;color:#777" onclick="go('home')">← Back to EstateNova</button></div></div>`}
function render(){let html='';switch(state.route){case'splash':html=splash();break;case'onboarding':html=onboarding();break;case'home':html=home();break;case'properties':html=properties();break;case'details':html=details();break;case'filters':html=filters();break;case'saved':html=saved();break;case'messages':html=messages();break;case'profile':html=profile();break;case'drawer':html=home();state.drawer=true;break;case'auth':html=auth();break;default:html=home()}document.getElementById('app').innerHTML=html+(state.drawer?drawer():'')}
function go(r){state.route=r;location.hash=r;render();window.scrollTo(0,0)}function toggleLike(id){state.liked.has(id)?state.liked.delete(id):state.liked.add(id);render()}function logout(){localStorage.clear();go('splash')}
async function doAuth(){const msg=document.getElementById('authmsg'),email=document.getElementById('email')?.value.trim(),pass=document.getElementById('password')?.value;if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.textContent='Enter a valid email address.';return}if(!pass||pass.length<6){msg.textContent='Password must be at least 6 characters.';return}msg.textContent=state.auth==='signup'?'Creating account…':'Signing in…';try{let r;if(state.auth==='signup'){r=await fetch(A+'/auth/v1/signup',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})})}else{r=await fetch(A+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})})}const d=await r.json();if(!r.ok){msg.textContent='Unable to complete. Check your details.';return}if(d.access_token)localStorage.setItem('en_access_token',d.access_token);if(d.refresh_token)localStorage.setItem('en_refresh_token',d.refresh_token);msg.style.color='#138a57';msg.textContent='Success. Opening your profile…';setTimeout(()=>go('profile'),350)}catch(e){msg.textContent='Network error. Please try again.'}}
window.addEventListener('hashchange',()=>{state.route=location.hash.slice(1)||'splash';render()});render();
</script>
</body></html>
