n><div id="app"></div><script>(async()=>{const splash=document.getElementById('boot-splash'),app=document.getElementById('app');let settled=false;const showError=(message)=>{if(settled)return;settled=true;console.error('SELLB2 startup:',message);splash.innerHTML='<div class="boot-brand"><div class="boot-name">SELL<span>B2</span></div><p class="boot-error">Unable to start the marketplace.<br>Please refresh and try again.</p><button onclick="location.reload()">Retry</button></div>'};window.addEventListener('error',e=>showError(e.error?.message||e.message||'JavaScript error'));window.addEventListener('unhandledrejection',e=>showError(e.reason?.message||String(e.reason||'Startup error')));try{await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=()=>no(new Error('Supabase library failed to load'));document.head.append(s)});await new Promise((ok,no)=>{const s=document.createElement('script');s.src='/location-data-v1.js?v=sellb2-2';s.onload=ok;s.onerror=()=>no(new Error('Location data failed to load'));document.head.append(s)});await new Promise((ok,no)=>{const s=document.createElement('script');s.src='/sellb2.js?v=sellb2-2';s.onload=ok;s.onerror=()=>no(new Error('Marketplace application failed to load'));document.head.append(s)});await new Promise((ok,no)=>{const s=document.createElement('script');s.src='/sellb2-fixes.js?v=sellb2-2';s.onload=ok;s.onerror=()=>no(new Error('Marketplace compatibility patch failed to load'));document.head.append(s)});const started=Date.now();const reveal=()=>{if(settled)return;if(app.innerHTML.trim()){settled=true;splash.style.display='none';app.style.display='block';return}if(Date.now()-started>10000){showError('Application did not render within 10 seconds');return}setTimeout(reveal,100)};reveal()}catch(e){showError(e.message||'Startup failed')}})();</script></body></html>
