const SUPABASE_URL='https://bttujypzchanhvdmqutv.supabase.co';const SUPABASE_KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const A={hero:'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=90'};
let state={route:'splash',seen:localStorage.getItem('en_seen')==='1',slide:0,filter:'All',query:'',drawer:false,theme:localStorage.getItem('en_theme')||'light',listings:[],saved:new Set(),profile:null,current:null,owner:null,conversations:[],messages:[],loading:false,auth:'login',chatId:null,chatChannel:null};
const app=document.getElementById('app');
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmtPrice(p,label){if(label)return label;const n=Number(p||0);if(!n)return'Price on request';return'₹'+(n>=10000000?(n/10000000).toFixed(2)+' Cr':n>=100000?(n/100000).toFixed(2)+' L':n.toLocaleString('en-IN'))}function fmtTime(x){if(!x)return'';return new Date(x).toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit'})}function imgFor(p){return p?.cover_image_url||p?.image_urls?.[0]||''}function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}function applyTheme(){document.documentElement.classList.toggle('dark',state.theme==='dark')}function setTheme(t){state.theme=t;localStorage.setItem('en_theme',t);applyTheme();render()}function top(){return'<div class="status"><b>EstateNova</b><span>Secure marketplace</span></div>'}function bottom(a){return'<nav class="bottom">'+[['home','⌂','Home'],['properties','▦','Properties'],['saved','♡','Saved'],['messages','▣','Messages'],['profile','♙','Profile']].map(x=>`<button class="nav ${a===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')+'</nav>'}function header(t,b='home'){return`${top()}<div class="head"><button class="icon" onclick="go('${b}')">‹</button><b class="title">${esc(t)}</b><button class="icon" onclick="state.drawer=true;render()">☰</button></div>`}
function splash(){return'<main class="screen splash"><div class="splashcopy"><div class="mark">⌂</div><div class="aex">AEXARA</div><div class="sub">REAL ESTATE</div><h1>Find Your Dream Home</h1><p>Discover verified properties from real people. No placeholder listings, no fake agents.</p><div class="splash-actions"><button class="btn primary full" onclick="go(\'onboarding\')">Get Started</button><button class="btn outline full" onclick="go(\'auth\')">Sign in / Create account</button></div></div></main>'}
const slides=[['Find The Perfect Property','Search verified listings that actually exist in EstateNova.','https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1000&q=90'],['Save What You Love','Keep your real favourites synced to your account.','https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1000&q=90'],['Talk Directly','Message the actual listing owner and keep conversations in one place.','https://images.unsplash.com/photo-1600607688969-a5bfcd646154?auto=format&fit=crop&w=1000&q=90']];
function onboarding(){return`<main class="screen onboard">${top()}<div class="oncopy"><span class="eyebrow">Find · Buy · Own</span><h1>${slides[state.slide][0]}</h1><p>${slides[state.slide][1]}</p></div><div class="slider"><div class="slides" style="transform:translateX(-${state.slide*100}%)">${slides.map(s=>`<div class="slide"><div class="onphoto"><img src="${s[2]}" alt=""></div></div>`).join('')}</div></div><div class="onfoot"><div class="dots">${slides.map((_,i)=>`<i class="${i===state.slide?'a':''}" onclick="state.slide=${i};render()"></i>`).join('')}</div><button class="next" onclick="nextSlide()">${state.slide===slides.length-1?'✓':'→'}</button></div></main>`}function nextSlide(){if(state.slide<slides.length-1){state.slide++;render()}else{localStorage.setItem('en_seen','1');state.seen=true;go('home')}}
async function loadListings(){let q=db.from('listings').select('*').eq('approval_status','approved').eq('status','active').order('created_at',{ascending:false});if(state.query.trim())q=q.or(`title.ilike.%${state.query.trim()}%,locality.ilike.%${state.query.trim()}%,city.ilike.%${state.query.trim()}%`);if(state.filter!=='All')q=q.eq('property_type',state.filter);const{data,error}=await q;if(!error)state.listings=data||[];return error}async function loadSaved(){if(!state.profile){state.saved=new Set();return}const{data}=await db.from('favorites').select('listing_id').eq('user_id',state.profile.id);state.saved=new Set((data||[]).map(x=>x.listing_id))}async function loadProfile(){const{data:{user}}=await db.auth.getUser();if(!user){state.profile=null;return}const{data}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();state.profile=data||{id:user.id,email:user.email}}async function boot(){applyTheme();state.route=routeFromPath();await loadProfile();await loadSaved();if(state.route==='splash'&&state.seen)state.route='home';await loadListings();render()}
async function toggleSave(id){if(!state.profile){toast('Please sign in to save properties');go('auth');return}const exists=state.saved.has(id);let r;if(exists){r=await db.from('favorites').delete().eq('user_id',state.profile.id).eq('listing_id',id);if(!r.error)state.saved.delete(id)}else{r=await db.from('favorites').insert({user_id:state.profile.id,listing_id:id});if(!r.error)state.saved.add(id)}if(r.error)toast(r.error.message);else render()}
function card(p){const im=imgFor(p);return`<article class="pcard" onclick="go('details','${p.id}')"><div class="pimg">${im?`<img src="${esc(im)}" alt="${esc(p.title)}">`:''}<button class="heart" onclick="event.stopPropagation();toggleSave('${p.id}')">${state.saved.has(p.id)?'♥':'♡'}</button>${p.featured?'<span class="badge">Featured</span>':''}</div><div class="pbody"><div class="prow"><b>${esc(p.title)}</b><strong class="price">${esc(fmtPrice(p.price,p.price_label))}</strong></div><div class="meta">${esc([p.locality,p.city].filter(Boolean).join(', ')||p.address||'Location not specified')}</div><div class="stats">${p.area?`<span>${esc(p.area)} ${esc(p.area_unit||'sqft')}</span>`:''}${p.bedrooms?`<span>${p.bedrooms} Bed</span>`:''}${p.bathrooms?`<span>${p.bathrooms} Bath</span>`:''}</div></div></article>`}
function home(){const featured=state.listings.filter(x=>x.featured);const shown=(featured.length?featured:state.listings).slice(0,3);return`<main class="screen">${top()}<div class="homehead"><div class="location">⌖ Mumbai, India</div><div class="homeactions"><button class="icon" onclick="setTheme(state.theme==='dark'?'light':'dark')">${state.theme==='dark'?'☀':'◐'}</button><button class="btn secondary" onclick="go('auth')">${state.profile?'Account':'Sign in'}</button></div></div><div class="search"><span>⌕</span><input value="${esc(state.query)}" placeholder="Search properties, locality..." onkeydown="if(event.key==='Enter'){state.query=this.value;refreshListings()}"><button onclick="go('filters')">☷</button></div><div class="banner"><b>Find Your<br>Dream Home</b><span>Browse live approved listings →</span></div><div class="secthead"><b>Categories</b><button onclick="go('properties')">See all</button></div><div class="cats">${[['▥','Apartment'],['⌂','Villa'],['⌂','House'],['♟','Land'],['▦','Office']].map(c=>`<button class="cat" onclick="state.filter='${c[1]}';go('properties')"><i>${c[0]}</i>${c[1]}</button>`).join('')}</div><div class="secthead"><b>Available now</b><button onclick="go('properties')">See all</button></div>${shown.length?shown.map(card).join(''):`<div class="empty"><div class="emptyicon">⌂</div><h3>No approved properties yet</h3><p>EstateNova shows only real listings from the database. Once an owner posts and an admin approves a property, it appears here.</p><button class="btn outline" onclick="go('post')">List a property</button></div>`}${bottom('home')}</main>`}
async function refreshListings(){state.loading=true;render();await loadListings();state.loading=false;render()}
function properties(){return`<main class="screen">${header('Properties')}<div class="search" style="margin-top:14px"><span>⌕</span><input value="${esc(state.query)}" placeholder="Search properties..." onkeydown="if(event.key==='Enter'){state.query=this.value;refreshListings()}"><button onclick="go('filters')">☷</button></div><div class="chips">${['All','Apartment','Villa','House','Land','Office'].map(x=>`<button class="chip ${state.filter===x?'on':''}" onclick="state.filter='${x}';refreshListings()">${x}</button>`).join('')}</div>${state.loading?'<div class="loading"><div class="spinner"></div>Loading live listings…</div>':state.listings.length?`<div class="list">${state.listings.map(p=>`<article class="listcard" onclick="go('details','${p.id}')">${imgFor(p)?`<img src="${esc(imgFor(p))}" alt="">`:'<div></div>'}<div class="listbody"><div class="prow"><b>${esc(p.title)}</b><button class="heart" style="position:static" onclick="event.stopPropagation();toggleSave('${p.id}')">${state.saved.has(p.id)?'♥':'♡'}</button></div><div class="price">${esc(fmtPrice(p.price,p.price_label))}</div><div class="meta">${esc([p.locality,p.city].filter(Boolean).join(', ')||'')}</div><div class="stats">${p.area?`<span>${p.area} ${p.area_unit||'sqft'}</span>`:''}${p.bedrooms?`<span>${p.bedrooms} Bed</span>`:''}${p.bathrooms?`<span>${p.bathrooms} Bath</span>`:''}</div></div></article>`).join('')}</div>`:'<div class="empty"><div class="emptyicon">⌂</div><h3>No properties found</h3><p>Try another search or category. Only approved, active database listings are shown.</p></div>'}${bottom('properties')}</main>`}
function filters(){return`<main class="screen">${header('Filters','properties')}<section class="filters"><div class="block"><b>Property Type</b><div class="types">${['All','Apartment','Villa','House','Land','Office'].map(x=>`<button class="type ${state.filter===x?'on':''}" onclick="state.filter='${x}';render()">${x}</button>`).join('')}</div></div><div class="block"><b>Amenities</b><div class="checks">${['Parking','Security','Lift','Power Backup','Gym','Swimming Pool'].map(x=>`<label><input type="checkbox" value="${x}">${x}</label>`).join('')}</div></div><button class="btn primary full" onclick="go('properties')">Show Results</button></section></main>`}
function saved(){const ps=state.listings.filter(p=>state.saved.has(p.id));return`<main class="screen">${header('Saved Properties')}${ps.length?`<div class="list">${ps.map(p=>`<article class="listcard" onclick="go('details','${p.id}')">${imgFor(p)?`<img src="${esc(imgFor(p))}" alt="">`:'<div></div>'}<div class="listbody"><div class="prow"><b>${esc(p.title)}</b><button class="heart" style="position:static" onclick="event.stopPropagation();toggleSave('${p.id}')">♥</button></div><div class="price">${esc(fmtPrice(p.price,p.price_label))}</div><div class="meta">${esc([p.locality,p.city].filter(Boolean).join(', '))}</div></div></article>`).join('')}</div>`:`<div class="empty"><div class="emptyicon">♡</div><h3>No saved properties</h3><p>Tap the heart on a live listing to save it to your account.</p><button class="btn primary" onclick="go('properties')">Browse properties</button></div>`}${bottom('saved')}</main>`}
async function details(id){let p=state.listings.find(x=>x.id===id);if(!p){const{data}=await db.from('listings').select('*').eq('id',id).maybeSingle();p=data}state.current=p;if(!p)return`<main class="screen">${header('Property','properties')}<div class="empty"><h3>Property unavailable</h3></div></main>`;const r=await db.rpc('get_listing_owner',{p_listing_id:p.id});state.owner=r.error?null:(r.data?.[0]||null);return`<main class="screen"><div class="detailimg">${imgFor(p)?`<img src="${esc(imgFor(p))}" alt="${esc(p.title)}">`:''}<button class="over back" onclick="go('properties')">‹</button><div class="over right"><button onclick="toggleSave('${p.id}')">${state.saved.has(p.id)?'♥':'♡'}</button><button onclick="shareProperty()">↗</button></div><span class="count">${(p.image_urls||[]).length||1} photo${(p.image_urls||[]).length===1?'':'s'}</span></div><section class="detail"><h1>${esc(p.title)}</h1><div class="dprice">${esc(fmtPrice(p.price,p.price_label))}</div><div class="meta">${esc([p.locality,p.city,p.state].filter(Boolean).join(', ')||p.address||'')}</div><div class="facts"><div class="fact"><b>${p.area||'—'}</b><small>${esc(p.area_unit||'sqft')}</small></div><div class="fact"><b>${p.bedrooms||'—'}</b><small>Bedrooms</small></div><div class="fact"><b>${p.bathrooms||'—'}</b><small>Bathrooms</small></div><div class="fact"><b>${p.parking||'—'}</b><small>Parking</small></div></div><div class="dsection"><b>About Property</b><p>${esc(p.description||'No description provided by the owner.')}</p></div><div class="dsection"><b>Amenities</b><div class="amenities">${(p.amenities||[]).length?(p.amenities||[]).map(a=>`<div><i>✓</i><small>${esc(a)}</small></div>`).join(''):'<div><i>—</i><small>Not specified</small></div>'}</div></div>${state.owner?`<div class="dsection"><b>Listing owner</b><p style="margin-bottom:0">${esc(state.owner.full_name||'EstateNova member')}</p></div>`:''}<div class="dactions"><button class="btn outline" onclick="scheduleVisit('${p.id}')">Schedule Visit</button><button class="btn primary" onclick="startChat('${p.id}')">Message owner</button></div></section>${bottom('properties')}</main>`}
async function shareProperty(){try{await navigator.share({title:state.current?.title||'EstateNova property',url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);toast('Property link copied')}catch(_){toast('Share unavailable')}}}async function scheduleVisit(id){if(!state.profile){toast('Please sign in first');go('auth');return}const x=prompt('Preferred visit date and time?');if(!x)return;const r=await db.from('inquiries').insert({listing_id:id,buyer_id:state.profile.id,seller_id:state.owner?.owner_id,message:'Visit request: '+x,buyer_phone:state.profile.phone,buyer_email:state.profile.email});toast(r.error?r.error.message:'Visit request sent')}async function startChat(id){if(!state.profile){toast('Please sign in to message the owner');go('auth');return}const text=prompt('Write your first message');if(!text?.trim())return;const r=await db.rpc('start_conversation',{p_listing_id:id,p_message:text.trim()});if(r.error){toast(r.error.message);return}go('chat',r.data)}
async function loadConversations(){if(!state.profile){state.conversations=[];return}const r=await db.rpc('get_my_conversations');state.conversations=r.error?[]:(r.data||[])}async function messages(){await loadConversations();return`<main class="screen">${header('Messages')}<section class="messages">${state.profile?state.conversations.length?state.conversations.map(c=>`<div class="message" onclick="go('chat','${c.id}')"><img src="${esc(c.other_user_avatar||A.hero)}" alt=""><div><b>${esc(c.other_user_name||'EstateNova member')}</b><small>${esc(c.last_message||c.listing_title||'Start a conversation')}</small></div><span>${fmtTime(c.last_message_at)}</span></div>`).join(''):'<div class="empty"><div class="emptyicon">▣</div><h3>No conversations yet</h3><p>Open a live property and message its owner. Your real conversations will appear here.</p><button class="btn primary" onclick="go(\'properties\')">Browse properties</button></div>':'<div class="empty"><div class="emptyicon">▣</div><h3>Sign in to view messages</h3><p>Your conversations are private and tied to your account.</p><button class="btn primary" onclick="go(\'auth\')">Sign in</button></div>'}</section>${bottom('messages')}</main>`}
async function chat(id){if(!state.profile){go('auth');return''}const c=state.conversations.find(x=>x.id===id)||((await db.rpc('get_my_conversations')).data||[]).find(x=>x.id===id);if(!c)return`<main class="screen">${header('Chat','messages')}<div class="empty"><h3>Conversation not found</h3></div></main>`;const r=await db.from('messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true});state.messages=r.data||[];if(state.chatChannel)db.removeChannel(state.chatChannel);state.chatChannel=db.channel('chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},payload=>{state.messages.push(payload.new);renderChatOnly(id)}).subscribe();await db.rpc('mark_conversation_read',{p_conversation_id:id});return`<main class="screen chat"><div class="chathead"><button class="icon" onclick="go('messages')">‹</button><img src="${esc(c.other_user_avatar||A.hero)}" alt=""><div><b>${esc(c.other_user_name||'EstateNova member')}</b><small class="muted">${esc(c.listing_title||'EstateNova')}</small></div></div><div class="chatbody" id="chatbody">${state.messages.map(m=>`<div class="bubble ${m.sender_id===state.profile.id?'mine':'theirs'}">${esc(m.body)}<time>${fmtTime(m.created_at)}</time></div>`).join('')}</div><form class="composer" onsubmit="sendMessage(event,'${id}')"><input id="messageInput" autocomplete="off" placeholder="Write a message…"><button class="btn primary send">➤</button></form></main>`}
function renderChatOnly(id){const b=document.getElementById('chatbody');if(!b)return;b.innerHTML=state.messages.map(m=>`<div class="bubble ${m.sender_id===state.profile.id?'mine':'theirs'}">${esc(m.body)}<time>${fmtTime(m.created_at)}</time></div>`).join('');b.scrollTop=b.scrollHeight}async function sendMessage(e,id){e.preventDefault();const input=document.getElementById('messageInput'),body=input.value.trim();if(!body)return;input.disabled=true;const r=await db.from('messages').insert({conversation_id:id,sender_id:state.profile.id,body});input.disabled=false;if(r.error)toast(r.error.message);else{input.value='';setTimeout(()=>renderChatOnly(id),80)}}
async function profile(){await loadProfile();return`<main class="screen">${top()}${state.profile?`<section class="profileblue"><img src="${esc(state.profile.avatar_url||A.hero)}"><div><b>${esc(state.profile.full_name||'EstateNova member')}</b><small>${esc(state.profile.email||'')}</small></div></section>`:'<div class="empty"><h3>You\'re not signed in</h3><button class="btn primary" onclick="go(\'auth\')">Sign in</button></div>'}<div class="theme-row"><b>Appearance</b><div class="theme-toggle"><button class="${state.theme==='light'?'on':''}" onclick="setTheme('light')">☀ Light</button><button class="${state.theme==='dark'?'on':''}" onclick="setTheme('dark')">◐ Dark</button></div></div><div class="menu">${state.profile?[['♙','My Profile','profile-edit'],['▤','My Enquiries','messages'],['◷','Scheduled Visits','messages'],['♡','Saved Properties','saved'],['⌂','Sell / Post','post'],['?','Help & Support','messages'],['⇥','Sign out','logout']].map(x=>`<button onclick="${x[2]==='logout'?'logout()':`go('${x[2]}')`}"><i>${x[0]}</i>${x[1]}<span>›</span></button>`).join(''):'<button onclick="go(\'auth\')"><i>↪</i>Sign in / Create account<span>›</span></button>'}</div>${bottom('profile')}</main>`}
async function profileEdit(){await loadProfile();if(!state.profile)return`<main class="screen">${header('My Profile')}<div class="empty"><button class="btn primary" onclick="go(\'auth\')">Sign in</button></div></main>`;return`<main class="screen">${header('My Profile','profile')}<form class="form" onsubmit="saveProfile(event)"><div class="fieldwrap"><label>Full name</label><input class="field" id="pn" value="${esc(state.profile.full_name||'')}"></div><div class="fieldwrap"><label>Phone</label><input class="field" id="pp" value="${esc(state.profile.phone||'')}"></div><div class="fieldwrap"><label>Email</label><input class="field" value="${esc(state.profile.email||'')}" disabled></div><div class="fieldwrap"><label>Bio</label><textarea id="pb" placeholder="Tell people about yourself">${esc(state.profile.bio||'')}</textarea></div><div class="fieldwrap"><label>Profile photo</label><input class="field" id="avatar" type="file" accept="image/*"><img class="preview" src="${esc(state.profile.avatar_url||A.hero)}" alt=""></div><div id="profileMsg" class="error"></div><button class="btn primary full">Save Changes</button></form></main>`}
async function saveProfile(e){e.preventDefault();const msg=document.getElementById('profileMsg');msg.textContent='Saving…';const patch={full_name:document.getElementById('pn').value.trim(),phone:document.getElementById('pp').value.trim(),bio:document.getElementById('pb').value.trim(),updated_at:new Date().toISOString()};const f=document.getElementById('avatar').files[0];if(f){const path=state.profile.id+'/'+crypto.randomUUID()+'.'+(f.name.split('.').pop()||'jpg');const up=await db.storage.from('avatars').upload(path,f,{upsert:false,contentType:f.type});if(up.error){msg.textContent=up.error.message;return}patch.avatar_url=db.storage.from('avatars').getPublicUrl(path).data.publicUrl}const r=await db.from('profiles').update(patch).eq('id',state.profile.id);if(r.error){msg.textContent=r.error.message;return}await loadProfile();toast('Profile saved');go('profile')}
function post(){if(!state.profile)return`<main class="screen">${header('Sell / Post','profile')}<div class="empty"><h3>Sign in required</h3><p>Only signed-in users can publish a property.</p><button class="btn primary" onclick="go(\'auth\')">Sign in</button></div></main>`;return`<main class="screen">${header('Sell / Post','profile')}<form class="form" onsubmit="createListing(event)"><div class="fieldwrap"><label>Property title</label><input class="field" id="lt" required placeholder="e.g. 3 BHK apartment in Powai"></div><div class="fieldwrap"><label>Property type</label><select id="ltype" required><option>Apartment</option><option>Villa</option><option>House</option><option>Land</option><option>Office</option></select></div><div class="fieldwrap"><label>Listing type</label><select id="lkind"><option value="sale">Sale</option><option value="rent">Rent</option><option value="lease">Lease</option></select></div><div class="fieldwrap"><label>Price</label><input class="field" id="lprice" type="number" min="0" required placeholder="18500000"></div><div class="fieldwrap"><label>Area (sqft)</label><input class="field" id="larea" type="number" min="0" placeholder="1200"></div><div class="fieldwrap"><label>Bedrooms</label><input class="field" id="lbeds" type="number" min="0" placeholder="3"></div><div class="fieldwrap"><label>Bathrooms</label><input class="field" id="lbaths" type="number" min="0" placeholder="2"></div><div class="fieldwrap"><label>City</label><input class="field" id="lcity" required placeholder="Mumbai"></div><div class="fieldwrap"><label>Locality</label><input class="field" id="llocality" placeholder="Powai"></div><div class="fieldwrap"><label>Address</label><input class="field" id="laddress" placeholder="Full address"></div><div class="fieldwrap"><label>Description</label><textarea id="ldesc" required placeholder="Describe the property"></textarea></div><div class="fieldwrap"><label>Amenities (comma separated)</label><input class="field" id="lamen" placeholder="Parking, Lift, Security"></div><div class="fieldwrap"><label>Property photos</label><input class="field" id="lphotos" type="file" accept="image/*" multiple required></div><div id="postMsg" class="error"></div><button class="btn primary full">Submit for admin approval</button></form></main>`}
async function createListing(e){e.preventDefault();const msg=document.getElementById('postMsg'),files=[...document.getElementById('lphotos').files].slice(0,10);if(!files.length){msg.textContent='Add at least one photo';return}msg.textContent='Creating listing…';const row={owner_id:state.profile.id,title:document.getElementById('lt').value.trim(),property_type:document.getElementById('ltype').value,listing_type:document.getElementById('lkind').value,price:Number(document.getElementById('lprice').value),area:Number(document.getElementById('larea').value)||null,bedrooms:Number(document.getElementById('lbeds').value)||null,bathrooms:Number(document.getElementById('lbaths').value)||null,city:document.getElementById('lcity').value.trim(),locality:document.getElementById('llocality').value.trim(),address:document.getElementById('laddress').value.trim(),description:document.getElementById('ldesc').value.trim(),amenities:document.getElementById('lamen').value.split(',').map(x=>x.trim()).filter(Boolean),approval_status:'pending',status:'draft'};const ins=await db.from('listings').insert(row).select().single();if(ins.error){msg.textContent=ins.error.message;return}const urls=[];for(let i=0;i<files.length;i++){const f=files[i],path=state.profile.id+'/'+ins.data.id+'/'+crypto.randomUUID()+'.'+(f.name.split('.').pop()||'jpg');const up=await db.storage.from('property-images').upload(path,f,{upsert:false,contentType:f.type});if(up.error){msg.textContent=up.error.message;return}const url=db.storage.from('property-images').getPublicUrl(path).data.publicUrl;urls.push(url);await db.from('listing_images').insert({listing_id:ins.data.id,storage_path:path,public_url:url,sort_order:i})}await db.from('listings').update({cover_image_url:urls[0]||null,image_urls:urls,status:'draft'}).eq('id',ins.data.id);msg.className='success';msg.textContent='Submitted. An admin must approve this listing before it becomes public.';setTimeout(()=>go('profile'),900)}
function auth(){return`<main class="screen auth">${top()}<div class="authbrand">Estate<span>Nova</span></div><div class="tabs"><button class="tab ${state.auth==='login'?'on':''}" onclick="state.auth='login';render()">Sign in</button><button class="tab ${state.auth==='signup'?'on':''}" onclick="state.auth='signup';render()">Create account</button></div><h1>${state.auth==='login'?'Welcome back':'Create your account'}</h1><p>${state.auth==='login'?'Sign in to access your saved properties and private conversations.':'Create your EstateNova account to save, message and publish.'}</p>${state.auth==='signup'?'<input id="an" class="field" placeholder="Full name">':''}<input id="ae" class="field" type="email" autocomplete="email" placeholder="Email address"><input id="ap" class="field" type="password" autocomplete="${state.auth==='login'?'current-password':'new-password'}" placeholder="Password"><div id="am" class="error"></div><button class="btn primary full" onclick="doAuth()">${state.auth==='login'?'Sign in':'Create account'}</button><div class="divider">secure account</div><button class="btn secondary full" onclick="go('home')">Continue browsing</button></main>`}
async function doAuth(){const email=document.getElementById('ae').value.trim(),password=document.getElementById('ap').value,msg=document.getElementById('am');if(!email||password.length<6){msg.textContent='Enter a valid email and a password of at least 6 characters.';return}msg.textContent='Please wait…';const r=state.auth==='login'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{data:{full_name:document.getElementById('an')?.value?.trim()||''}}});if(r.error){msg.textContent=r.error.message;return}if(r.data.user){localStorage.setItem('en_email',email);if(state.auth==='signup'&&document.getElementById('an'))localStorage.setItem('en_name',document.getElementById('an').value.trim())}if(!r.data.session){msg.textContent='Account created. Check your email if confirmation is enabled, then sign in.';return}await loadProfile();toast('Signed in');go('profile')}
async function logout(){if(state.chatChannel)db.removeChannel(state.chatChannel);await db.auth.signOut();state.profile=null;state.saved=new Set();state.conversations=[];go('home')}
function drawer(){return`<div class="drawerShade" onclick="state.drawer=false;render()"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawerHead"><img src="${esc(state.profile?.avatar_url||A.hero)}" alt=""><div><b>${esc(state.profile?.full_name||'EstateNova')}</b><small>${esc(state.profile?.email||'Real estate marketplace')}</small></div></div><div class="drawermenu">${[['⌂','Home','home'],['▦','Properties','properties'],['♡','Saved Properties','saved'],['▣','Messages','messages'],['♙','Profile','profile'],['⌂','Sell / Post','post']].map(x=>`<button onclick="go('${x[2]}')"><i>${x[0]}</i>${x[1]}<span>›</span></button>`).join('')}<button onclick="setTheme(state.theme==='dark'?'light':'dark')"><i>◐</i>${state.theme==='dark'?'Light mode':'Dark mode'}<span>›</span></button>${state.profile?'<button onclick="logout()"><i>⇥</i>Sign out<span>›</span></button>':'<button onclick="go(\'auth\')"><i>↪</i>Sign in<span>›</span></button>'}</div></aside></div>`}
function routeFromPath(){const p=location.pathname;if(p==='/')return state.seen?'home':'splash';if(p.startsWith('/property/')){state.current=null;return'details'}if(p.startsWith('/messages/')){state.chatId=p.split('/')[2]||null;return'chat'}return p.slice(1)||'home'}
async function go(r,id){if(state.chatChannel&&r!=='chat'){db.removeChannel(state.chatChannel);state.chatChannel=null}state.drawer=false;if(r==='home'){state.seen=true;localStorage.setItem('en_seen','1')}const map={splash:'/',onboarding:'/onboarding',home:'/',properties:'/properties',details:'/property/'+(id||state.current?.id||''),filters:'/filters',saved:'/saved',messages:'/messages',chat:'/messages/'+id,profile:'/profile','profile-edit':'/profile-edit',auth:'/auth',post:'/post'};history.pushState({},'',map[r]||'/');state.route=r;state.chatId=id||null;if(r==='details'||r==='properties'||r==='home'||r==='saved')await loadListings();if(r==='saved')await loadSaved();render()}
window.go=go;window.nextSlide=nextSlide;window.toggleSave=toggleSave;window.setTheme=setTheme;window.doAuth=doAuth;window.logout=logout;window.startChat=startChat;window.scheduleVisit=scheduleVisit;window.shareProperty=shareProperty;window.sendMessage=sendMessage;window.refreshListings=refreshListings;window.saveProfile=saveProfile;window.createListing=createListing;
window.onpopstate=async()=>{if(state.chatChannel){db.removeChannel(state.chatChannel);state.chatChannel=null}state.route=routeFromPath();await loadListings();render()};
async function render(){applyTheme();let h='';try{if(state.route==='splash')h=splash();else if(state.route==='onboarding')h=onboarding();else if(state.route==='home')h=home();else if(state.route==='properties')h=properties();else if(state.route==='details')h=await details(location.pathname.split('/')[2]);else if(state.route==='filters')h=filters();else if(state.route==='saved')h=saved();else if(state.route==='messages')h=await messages();else if(state.route==='chat')h=await chat(state.chatId);else if(state.route==='profile')h=await profile();else if(state.route==='profile-edit')h=await profileEdit();else if(state.route==='auth')h=auth();else if(state.route==='post')h=post();else h=home();app.innerHTML=h+(state.drawer?drawer():'');if(state.route==='chat')setTimeout(()=>{const b=document.getElementById('chatbody');if(b)b.scrollTop=b.scrollHeight},30);if(state.route==='onboarding'){const s=document.querySelector('.slider');if(s){let sx=0;s.ontouchstart=e=>sx=e.touches[0].clientX;s.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45){if(dx<0)nextSlide();else{state.slide=Math.max(0,state.slide-1);render()}}}}}}catch(e){console.error(e);app.innerHTML=`<main class="screen"><div class="empty"><h3>Something went wrong</h3><p>${esc(e.message||'Please retry')}</p><button class="btn primary" onclick="location.reload()">Reload</button></div></main>`}}

db.auth.onAuthStateChange(async(event,session)=>{if(session){await loadProfile();await loadSaved()}else{state.profile=null;state.saved=new Set()}if(state.route!=='auth')render()});
(async()=>{await boot()})();
</script></body></html>
