.loading{padding:75px 24px;text-align:center;color:var(--muted)}.spinner{width:36px;height:36px;border:3px solid #dce1e8;border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;z-index:100;left:50%;bottom:100px;transform:translateX(-50%);background:#111827;color:#fff;padding:13px 17px;border-radius:13px;font-size:14px;max-width:90vw;text-align:center}.dark{--bg:#0d1117;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--line:#263244}.dark .search,.dark .cat i,.dark .secondary,.dark .chip,.dark .listcard,.dark .themegrid button,.dark .menu button,.dark .field,.dark .form textarea,.dark .form select,.dark .auth .field,.dark .tab,.dark .theirs{background:#151e2d;color:var(--text)}.dark .bottom,.dark .composer{background:#111827}.dark .pcard{background:#111827}.dark .chatbody{background:#0d1117}.dark .amenities div{background:#151e2d}

<body><div id="app"><main class="screen"><div class="loading">Loading EstateNova…</div></main></div>
<script>
'use strict';
const {createClient}=window.supabase||{};
const SUPABASE_URL='https://bttujypzchanhvdmqutv.supabase.co';
const SUPABASE_KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
const HERO='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=90';
const slides=[
 ['Find The Perfect Property','Search only approved listings that actually exist in EstateNova.','https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1000&q=90'],
 ['Save What You Love','Your favourites stay synced to your real account.','https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1000&q=90'],
 ['Talk Directly','Message the actual listing owner through private conversations.','https://images.unsplash.com/photo-1600607688969-a5bfcd646154?auto=format&fit=crop&w=1000&q=90']
];
let state={route:location.pathname==='/'?(localStorage.getItem('en_seen')?'home':'splash'):location.pathname.slice(1),slide:0,filter:'All',query:'',theme:localStorage.getItem('en_theme')||'light',profile:null,listings:[],saved:new Set(),conversations:[],messages:[],chatId:null,channel:null,auth:'login',current:null,owner:null,drawer:false};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function price(v,label){if(label)return label;const n=Number(v||0);if(!n)return 'Price on request';return '₹'+(n>=1e7?(n/1e7).toFixed(2)+' Cr':n>=1e5?(n/1e5).toFixed(2)+' L':n.toLocaleString('en-IN'))}
function time(v){return v?new Date(v).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):''}
function image(p){return p?.cover_image_url||p?.image_urls?.[0]||''}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function theme(t){state.theme=t;localStorage.setItem('en_theme',t);document.documentElement.classList.toggle('dark',t==='dark');render()}
function top(){return '<div class="status"><b>EstateNova</b><span>Secure marketplace</span></div>'}
function bottom(active){return '<nav class="bottom">'+[['home','⌂','Home'],['properties','▦','Properties'],['saved','♡','Saved'],['messages','▣','Messages'],['profile','♙','Profile']].map(x=>'<button class="nav '+(active===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><i>'+x[1]+'</i>'+x[2]+'</button>').join('')+'</nav>'}
function header(title,back='home'){return top()+'<div class="head"><button class="icon" onclick="go(\''+back+'\')">‹</button><b class="title">'+esc(title)+'</b><button class="icon" onclick="state.drawer=true;render()">☰</button></div>'}
function splash(){return '<main class="screen splash"><div class="splashcopy"><div class="mark">⌂</div><div class="aex">AEXARA</div><div class="sub">REAL ESTATE</div><h1>Find Your Dream Home</h1><p>Discover real approved properties and communicate with real members. No fake listings.</p><div class="stack"><button class="btn primary full" onclick="go(\'onboarding\')">Get Started</button><button class="btn outline full" onclick="go(\'auth\')">Sign in / Create account</button></div></div></main>'}
function onboarding(){const s=slides[state.slide];return '<main class="screen onboard">'+top()+'<div class="oncopy"><span class="eyebrow">Find · Buy · Own</span><h1>'+esc(s[0])+'</h1><p>'+esc(s[1])+'</p></div><div class="slider"><div class="slides" style="transform:translateX(-'+(state.slide*100)+'%)">'+slides.map(x=>'<div class="slide"><div class="onphoto"><img src="'+x[2]+'" alt=""></div></div>').join('')+'</div></div><div class="onfoot"><div class="dots">'+slides.map((_,i)=>'<i class="'+(i===state.slide?'on':'')+'" onclick="state.slide='+i+';render()"></i>').join('')+'</div><button class="next" onclick="nextSlide()">'+(state.slide===slides.length-1?'✓':'→')+'</button></div></main>'}
function nextSlide(){if(state.slide<slides.length-1){state.slide++;render()}else{localStorage.setItem('en_seen','1');go('home')}}
function card(p){const im=image(p);return '<article class="pcard" onclick="go(\'details\',\''+p.id+'\')"><div class="pimg">'+(im?'<img src="'+esc(im)+'" alt="'+esc(p.title)+'">':'')+'<button class="heart" onclick="event.stopPropagation();toggleSave(\''+p.id+'\')">'+(state.saved.has(p.id)?'♥':'♡')+'</button>'+(p.featured?'<span class="badge">Featured</span>':'')+'</div><div class="pbody"><div class="prow"><b>'+esc(p.title)+'</b><strong class="price">'+esc(price(p.price,p.price_label))+'</strong></div><div class="meta">'+esc([p.locality,p.city].filter(Boolean).join(', ')||p.address||'Location not specified')+'</div><div class="stats">'+(p.area?'<span>'+esc(p.area)+' '+esc(p.area_unit||'sqft')+'</span>':'')+(p.bedrooms?'<span>'+p.bedrooms+' Bed</span>':'')+(p.bathrooms?'<span>'+p.bathrooms+' Bath</span>':'')+'</div></div></article>'}
function empty(title,text,button,route){return '<div class="empty"><div class="emptyicon">⌂</div><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+(button?'<button class="btn primary" onclick="go(\''+route+'\')">'+esc(button)+'</button>':'')+'</div>'}
function home(){const shown=state.listings.filter(x=>x.featured).concat(state.listings.filter(x=>!x.featured)).slice(0,3);return '<main class="screen">'+top()+'<div class="homehead"><div class="location">⌖ Mumbai, India</div><div class="actions"><button class="icon" onclick="theme(state.theme===\'dark\'?\'light\':\'dark\')">'+(state.theme==='dark'?'☀':'◐')+'</button><button class="btn secondary" onclick="go(\'auth\')">'+(state.profile?'Account':'Sign in')+'</button></div></div><div class="search"><span>⌕</span><input id="homeSearch" value="'+esc(state.query)+'" placeholder="Search properties, locality..." onkeydown="if(event.key===\'Enter\'){state.query=this.value;refreshListings()}"><button onclick="go(\'filters\')">☷</button></div><div class="banner"><b>Find Your<br>Dream Home</b><span>Browse live approved listings →</span></div><div class="sect"><b>Categories</b><button class="link" onclick="go(\'properties\')">See all</button></div><div class="cats">'+[['▥','Apartment'],['⌂','Villa'],['⌂','House'],['♟','Land'],['▦','Office']].map(c=>'<button class="cat" onclick="state.filter=\''+c[1]+'\';go(\'properties\')"><i>'+c[0]+'</i>'+c[1]+'</button>').join('')+'</div><div class="sect"><b>Available now</b><button class="link" onclick="go(\'properties\')">See all</button></div>'+(shown.length?shown.map(card).join(''):empty('No approved properties yet','Only real active listings approved by an admin appear here.','List a property','post'))+bottom('home')+'</main>'}
async function loadListings(){let q=db.from('listings').select('*').eq('approval_status','approved').eq('status','active').order('created_at',{ascending:false});if(state.filter!=='All')q=q.eq('property_type',state.filter);if(state.query.trim()){const term=state.query.trim().replace(/[,()]/g,' ');q=q.or('title.ilike.%'+term+'%,locality.ilike.%'+term+'%,city.ilike.%'+term+'%')}const r=await q;if(!r.error)state.listings=r.data||[];return r.error}
async function loadProfile(){const r=await db.auth.getUser();if(!r.data.user){state.profile=null;return}const p=await db.from('profiles').select('*').eq('id',r.data.user.id).maybeSingle();state.profile=p.data||{id:r.data.user.id,email:r.data.user.email}}
async function loadSaved(){if(!state.profile){state.saved=new Set();return}const r=await db.from('favorites').select('listing_id').eq('user_id',state.profile.id);state.saved=new Set((r.data||[]).map(x=>x.listing_id))}
async function boot(){document.documentElement.classList.toggle('dark',state.theme==='dark');await loadProfile();await loadSaved();if(state.route==='splash'&&localStorage.getItem('en_seen'))state.route='home';await loadListings();render()}
async function refreshListings(){await loadListings();render()}
async function toggleSave(id){if(!state.profile){toast('Please sign in to save properties');go('auth');return}const has=state.saved.has(id);const r=has?await db.from('favorites').delete().eq('user_id',state.profile.id).eq('listing_id',id):await db.from('favorites').insert({user_id:state.profile.id,listing_id:id});if(r.error){toast(r.error.message);return}has?state.saved.delete(id):state.saved.add(id);render()}
function properties(){return '<main class="screen">'+header('Properties')+'<div class="search" style="margin-top:15px"><span>⌕</span><input value="'+esc(state.query)+'" placeholder="Search properties..." onkeydown="if(event.key===\'Enter\'){state.query=this.value;refreshListings()}"><button onclick="go(\'filters\')">☷</button></div><div class="chips">'+['All','Apartment','Villa','House','Land','Office'].map(x=>'<button class="chip '+(state.filter===x?'on':'')+'" onclick="state.filter=\''+x+'\';refreshListings()">'+x+'</button>').join('')+'</div>'+(state.listings.length?'<div class="list">'+state.listings.map(p=>'<article class="listcard" onclick="go(\'details\',\''+p.id+'\')">'+(image(p)?'<img src="'+esc(image(p))+'" alt="">':'<div></div>')+'<div class="listbody"><button class="heart" onclick="event.stopPropagation();toggleSave(\''+p.id+'\')">'+(state.saved.has(p.id)?'♥':'♡')+'</button><b>'+esc(p.title)+'</b><div class="price">'+esc(price(p.price,p.price_label))+'</div><div class="meta">'+esc([p.locality,p.city].filter(Boolean).join(', '))+'</div><div class="stats">'+(p.area?'<span>'+p.area+' '+(p.area_unit||'sqft')+'</span>':'')+(p.bedrooms?'<span>'+p.bedrooms+' Bed</span>':'')+'</div></div></article>').join('')+'</div>':empty('No properties found','There are currently no approved active listings matching your search.'))+bottom('properties')+'</main>'}
function filters(){return '<main class="screen">'+header('Filters','properties')+'<section class="form"><div class="fieldwrap"><label>Property type</label><div class="chips" style="padding:0;flex-wrap:wrap">'+['All','Apartment','Villa','House','Land','Office'].map(x=>'<button class="chip '+(state.filter===x?'on':'')+'" onclick="state.filter=\''+x+'\';render()">'+x+'</button>').join('')+'</div></div><button class="btn primary full" onclick="go(\'properties\')">Show Results</button></section></main>'}
function saved(){const ps=state.listings.filter(p=>state.saved.has(p.id));return '<main class="screen">'+header('Saved Properties')+(ps.length?'<div class="list">'+ps.map(p=>'<article class="listcard" onclick="go(\'details\',\''+p.id+'\')">'+(image(p)?'<img src="'+esc(image(p))+'" alt="">':'<div></div>')+'<div class="listbody"><button class="heart" onclick="event.stopPropagation();toggleSave(\''+p.id+'\')">♥</button><b>'+esc(p.title)+'</b><div class="price">'+esc(price(p.price,p.price_label))+'</div><div class="meta">'+esc([p.locality,p.city].filter(Boolean).join(', '))+'</div></div></article>').join('')+'</div>':empty('No saved properties','Save a real property by tapping its heart icon.','Browse properties','properties'))+bottom('saved')+'</main>'}
async function details(id){let p=state.listings.find(x=>x.id===id);if(!p){const r=await db.from('listings').select('*').eq('id',id).maybeSingle();p=r.data}if(!p)return '<main class="screen">'+header('Property','properties')+empty('Property unavailable','This listing no longer exists or is not publicly available.')+'</main>';state.current=p;return '<main class="screen"><div class="detailimg">'+(image(p)?'<img src="'+esc(image(p))+'" alt="'+esc(p.title)+'">':'')+'<button class="over back" onclick="go(\'properties\')">‹</button><div class="over detailtools"><button onclick="toggleSave(\''+p.id+'\')">'+(state.saved.has(p.id)?'♥':'♡')+'</button><button onclick="shareProperty()">↗</button></div><span class="count">'+((p.image_urls||[]).length||1)+' photo'+((p.image_urls||[]).length===1?'':'s')+'</span></div><section class="detail"><h1>'+esc(p.title)+'</h1><div class="dprice">'+esc(price(p.price,p.price_label))+'</div><div class="meta">'+esc([p.locality,p.city,p.state].filter(Boolean).join(', ')||p.address||'')+'</div><div class="facts"><div class="fact"><b>'+esc(p.area||'—')+'</b><small>'+esc(p.area_unit||'sqft')+'</small></div><div class="fact"><b>'+esc(p.bedrooms||'—')+'</b><small>Bedrooms</small></div><div class="fact"><b>'+esc(p.bathrooms||'—')+'</b><small>Bathrooms</small></div><div class="fact"><b>'+esc(p.parking||'—')+'</b><small>Parking</small></div></div><div class="dsection"><b>About Property</b><p>'+esc(p.description||'No description provided by the owner.')+'</p></div><div class="dsection"><b>Amenities</b><div class="amenities">'+((p.amenities||[]).length?(p.amenities||[]).map(a=>'<div><i>✓</i><small>'+esc(a)+'</small></div>').join(''):'<div><i>—</i><small>Not specified</small></div>')+'</div></div><div class="dactions"><button class="btn outline" onclick="scheduleVisit(\''+p.id+'\')">Schedule Visit</button><button class="btn primary" onclick="startChat(\''+p.id+'\')">Message owner</button></div></section>'+bottom('properties')+'</main>'}
async function shareProperty(){try{await navigator.share({title:state.current?.title||'EstateNova property',url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);toast('Property link copied')}catch(_){toast('Share unavailable')}}}
async function scheduleVisit(id){if(!state.profile){toast('Please sign in first');go('auth');return}const value=window.prompt('Preferred visit date and time?');if(!value)return;const r=await db.from('inquiries').insert({listing_id:id,buyer_id:state.profile.id,message:'Visit request: '+value,buyer_phone:state.profile.phone,buyer_email:state.profile.email});toast(r.error?r.error.message:'Visit request sent')}
async function startChat(id){if(!state.profile){toast('Please sign in to message the owner');go('auth');return}const value=window.prompt('Write your first message');if(!value?.trim())return;const r=await db.rpc('start_conversation',{p_listing_id:id,p_message:value.trim()});if(r.error){toast(r.error.message);return}go('chat',r.data)}
async function loadConversations(){if(!state.profile){state.conversations=[];return}const r=await db.rpc('get_my_conversations');state.conversations=r.error?[]:(r.data||[])}
async function messages(){await loadConversations();return '<main class="screen">'+header('Messages')+(state.profile?(state.conversations.length?'<section class="messages">'+state.conversations.map(c=>'<div class="message" onclick="go(\'chat\',\''+c.id+'\')"><img src="'+esc(c.other_user_avatar||HERO)+'" alt=""><div><b>'+esc(c.other_user_name||'EstateNova member')+'</b><small>'+esc(c.last_message||c.listing_title||'Conversation')+'</small></div><span>'+time(c.last_message_at)+'</span></div>').join('')+'</section>':empty('No conversations yet','Open a live property and message its owner to start a real conversation.','Browse properties','properties')):empty('Sign in to view messages','Your conversations are private and tied to your account.','Sign in','auth'))+bottom('messages')+'</main>'}
async function chat(id){if(!state.profile){go('auth');return ''}if(!state.conversations.length)await loadConversations();const c=state.conversations.find(x=>x.id===id);if(!c)return '<main class="screen">'+header('Chat','messages')+empty('Conversation not found','This conversation is not available for your account.')+'</main>';const r=await db.from('messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true});state.messages=r.data||[];if(state.channel)db.removeChannel(state.channel);state.channel=db.channel('estate-chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},payload=>{if(!state.messages.some(m=>m.id===payload.new.id)){state.messages.push(payload.new);renderChat()}}).subscribe();await db.rpc('mark_conversation_read',{p_conversation_id:id});return chatHtml(c)}
function chatHtml(c){return '<main class="screen chat"><div class="chathead"><button class="icon" onclick="go(\'messages\')">‹</button><img src="'+esc(c.other_user_avatar||HERO)+'" alt=""><div><b>'+esc(c.other_user_name||'EstateNova member')+'</b><div class="muted">'+esc(c.listing_title||'EstateNova')+'</div></div></div><div class="chatbody" id="chatbody">'+state.messages.map(m=>'<div class="bubble '+(m.sender_id===state.profile.id?'mine':'theirs')+'">'+esc(m.body)+'<time>'+time(m.created_at)+'</time></div>').join('')+'</div><form class="composer" onsubmit="sendMessage(event,\''+c.id+'\')"><input id="messageInput" autocomplete="off" placeholder="Write a message…"><button class="btn primary send">➤</button></form></main>'}
function renderChat(){if(state.route!=='chat')return;const b=document.getElementById('chatbody');if(!b)return;b.innerHTML=state.messages.map(m=>'<div class="bubble '+(m.sender_id===state.profile.id?'mine':'theirs')+'">'+esc(m.body)+'<time>'+time(m.created_at)+'</time></div>').join('');b.scrollTop=b.scrollHeight}
async function sendMessage(e,id){e.preventDefault();const input=document.getElementById('messageInput');const body=input.value.trim();if(!body)return;input.disabled=true;const r=await db.from('messages').insert({conversation_id:id,sender_id:state.profile.id,body});input.disabled=false;if(r.error)toast(r.error.message);else{input.value='';setTimeout(renderChat,50)}}
async function profile(){await loadProfile();return '<main class="screen">'+top()+(state.profile?'<section class="profileblue"><img src="'+esc(state.profile.avatar_url||HERO)+'" alt=""><div><b>'+esc(state.profile.full_name||'EstateNova member')+'</b><small>'+esc(state.profile.email||'')+'</small></div></section>':empty('You are not signed in','Sign in to access your profile and account features.','Sign in','auth'))+'<section class="theme"><b>Appearance</b><div class="themegrid"><button class="'+(state.theme==='light'?'on':'')+'" onclick="theme(\'light\')">☀ Light</button><button class="'+(state.theme==='dark'?'on':'')+'" onclick="theme(\'dark\')">◐ Dark</button></div></section><div class="menu">'+(state.profile?[['♙','My Profile','profile-edit'],['▤','My Enquiries','messages'],['♡','Saved Properties','saved'],['⌂','Sell / Post','post']].map(x=>'<button onclick="go(\''+x[2]+'\')"><i>'+x[0]+'</i>'+x[1]+'<span>›</span></button>').join('')+'<button onclick="logout()"><i>⇥</i>Sign out<span>›</span></button>':'<button onclick="go(\'auth\')"><i>↪</i>Sign in / Create account<span>›</span></button>')+'</div>'+bottom('profile')+'</main>'}
async function profileEdit(){if(!state.profile)return '<main class="screen">'+header('My Profile')+empty('Sign in required','Please sign in first.','Sign in','auth')+'</main>';return '<main class="screen">'+header('My Profile','profile')+'<form class="form" onsubmit="saveProfile(event)"><div class="fieldwrap"><label>Full name</label><input id="pn" class="field" value="'+esc(state.profile.full_name||'')+'"></div><div class="fieldwrap"><label>Phone</label><input id="pp" class="field" value="'+esc(state.profile.phone||'')+'"></div><div class="fieldwrap"><label>Email</label><input class="field" value="'+esc(state.profile.email||'')+'" disabled></div><div class="fieldwrap"><label>Bio</label><textarea id="pb">'+esc(state.profile.bio||'')+'</textarea></div><div class="fieldwrap"><label>Profile photo</label><input id="avatar" class="field" type="file" accept="image/*"><img class="preview" src="'+esc(state.profile.avatar_url||HERO)+'" alt=""></div><div id="profileMsg" class="error"></div><button class="btn primary full">Save Changes</button></form></main>'}
async function saveProfile(e){e.preventDefault();const msg=document.getElementById('profileMsg');msg.textContent='Saving…';const patch={full_name:document.getElementById('pn').value.trim(),phone:document.getElementById('pp').value.trim(),bio:document.getElementById('pb').value.trim(),updated_at:new Date().toISOString()};const f=document.getElementById('avatar').files[0];if(f){const path=state.profile.id+'/'+crypto.randomUUID()+'.'+(f.name.split('.').pop()||'jpg');const u=await db.storage.from('avatars').upload(path,f,{upsert:false,contentType:f.type});if(u.error){msg.textContent=u.error.message;return}patch.avatar_url=db.storage.from('avatars').getPublicUrl(path).data.publicUrl}const r=await db.from('profiles').update(patch).eq('id',state.profile.id);if(r.error){msg.textContent=r.error.message;return}await loadProfile();toast('Profile saved');go('profile')}
function post(){if(!state.profile)return '<main class="screen">'+header('Sell / Post','profile')+empty('Sign in required','Only signed-in members can publish a property.','Sign in','auth')+'</main>';return '<main class="screen">'+header('Sell / Post','profile')+'<form class="form" onsubmit="createListing(event)"><div class="fieldwrap"><label>Property title</label><input id="lt" class="field" required placeholder="3 BHK apartment in Powai"></div><div class="fieldwrap"><label>Property type</label><select id="ltype" class="field"><option>Apartment</option><option>Villa</option><option>House</option><option>Land</option><option>Office</option></select></div><div class="fieldwrap"><label>Listing type</label><select id="lkind" class="field"><option value="sale">Sale</option><option value="rent">Rent</option><option value="lease">Lease</option></select></div><div class="fieldwrap"><label>Price</label><input id="lprice" class="field" type="number" min="0" required></div><div class="fieldwrap"><label>Area (sqft)</label><input id="larea" class="field" type="number" min="0"></div><div class="fieldwrap"><label>Bedrooms</label><input id="lbeds" class="field" type="number" min="0"></div><div class="fieldwrap"><label>Bathrooms</label><input id="lbaths" class="field" type="number" min="0"></div><div class="fieldwrap"><label>City</label><input id="lcity" class="field" required></div><div class="fieldwrap"><label>Locality</label><input id="llocality" class="field"></div><div class="fieldwrap"><label>Address</label><input id="laddress" class="field"></div><div class="fieldwrap"><label>Description</label><textarea id="ldesc" required></textarea></div><div class="fieldwrap"><label>Amenities, comma separated</label><input id="lamen" class="field"></div><div class="fieldwrap"><label>Property photos</label><input id="lphotos" class="field" type="file" accept="image/*" multiple required></div><div id="postMsg" class="error"></div><button class="btn primary full">Submit for admin approval</button></form></main>'}
async function createListing(e){e.preventDefault();const msg=document.getElementById('postMsg');const files=[...document.getElementById('lphotos').files].slice(0,10);if(!files.length){msg.textContent='Add at least one photo';return}msg.textContent='Creating listing…';const row={owner_id:state.profile.id,title:document.getElementById('lt').value.trim(),property_type:document.getElementById('ltype').value,listing_type:document.getElementById('lkind').value,price:Number(document.getElementById('lprice').value),area:Number(document.getElementById('larea').value)||null,bedrooms:Number(document.getElementById('lbeds').value)||null,bathrooms:Number(document.getElementById('lbaths').value)||null,city:document.getElementById('lcity').value.trim(),locality:document.getElementById('llocality').value.trim(),address:document.getElementById('laddress').value.trim(),description:document.getElementById('ldesc').value.trim(),amenities:document.getElementById('lamen').value.split(',').map(x=>x.trim()).filter(Boolean),approval_status:'pending',status:'draft'};const ins=await db.from('listings').insert(row).select().single();if(ins.error){msg.textContent=ins.error.message;return}const urls=[];for(let i=0;i<files.length;i++){const f=files[i],path=state.profile.id+'/'+ins.data.id+'/'+crypto.randomUUID()+'.'+(f.name.split('.').pop()||'jpg');const u=await db.storage.from('property-images').upload(path,f,{upsert:false,contentType:f.type});if(u.error){msg.textContent=u.error.message;return}const url=db.storage.from('property-images').getPublicUrl(path).data.publicUrl;urls.push(url);await db.from('listing_images').insert({listing_id:ins.data.id,storage_path:path,public_url:url,sort_order:i})}const up=await db.from('listings').update({cover_image_url:urls[0]||null,image_urls:urls}).eq('id',ins.data.id);if(up.error){msg.textContent=up.error.message;return}msg.className='success';msg.textContent='Submitted for admin approval.';setTimeout(()=>go('profile'),800)}
function auth(){return '<main class="screen auth">'+top()+'<div class="authbrand">Estate<span>Nova</span></div><div class="tabs"><button class="tab '+(state.auth==='login'?'on':'')+'" onclick="state.auth=\'login\';render()">Sign in</button><button class="tab '+(state.auth==='signup'?'on':'')+'" onclick="state.auth=\'signup\';render()">Create account</button></div><h1>'+(state.auth==='login'?'Welcome back':'Create your account')+'</h1><p>'+(state.auth==='login'?'Sign in to access saved properties and private conversations.':'Create your EstateNova account to save, message and publish.')+'</p>'+(state.auth==='signup'?'<input id="an" class="field" placeholder="Full name">':'')+'<input id="ae" class="field" type="email" autocomplete="email" placeholder="Email address"><input id="ap" class="field" type="password" autocomplete="'+(state.auth==='login'?'current-password':'new-password')+'" placeholder="Password"><div id="am" class="error"></div><button class="btn primary full" onclick="doAuth()">'+(state.auth==='login'?'Sign in':'Create account')+'</button><div class="divider">secure account</div><button class="btn secondary full" onclick="go(\'home\')">Continue browsing</button></main>'}
async function doAuth(){const email=document.getElementById('ae').value.trim(),password=document.getElementById('ap').value,msg=document.getElementById('am');if(!email||password.length<6){msg.textContent='Enter a valid email and a password of at least 6 characters.';return}msg.textContent='Please wait…';const r=state.auth==='login'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{data:{full_name:document.getElementById('an')?.value?.trim()||''}}});if(r.error){msg.textContent=r.error.message;return}if(!r.data.session){msg.textContent='Account created. Check your email if confirmation is enabled.';return}await loadProfile();await loadSaved();toast('Signed in');go('home')}
async function logout(){if(state.channel)db.removeChannel(state.channel);await db.auth.signOut();state.profile=null;state.saved=new Set();state.conversations=[];go('home')}
function drawer(){return '<div style="position:fixed;inset:0;background:#0008;z-index:80" onclick="state.drawer=false;render()"><aside style="width:min(360px,84vw);height:100%;background:var(--card);overflow:auto;box-shadow:10px 0 35px #0003" onclick="event.stopPropagation()"><div class="profileblue"><img src="'+esc(state.profile?.avatar_url||HERO)+'" alt=""><div><b>'+esc(state.profile?.full_name||'EstateNova')+'</b><small>'+esc(state.profile?.email||'Real estate marketplace')+'</small></div></div><div class="menu">'+[['⌂','Home','home'],['▦','Properties','properties'],['♡','Saved Properties','saved'],['▣','Messages','messages'],['♙','Profile','profile'],['⌂','Sell / Post','post']].map(x=>'<button onclick="go(\''+x[2]+'\')"><i>'+x[0]+'</i>'+x[1]+'<span>›</span></button>').join('')+'<button onclick="theme(state.theme===\'dark\'?\'light\':\'dark\')"><i>◐</i>'+ (state.theme==='dark'?'Light mode':'Dark mode') +'<span>›</span></button>'+(state.profile?'<button onclick="logout()"><i>⇥</i>Sign out<span>›</span></button>':'<button onclick="go(\'auth\')"><i>↪</i>Sign in<span>›</span></button>')+'</div></aside></div>'}
function routePath(r,id){return {splash:'/',onboarding:'/onboarding',home:'/',properties:'/properties',filters:'/filters',saved:'/saved',messages:'/messages',chat:'/messages/'+id,profile:'/profile','profile-edit':'/profile-edit',auth:'/auth',post:'/post',details:'/property/'+id}[r]||'/'}
async function go(r,id){if(state.channel&&r!=='chat'){db.removeChannel(state.channel);state.channel=null}state.drawer=false;if(r==='home')localStorage.setItem('en_seen','1');history.pushState({},'',routePath(r,id));state.route=r;state.chatId=id||null;if(['home','properties','details','saved'].includes(r))await loadListings();if(r==='saved')await loadSaved();render()}
window.go=go;window.render=render;window.nextSlide=nextSlide;window.theme=theme;window.toggleSave=toggleSave;window.refreshListings=refreshListings;window.startChat=startChat;window.scheduleVisit=scheduleVisit;window.shareProperty=shareProperty;window.sendMessage=sendMessage;window.doAuth=doAuth;window.logout=logout;window.saveProfile=saveProfile;window.createListing=createListing;
window.addEventListener('popstate',async()=>{state.route=location.pathname==='/'?(localStorage.getItem('en_seen')?'home':'splash'):location.pathname.slice(1);await loadListings();render()});
async function render(){try{document.documentElement.classList.toggle('dark',state.theme==='dark');let html='';if(state.route==='splash')html=splash();else if(state.route==='onboarding')html=onboarding();else if(state.route==='home')html=home();else if(state.route==='properties')html=properties();else if(state.route==='filters')html=filters();else if(state.route==='saved')html=saved();else if(state.route==='details')html=await details(state.chatId||location.pathname.split('/')[2]);else if(state.route==='messages')html=await messages();else if(state.route==='chat')html=await chat(state.chatId);else if(state.route==='profile')html=await profile();else if(state.route==='profile-edit')html=await profileEdit();else if(state.route==='auth')html=auth();else if(state.route==='post')html=post();else html=home();app.innerHTML=html+(state.drawer?drawer():'');if(state.route==='chat')setTimeout(()=>{const b=document.getElementById('chatbody');if(b)b.scrollTop=b.scrollHeight},20);if(state.route==='onboarding'){const el=document.querySelector('.slider');if(el){let start=0;el.ontouchstart=e=>start=e.touches[0].clientX;el.ontouchend=e=>{const dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>45){if(dx<0)nextSlide();else{state.slide=Math.max(0,state.slide-1);render()}}}}}}catch(e){console.error(e);app.innerHTML='<main class="screen">'+empty('Something went wrong',e?.message||'Please reload the page.','Reload','home')+'</main>'}}
window.addEventListener('error',e=>{console.error(e.error||e.message)});
db.auth.onAuthStateChange(async(_,session)=>{state.profile=session?state.profile: null;if(session){await loadProfile();await loadSaved()}else{state.profile=null;state.saved=new Set()}if(state.route!=='auth')render()});
boot().catch(e=>{console.error(e);app.innerHTML='<main class="screen">'+empty('EstateNova could not start',e?.message||'Please refresh and try again.')+'</main>'});
</script>
</body>
