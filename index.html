<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06245b">
<title>EstateNova</title>
<style>
:root{--navy:#06245b;--gold:#f4b21b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--navy);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
#boot-splash{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;padding:32px 24px}
.boot-brand{text-align:center;animation:bootIn .35s ease-out both}
.boot-logo{width:86px;height:86px;margin:0 auto 22px;display:block}
.boot-name{font-size:34px;line-height:1;font-weight:900;letter-spacing:2px}
.boot-sub{margin-top:10px;font-size:11px;letter-spacing:5px;font-weight:700;opacity:.9}
#app{display:none}
@keyframes bootIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main id="boot-splash" aria-label="EstateNova">
  <div class="boot-brand">
    <svg class="boot-logo" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M14 42.5 48 14l34 28.5V82H14V42.5Z" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M34 82V57h28v25M28 42h40" stroke="#f4b21b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M48 14v13" stroke="#f4b21b" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div class="boot-name">EstateNova</div>
    <div class="boot-sub">REAL ESTATE</div>
  </div>
</main>
<div id="app"></div>
<script>
(function(){
  var appReady=false,minimumSplashDone=false,finished=false;
  function finish(){
    if(finished||!appReady||!minimumSplashDone)return;
    finished=true;
    try{localStorage.setItem('en_seen','1')}catch(e){}
    document.getElementById('boot-splash').style.display='none';
    document.getElementById('app').style.display='block';
    if(typeof window.go==='function')window.go('home');
  }
  function load(src,done){
    var s=document.createElement('script');
    s.src=src;
    s.onload=function(){if(done)done()};
    s.onerror=function(){console.error('EstateNova failed to load:',src)};
    document.head.appendChild(s);
  }
  // Start loading dependencies immediately while the 1-second splash is visible.
  load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',function(){
    load('/app.js',function(){appReady=true;finish()});
  });
  setTimeout(function(){minimumSplashDone=true;finish()},1000);
})();
</script>
</body>
</html>
