<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102b63">
  <meta name="description" content="EstateNova — properties marketplace">
  <title>EstateNova — Buy & Sell Properties</title>
  <link rel="stylesheet" href="/app.css?v=estate-20260830-6">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f7f8fb}
    #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:linear-gradient(145deg,#102b63,#193c7f);color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .2s ease}
    #boot.hide{opacity:0;pointer-events:none}
    .boot-inner{text-align:center;padding:24px}
    .boot-mark{width:78px;height:78px;margin:0 auto 18px;border-radius:22px;border:1px solid #ffffff55;background:#ffffff12;display:grid;place-items:center;font-size:32px;font-weight:900}
    .boot-name{font-size:32px;font-weight:900;letter-spacing:-1px}
    .boot-name span{color:#8b7cf5}
    .boot-status{margin-top:9px;font-size:12px;opacity:.75}
    #boot-error{display:none;max-width:360px;margin:18px auto 0;padding:12px 14px;border:1px solid #ffffff33;border-radius:12px;background:#0002;font-size:12px;line-height:1.5}
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-mark">EN</div>
      <div class="boot-name">Estate<span>Nova</span></div>
      <div class="boot-status" id="boot-status">Loading marketplace…</div>
      <div id="boot-error"></div>
    </div>
  </div>

  <div id="app"></div>

  <script>
    (async function(){
      const status=document.getElementById('boot-status');
      const errorBox=document.getElementById('boot-error');
      const boot=document.getElementById('boot');
      const setStatus=(text)=>{status.textContent=text};
      const loadScript=(src)=>new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src=src;
        s.async=false;
        s.onload=resolve;
        s.onerror=()=>reject(new Error('Failed to load '+src));
        document.head.appendChild(s);
      });

      try{
        setStatus('Connecting to marketplace…');
        await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
        if(!window.supabase) throw new Error('Supabase client did not load.');

        setStatus('Loading application…');
        await loadScript('/app-loader.js?v=estate-20260830-6');
        if(window.estatenovaReady) await window.estatenovaReady;

        if(typeof window.render==='function') await window.render();
        if(typeof window.render==='function'){
          setStatus('Ready');
          setTimeout(()=>boot.classList.add('hide'),120);
          setTimeout(()=>boot.remove(),420);
        }else{
          throw new Error('EstateNova application did not initialize.');
        }
      }catch(error){
        console.error('EstateNova startup failed:',error);
        setStatus('Unable to start the marketplace');
        errorBox.style.display='block';
        errorBox.textContent='Please refresh once. If this persists, the application loader or one of its modules failed to load.';
      }
    })();
  </script>
</body>
</html>
