border-radius:8px';b.appendChild(i)};r.readAsDataURL(f)})}function auth(){return`<main class="screen auth">${top()}<div class="authbrand">Estate<span>Nova</span></div><div class="tabs"><button class="tab ${S.auth==='login'?'on':''}" onclick="S.auth='login';render()">Sign in</button><button class="tab ${S.auth==='signup'?'on':''}" onclick="S.auth='signup';render()">Create account</button></div><h1>${S.auth==='login'?'Welcome back':'Create your account'}</h1><p>${S.auth==='login'?'Sign in to your EstateNova account.':'Create an account and continue.'}</p>${S.auth==='signup'?'<input id="an" class="field" placeholder="Full name">':''}<input id="ae" class="field" type="email" placeholder="Email address"><input id="ap" class="field" type="password" placeholder="Password"><button class="outline full" onclick="showpass()">Show / Hide password</button><div id="am" class="msg"></div><button class="primary full" onclick="doauth()">${S.auth==='login'?'Sign in':'Create account'}</button></main>`}function showpass(){let x=document.getElementById('ap');x.type=x.type==='password'?'text':'password'}async function doauth(){let e=document.getElementById('ae').value.trim(),p=document.getElementById('ap').value,m=document.getElementById('am');if(!/^\S+@\S+\.\S+$/.test(e)){m.textContent='Enter a valid email address.';return}m.textContent='Please wait…';try{let u=S.auth==='login'?A+'/auth/v1/token?grant_type=password':A+'/auth/v1/signup',r=await fetch(u,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})}),d=await r.json();if(!r.ok){m.textContent='Unable to complete. Check your details.';return}if(d.access_token)localStorage.en_access_token=d.access_token;if(d.refresh_token)localStorage.en_refresh_token=d.refresh_token;if(d.user?.id)localStorage.en_user_id=d.user.id;localStorage.en_email=e;if(S.auth==='signup'&&document.getElementById('an'))localStorage.en_name=document.getElementById('an').value;m.style.color='#138a57';m.textContent='Success';setTimeout(()=>go('profile'),250)}catch{m.textContent='Network error. Please try again.'}}function logout(){['en_access_token','en_refresh_token','en_user_id'].forEach(k=>localStorage.removeItem(k));localStorage.removeItem('en_seen');go('splash')}function drawer(){return`<div class="drawerShade" onclick="S.drawer=false;render()"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawerHead"><img src="${localStorage.en_avatar||I.hero}"><div><b>${localStorage.en_name||'Rahul Verma'}</b><small>${localStorage.en_phone||'+91 98765 43210'}</small></div></div><div class="drawermenu">${[['⌂','Home','home'],['▦','Properties','properties'],['♡','Saved Properties','saved'],['▣','Messages','messages'],['▤','My Enquiries','messages'],['◷','Scheduled Visits','messages'],['♙','My Profile','profile'],['⚙','Settings','profile'],['?','Help & Support','messages'],['⇥','Logout','splash']].map(x=>`<button onclick="${x[2]==='splash'?'logout()':`go('${x[2]}')`}"><i>${x[0]}</i>${x[1]}<span>›</span></button>`).join('')}</div></aside></div>`}function render(){let r=S.route,h=r==='splash'?splash():r==='onboarding'?onboarding():r==='home'?home():r==='properties'?properties():r==='details'?details():r==='filters'?filters():r==='saved'?saved():r==='messages'?messages():r==='profile'?profile():r==='profile-edit'?profileEdit():r==='post'?post():r==='auth'?auth():home();document.getElementById('app').innerHTML=h+(S.drawer?drawer():'')}render();
</script></body></html>
