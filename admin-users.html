<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>EstateNova Admin — Users</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050816;color:#fff;font-family:system-ui,-apple-system,sans-serif}.dash{max-width:1200px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.eyebrow{font-size:10px;letter-spacing:3px;color:#91a0bf}.muted{color:#93a4c7}.top button,.back{width:auto;margin:0;padding:11px 16px;border:0;border-radius:13px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font:inherit;font-weight:800;cursor:pointer}.panel{margin-top:22px;background:#0b1530;border:1px solid #ffffff15;border-radius:20px;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filter{width:auto;margin:0;padding:10px 15px;border:1px solid #26375f;border-radius:12px;background:#07112a;color:#c9d3eb;font:inherit;font-weight:750;cursor:pointer}.filter.active{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-color:transparent}.search{width:100%;padding:13px;border-radius:12px;background:#07112a;border:1px solid #26375f;color:#fff;font:inherit}.user{padding:17px 0;border-top:1px solid #ffffff15}.user:first-child{border-top:0}.name{font-size:17px;font-weight:800}.email{margin-top:4px;font-weight:650;word-break:break-word}.meta{margin-top:8px;color:#93a4c7;font-size:13px;line-height:1.55}.badge{display:inline-block;margin-left:7px;padding:3px 8px;border-radius:999px;background:#17264a;color:#b9c8eb;font-size:11px;text-transform:capitalize}.banned{color:#ff9eb3}.count{font-size:14px;color:#93a4c7;margin-top:4px}@media(max-width:600px){.dash{padding:18px}.top h1{font-size:25px}}
</style>
</head>
<body>
<div class="dash">
<div class="top"><div><div class="eyebrow">ESTATENOVA CONTROL CENTER</div><h1>Registered Users</h1><div class="muted">All EstateNova registered accounts</div></div><div><button class="back" onclick="location.href='admin-login.html'">← Dashboard</button></div></div>
<div class="panel"><div id="summary" class="count">Loading users…</div><div class="toolbar"><button class="filter active" data-role="all">All</button><button class="filter" data-role="buyer">Buyers</button><button class="filter" data-role="seller">Sellers</button><button class="filter" data-role="other">Other</button></div><input id="search" class="search" placeholder="Search name, email, phone or company…" autocomplete="off"><div id="users" style="margin-top:14px">Loading users…</div></div>
</div>
<script>
'use strict';
const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console';
const token=sessionStorage.getItem('estatenova_admin_session');
let users=[];let role='all';
const el=id=>document.getElementById(id);
function esc(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
async function api(action,data={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token||''},cache:'no-store',body:JSON.stringify({action,...data})});if(r.status===401){sessionStorage.removeItem('estatenova_admin_session');location.href='admin-login.html';throw new Error('Session expired.');}if(!r.ok)throw new Error('Admin service error.');return r.json();}
function normalizeRole(value){const r=String(value||'').trim().toLowerCase();if(r==='buyer'||r==='buyers')return 'buyer';if(r==='seller'||r==='sellers')return 'seller';return 'other';}
function render(){const q=el('search').value.trim().toLowerCase();const filtered=users.filter(u=>{const rr=normalizeRole(u.role);const text=[u.full_name,u.email,u.phone,u.company_name,u.role].map(v=>String(v||'').toLowerCase()).join(' ');return(role==='all'||rr===role)&&(!q||text.includes(q));});el('summary').textContent=users.length+' registered user'+(users.length===1?'':'s')+' · '+filtered.length+' shown';el('users').innerHTML=filtered.length?filtered.map(u=>{const r=normalizeRole(u.role);const displayRole=String(u.role||'Not set');const created=u.created_at?new Date(u.created_at).toLocaleString():'';return '<div class="user"><div class="name">'+esc(u.full_name||'Unnamed user')+' <span class="badge">'+esc(displayRole)+'</span>'+(u.is_banned?'<span class="badge banned">Banned</span>':'')+'</div><div class="email">'+esc(u.email||'Email unavailable')+'</div><div class="meta">'+(u.phone?'Phone: '+esc(u.phone)+' · ':'')+(u.company_name?'Company: '+esc(u.company_name)+' · ':'')+(created?'Joined: '+esc(created):'')+'</div></div>';}).join(''):'<p class="muted">No users match this filter.</p>';}
async function load(){if(!token){location.href='admin-login.html';return;}try{const data=await api('overview');users=Array.isArray(data.users)?data.users:[];render();}catch(e){el('users').innerHTML='<p class="muted">'+esc(e.message)+'</p>';}}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{role=b.dataset.role;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render();}));el('search').addEventListener('input',render);load();
</script>
</body>
</html>
