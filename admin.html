<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova Admin</title><style>:root{--bg:#050816;--p:#0b1530;--p2:#101d3e;--line:#24365e;--text:#f5f7ff;--muted:#91a0bf;--a:#6d4aff;--b:#2563eb;--ok:#18a874;--bad:#9d294a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#172b61,transparent 32%),radial-gradient(circle at 90% 0,#3c155c,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:28px;font-weight:950}.grad{background:linear-gradient(90deg,#60a5fa,#a78bfa,#f0abfc);-webkit-background-clip:text;color:transparent}.eyebrow{font-size:10px;letter-spacing:3px;color:#8293b7}.btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,var(--b),var(--a));color:#fff;font-weight:800;cursor:pointer}.ghost{background:#ffffff0b;border:1px solid #ffffff18}.danger{background:var(--bad)}.ok{background:var(--ok)}.nav{display:flex;gap:8px;overflow:auto;margin:24px 0 16px}.nav button{white-space:nowrap;border:1px solid #ffffff14;background:#ffffff08;color:#b9c6df;padding:10px 14px;border-radius:11px;cursor:pointer}.nav button.active{background:#6d4aff2b;color:#fff;border-color:#6d4aff66}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel,.row{background:#0b1530e8;border:1px solid #ffffff12;border-radius:18px}.stat{padding:18px}.num{font-size:29px;font-weight:950;margin-top:5px}.panel{padding:20px;margin-top:15px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.list{display:grid;gap:10px}.row{padding:15px;background:#101d3e}.rowmain{display:flex;justify-content:space-between;gap:15px}.muted{color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ffffff0c;font-size:11px}.pending{color:#ffd58a}.approved{color:#7de4b7}.rejected{color:#ff9caf}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px;margin-bottom:13px}.input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#07112a;color:#fff}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101d3e;border:1px solid #ffffff20;padding:12px 16px;border-radius:12px;display:none}.toast.on{display:block}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.rowmain{flex-direction:column}.filters{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">Estate<span class="grad">Nova</span></div><div class="eyebrow">PRIVATE ADMIN CONSOLE</div></div><div><span id="who" class="muted" style="margin-right:10px"></span><button class="btn ghost" onclick="logout()">Sign out</button></div></header><nav class="nav"><button class="active" data-t="overview" onclick="tab('overview')">Overview</button><button data-t="listings" onclick="tab('listings')">Listings</button><button data-t="users" onclick="tab('users')">Users</button><button data-t="inquiries" onclick="tab('inquiries')">Inquiries</button><a class="btn ghost" href="/" style="text-decoration:none">Open site</a></nav><main id="app"></main></div><div id="toast" class="toast"></div><script>const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console',token=()=>sessionStorage.getItem('estatenova_admin_session');let data={listings:[],users:[],inquiries:[]},current='overview';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n)>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':Number(n)>=1e5?'₹'+(n/1e5).toFixed(1)+' L':'₹'+Number(n||0).toLocaleString('en-IN');function toast(s){$('toast').textContent=s;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2200)}async function api(action,extra={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token()||''},body:JSON.stringify({action,...extra})});const j=await r.json();if(!r.ok){if(r.status===401){sessionStorage.removeItem('estatenova_admin_session');location.href='/admin'}throw Error(j.error||'Request failed')}return j}async function load(){try{data=await api('overview');$('who').textContent='satyanshraj774@gmail.com';render()}catch(e){location.href='/admin'}}function tab(t){current=t;document.querySelectorAll('.nav button[data-t]').forEach(x=>x.classList.toggle('active',x.dataset.t===t));render()}function listing(x){return `<div class="row"><div class="rowmain"><div><b>${esc(x.title||'Untitled property')}</b><div class="muted">${esc(x.city||'')} · ${esc(x.district||'')} · ${esc(x.state||'')}</div><div style="margin-top:7px"><span class="badge">${esc(x.property_type||'Property')}</span> <span class="badge ${esc(x.approval_status||'pending')}">${esc(x.approval_status||'pending')}</span></div></div><b>${money(x.price)}</b></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px"><button class="btn ok" onclick="approval('${x.id}','approved')">Approve</button><button class="btn ghost" onclick="approval('${x.id}','rejected')">Reject</button><button class="btn danger" onclick="del('${x.id}')">Delete</button><a class="btn ghost" href="/property/${encodeURIComponent(x.id)}">View</a></div></div>`}function render(){let c=$('app');if(current==='overview'){c.innerHTML=`<section class="grid"><div class="stat"><div class="muted">Total listings</div><div class="num">${data.listings.length}</div></div><div class="stat"><div class="muted">Pending review</div><div class="num">${data.listings.filter(x=>x.approval_status==='pending').length}</div></div><div class="stat"><div class="muted">Users</div><div class="num">${data.users.length}</div></div><div class="stat"><div class="muted">Inquiries</div><div class="num">${data.inquiries.length}</div></div></section><section class="panel"><div class="head"><h2>Recent listings</h2><button class="btn ghost" onclick="tab('listings')">Manage</button></div><div class="list">${data.listings.slice(0,8).map(listing).join('')||'<div class="muted">No listings.</div>'}</div></section>`}else if(current==='listings'){c.innerHTML=`<section class="panel"><div class="head"><h2>Property moderation</h2><button class="btn ghost" onclick="load()">Refresh</button></div><div class="filters"><input id="q" class="input" placeholder="Search title/city/locality" oninput="filter()"><select id="s" class="input" onchange="filter()"><option value="">All statuses</option><option>pending</option><option>approved</option><option>rejected</option></select><select id="t" class="input" onchange="filter()"><option value="">All types</option><option>Apartment</option><option>Flat</option><option>House</option><option>Villa</option><option>Plot / Land</option><option>Commercial</option><option>Office</option><option>Shop</option><option>Building</option></select><button class="btn" onclick="filter()">Filter</button></div><div id="ll" class="list">${data.listings.map(listing).join('')||'<div class="muted">No listings.</div>'}</div></section>`}else if(current==='users'){c.innerHTML=`<section class="panel"><div class="head"><h2>User management</h2><button class="btn ghost" onclick="load()">Refresh</button></div><div class="list">${data.users.map(x=>`<div class="row"><div class="rowmain"><div><b>${esc(x.full_name||'Unnamed')}</b><div class="muted">${esc(x.email||'')} · ${esc(x.role||'buyer')}</div></div><span class="badge ${x.is_banned?'rejected':'approved'}">${x.is_banned?'BANNED':'ACTIVE'}</span></div><div style="margin-top:10px"><button class="btn ${x.is_banned?'ok':'danger'}" onclick="ban('${x.id}',${!x.is_banned})">${x.is_banned?'Unban':'Ban user'}</button></div></div>`).join('')||'<div class="muted">No users.</div>'}</div></section>`}else{c.innerHTML=`<section class="panel"><div class="head"><h2>Inquiries</h2><button class="btn ghost" onclick="load()">Refresh</button></div><div class="list">${data.inquiries.map(x=>`<div class="row"><b>${esc(x.buyer_email||'Buyer')}</b><div class="muted">${esc(x.buyer_phone||'')} · ${esc(x.status||'new')}</div><p>${esc(x.message||'')}</p></div>`).join('')||'<div class="muted">No inquiries.</div>'}</div></section>`}}function filter(){const q=($('q')?.value||'').toLowerCase(),s=$('s')?.value||'',t=$('t')?.value||'';const a=data.listings.filter(x=>(!q||[x.title,x.city,x.locality,x.district,x.state].join(' ').toLowerCase().includes(q))&&(!s||x.approval_status===s)&&(!t||x.property_type===t));$('ll').innerHTML=a.map(listing).join('')||'<div class="muted">No matching listings.</div>'}async function approval(id,status){try{await api('approval',{id,status});toast('Listing updated');await load()}catch(e){toast(e.message)}}async function del(id){if(!confirm('Delete this property permanently?'))return;try{await api('delete_listing',{id});toast('Listing deleted');await load()}catch(e){toast(e.message)}}async function ban(id,banned){try{await api('ban_user',{id,banned});toast(banned?'User banned':'User unbanned');await load()}catch(e){toast(e.message)}}async function logout(){try{await api('logout')}catch{}sessionStorage.removeItem('estatenova_admin_session');location.href='/admin'}if(!token())location.href='/admin';else load();</script></body></html>
