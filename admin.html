<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EstateNova Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050816;--panel:#0b1530;--panel2:#101d3e;--line:#26375f;--text:#f5f7ff;--muted:#91a0bf;--accent:#6d4aff;--accent2:#2563eb;--danger:#d34b68;--ok:#35c98b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#172b61,transparent 32%),radial-gradient(circle at 90% 0,#3c155c,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}button,input,select{font:inherit}.hidden{display:none!important}.shell{max-width:1250px;margin:auto;padding:24px}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(470px,100%);background:#0b1530ee;border:1px solid #ffffff1b;border-radius:28px;padding:30px;box-shadow:0 25px 80px #0008}.brand{font-size:28px;font-weight:950;letter-spacing:-1px}.grad{background:linear-gradient(90deg,#60a5fa,#a78bfa,#f0abfc);-webkit-background-clip:text;color:transparent}.eyebrow{font-size:11px;letter-spacing:3px;color:#8fa1c7;margin-top:5px}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:18px 0 8px}.input{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:#07112a;color:#fff;outline:0}.input:focus{border-color:#7887ff;box-shadow:0 0 0 3px #6d4aff22}.input[readonly]{opacity:.85}.btn{border:0;border-radius:13px;padding:13px 17px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:850;cursor:pointer}.btn.ghost{background:#ffffff0b;border:1px solid #ffffff18}.btn.danger{background:#8f2947}.btn.ok{background:#16805d}.full{width:100%;margin-top:18px}.error{margin-top:14px;padding:12px;border-radius:12px;background:#7e23401c;border:1px solid #c33f612f;color:#ff9eb3}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:8px 0 24px}.top-actions{display:flex;gap:8px;align-items:center}.user-chip{padding:9px 12px;border:1px solid #ffffff14;background:#ffffff08;border-radius:12px;color:#c8d3ea;font-size:12px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:18px}.nav button{white-space:nowrap;border:1px solid #ffffff12;background:#ffffff07;color:#b9c6df;padding:10px 14px;border-radius:12px;cursor:pointer}.nav button.active{background:#6d4aff22;color:#fff;border-color:#6d4aff66}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#0b1530dd;border:1px solid #ffffff12;border-radius:18px;padding:18px}.stat .n{font-size:28px;font-weight:950;margin-top:6px}.content{margin-top:18px}.section{background:#0b1530dd;border:1px solid #ffffff12;border-radius:20px;padding:20px;margin-bottom:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section h2{font-size:20px;margin:0}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:15px}.list{display:grid;gap:10px}.row{background:#101d3e;border:1px solid #ffffff10;border-radius:15px;padding:15px}.row-main{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.row h3{margin:0 0 5px;font-size:16px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;background:#ffffff0c;color:#c7d3ec}.badge.pending{color:#ffd48a;background:#9d6a101c}.badge.approved{color:#7de4b7;background:#16805d20}.badge.rejected{color:#ff9caf;background:#9d23401f}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions .btn{padding:9px 12px;font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#111e3e;border:1px solid #ffffff20;border-radius:12px;padding:12px 16px;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.shell{padding:15px}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.row-main{flex-direction:column}.login-card{padding:22px}}
</style>
</head>
<body>
<div id="loginView" class="login"><div class="login-card">
  <div class="brand">Estate<span class="grad">Nova</span></div><div class="eyebrow">PRIVATE ADMIN CONSOLE</div>
  <h1>Admin sign in</h1><p class="muted">Only the EstateNova administrator account can access this dashboard.</p>
  <label for="email">Admin email</label><input id="email" class="input" value="satyanshraj774@gmail.com" readonly>
  <label for="password">Password</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Enter admin password">
  <button id="loginBtn" class="btn full">Sign in to dashboard</button><div id="loginError" class="error hidden"></div>
</div></div>

<div id="appView" class="hidden"><div class="shell">
  <header class="top"><div><div class="brand">Estate<span class="grad">Nova</span></div><div class="eyebrow">ADMIN DASHBOARD</div></div><div class="top-actions"><div id="userChip" class="user-chip"></div><button id="logoutBtn" class="btn ghost">Sign out</button></div></header>
  <nav class="nav"><button data-tab="overview" class="active">Overview</button><button data-tab="listings">Listings</button><button data-tab="users">Users</button><button data-tab="inquiries">Inquiries</button><a class="btn ghost" href="/" style="text-decoration:none">Open site</a></nav>
  <main id="content" class="content"></main>
</div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://bttujypzchanhvdmqutv.supabase.co';
const SUPABASE_KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0';
const ADMIN_EMAIL='satyanshraj774@gmail.com';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n)>=1e7?'₹'+(Number(n)/1e7).toFixed(2)+' Cr':Number(n)>=1e5?'₹'+(Number(n)/1e5).toFixed(1)+' L':'₹'+Number(n||0).toLocaleString('en-IN');
let tab='overview',cache={listings:[],users:[],inquiries:[]};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function showLoginError(t){$('loginError').textContent=t;$('loginError').classList.remove('hidden')}
async function ensureAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;if((user.email||'').toLowerCase()!==ADMIN_EMAIL)return false;const a=await sb.rpc('is_admin');return !a.error&&a.data===true}
async function login(){ $('loginError').classList.add('hidden'); const email=ADMIN_EMAIL,password=$('password').value; if(!password){showLoginError('Enter the admin password.');return} $('loginBtn').disabled=true;$('loginBtn').textContent='Signing in…'; const {error}=await sb.auth.signInWithPassword({email,password}); if(error){showLoginError('Invalid admin credentials.');$('loginBtn').disabled=false;$('loginBtn').textContent='Sign in to dashboard';return} if(!(await ensureAdmin())){await sb.auth.signOut();showLoginError('This account is not authorized for the admin dashboard.');$('loginBtn').disabled=false;$('loginBtn').textContent='Sign in to dashboard';return} await enterApp() }
async function enterApp(){const {data:{user}}=await sb.auth.getUser();if(!user){$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');return} $('userChip').textContent=user.email||ADMIN_EMAIL;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await loadAll();render()}
async function boot(){if(await ensureAdmin()) await enterApp();else{await sb.auth.signOut();$('loginView').classList.remove('hidden');$('appView').classList.add('hidden')}}
async function loadAll(){const [l,u,i]=await Promise.all([sb.from('listings').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('*').order('created_at',{ascending:false}),sb.from('inquiries').select('*').order('created_at',{ascending:false})]);cache.listings=l.data||[];cache.users=u.data||[];cache.inquiries=i.data||[]}
function overview(){const ls=cache.listings,us=cache.users,iq=cache.inquiries;return `<div class="grid"><div class="stat"><div class="muted">Total listings</div><div class="n">${ls.length}</div></div><div class="stat"><div class="muted">Pending review</div><div class="n">${ls.filter(x=>x.approval_status==='pending').length}</div></div><div class="stat"><div class="muted">Total users</div><div class="n">${us.length}</div></div><div class="stat"><div class="muted">Inquiries</div><div class="n">${iq.length}</div></div></div><div class="section" style="margin-top:16px"><div class="section-head"><h2>Recent listings</h2><button class="btn ghost" onclick="switchTab('listings')">Manage listings</button></div><div class="list">${ls.slice(0,6).map(listingRow).join('')||'<div class="empty">No listings yet.</div>'}</div></div>`}
function listingRow(x){return `<div class="row"><div class="row-main"><div><h3>${esc(x.title||'Untitled property')}</h3><div class="muted">${esc(x.locality||x.city||'')} · ${esc(x.district||'')} · ${esc(x.state||'')}</div><div style="margin-top:8px"><span class="badge">${esc(x.property_type||'Property')}</span> <span class="badge">${esc(x.listing_type||'sale')}</span> <span class="badge ${esc(x.approval_status||'pending')}">${esc(x.approval_status||'pending')}</span></div></div><strong>${money(x.price)}</strong></div><div class="actions"><button class="btn ok" onclick="setApproval('${x.id}','approved')">Approve</button><button class="btn ghost" onclick="setApproval('${x.id}','rejected')">Reject</button><button class="btn danger" onclick="deleteListing('${x.id}')">Delete</button><a class="btn ghost" href="/property/${encodeURIComponent(x.id)}" style="text-decoration:none">View</a></div></div>`}
function listings(){return `<div class="section"><div class="section-head"><h2>Property moderation</h2><button class="btn ghost" onclick="loadAll().then(render)">Refresh</button></div><div class="filters"><input id="lf" class="input" placeholder="Search title, city, locality…" oninput="filterListings()"><select id="ls" class="input" onchange="filterListings()"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><select id="lt" class="input" onchange="filterListings()"><option value="">All types</option><option>Apartment</option><option>Flat</option><option>House</option><option>Villa</option><option>Plot / Land</option><option>Commercial</option><option>Office</option><option>Shop</option><option>Building</option></select><button class="btn" onclick="filterListings()">Filter</button></div><div id="listingList" class="list">${cache.listings.map(listingRow).join('')||'<div class="empty">No listings.</div>'}</div></div>`}
function filterListings(){const q=($('lf')?.value||'').toLowerCase(),s=$('ls')?.value||'',t=$('lt')?.value||'';const arr=cache.listings.filter(x=>(!q||[x.title,x.city,x.locality,x.district,x.state].join(' ').toLowerCase().includes(q))&&(!s||x.approval_status===s)&&(!t||x.property_type===t));$('listingList').innerHTML=arr.map(listingRow).join('')||'<div class="empty">No matching listings.</div>'}
function users(){return `<div class="section"><div class="section-head"><h2>Users</h2><button class="btn ghost" onclick="loadAll().then(render)">Refresh</button></div><div class="list">${cache.users.map(x=>`<div class="row"><div class="row-main"><div><h3>${esc(x.full_name||'Unnamed user')}</h3><div class="muted">${esc(x.email||'')} · ${esc(x.role||'buyer')}</div></div><span class="badge ${x.is_banned?'rejected':'approved'}">${x.is_banned?'BANNED':'ACTIVE'}</span></div><div class="actions"><button class="btn ${x.is_banned?'ok':'danger'}" onclick="banUser('${x.id}',${!x.is_banned})">${x.is_banned?'Unban':'Ban user'}</button></div></div>`).join('')||'<div class="empty">No users.</div>'}</div>`}
function inquiries(){return `<div class="section"><div class="section-head"><h2>Inquiries</h2><button class="btn ghost" onclick="loadAll().then(render)">Refresh</button></div><div class="list">${cache.inquiries.map(x=>`<div class="row"><div class="row-main"><div><h3>${esc(x.buyer_email||'Buyer inquiry')}</h3><div class="muted">${esc(x.buyer_phone||'No phone')} · ${esc(x.status||'new')}</div><p>${esc(x.message||'')}</p></div><span class="badge">${new Date(x.created_at).toLocaleString('en-IN')}</span></div></div>`).join('')||'<div class="empty">No inquiries.</div>'}</div>`}
function render(){const c=$('content');c.innerHTML=tab==='overview'?overview():tab==='listings'?listings():tab==='users'?users():inquiries();document.querySelectorAll('.nav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function switchTab(t){tab=t;render()}
async function setApproval(id,status){const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('listings').update({approval_status:status,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id);if(error){toast('Could not update listing');return}toast(status==='approved'?'Listing approved':'Listing rejected');await loadAll();render()}
async function deleteListing(id){if(!confirm('Delete this property permanently?'))return;const {error}=await sb.from('listings').delete().eq('id',id);if(error){toast('Delete failed');return}toast('Listing deleted');await loadAll();render()}
async function banUser(id,value){const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('profiles').update({is_banned:value,banned_at:value?new Date().toISOString():null,banned_by:value?user.id:null}).eq('id',id);if(error){toast('User update failed');return}toast(value?'User banned':'User unbanned');await loadAll();render()}
$('loginBtn').onclick=login;$('password').onkeydown=e=>e.key==='Enter'&&login();$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll('.nav button[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));boot();
</script>
</body></html>
