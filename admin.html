<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#050816;color:#eef2ff;font-family:Inter,system-ui;padding:30px}.wrap{max-width:1100px;margin:auto}.card{background:#0c1530;border:1px solid #ffffff18;border-radius:18px;padding:20px;margin:12px 0}button{border:0;border-radius:10px;padding:10px 14px;color:white;background:#6d4aff;margin:4px;cursor:pointer}.danger{background:#a83252}.muted{color:#94a3c2}</style></head><body><div class="wrap"><h1>EstateNova Admin</h1><p class="muted">Private moderation console. Authorization is enforced by Supabase RLS.</p><div id="status" class="card">Checking admin access…</div><div id="stats"></div><div id="pending"></div><div id="users"></div></div><script>const sb=supabase.createClient('https://bttujypzchanhvdmqutv.supabase.co','sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0');const s=document.getElementById('status');async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){s.innerHTML='<b>Sign in required.</b>';return}const a=await sb.rpc('is_admin');if(a.error||!a.data){s.innerHTML='<b>Access denied.</b>';return}s.innerHTML='<b>Admin access granted.</b>';load()}async function load(){const [l,u]=await Promise.all([sb.from('listings').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('*').order('created_at',{ascending:false})]);const ls=l.data||[],us=u.data||[];stats.innerHTML=`<div class="card"><b>Total users:</b> ${us.length} &nbsp; <b>Total listings:</b> ${ls.length} &nbsp; <b>Pending:</b> ${ls.filter(x=>x.approval_status==='pending').length}</div>`;pending.innerHTML='<h2>Listings</h2>'+ls.map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="muted">${esc(x.state||'')} · ${esc(x.district||'')} · ${x.approval_status}</div><button onclick="approve('${x.id}')">Approve</button><button class="danger" onclick="reject('${x.id}')">Reject</button><button class="danger" onclick="del('${x.id}')">Delete</button></div>`).join('')||'<div class="card">No listings.</div>';users.innerHTML='<h2>Users</h2>'+us.map(x=>`<div class="card"><b>${esc(x.full_name||x.email||'User')}</b><div class="muted">${esc(x.email||'')} · ${esc(x.role||'')} · ${x.is_banned?'BANNED':'active'}</div><button onclick="ban('${x.id}',${!x.is_banned})">${x.is_banned?'Unban':'Ban'}</button></div>`).join('')}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function approve(id){await sb.from('listings').update({approval_status:'approved',reviewed_at:new Date().toISOString()}).eq('id',id);load()}async function reject(id){await sb.from('listings').update({approval_status:'rejected',reviewed_at:new Date().toISOString()}).eq('id',id);load()}async function del(id){if(confirm('Delete this property?')){await sb.from('listings').delete().eq('id',id);load()}}async function ban(id,v){await sb.from('profiles').update({is_banned:v,banned_at:v?new Date().toISOString():null}).eq('id',id);load()}boot()</script></body></html>
