<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>EstateNova Admin — Inquiries</title><style>*{box-sizing:border-box}body{margin:0;background:#050816;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.eyebrow,.muted{color:#93a4c7}.eyebrow{font-size:10px;letter-spacing:3px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#6d4aff;color:#fff;font-weight:800;cursor:pointer}.tools{margin:18px 0;display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:13px;border-radius:12px;background:#07112a;border:1px solid #26375f;color:#fff;font:inherit}.filter{padding:10px 14px;border-radius:12px;background:#07112a;border:1px solid #26375f;color:#c9d3eb;font-weight:800;cursor:pointer}.filter.active{background:#6d4aff;color:#fff}.item{margin:14px 0;background:#0b1530;border:1px solid #ffffff15;border-radius:20px;padding:20px}.head{display:flex;justify-content:space-between;gap:10px}.title{font-size:20px;font-weight:850}.badge{padding:4px 9px;border-radius:99px;background:#17264a;color:#c9d3eb;font-size:11px}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}.kv{padding:11px;border-radius:10px;background:#07112a}.k{font-size:11px;color:#7182a8;text-transform:uppercase}.v{margin-top:3px;word-break:break-word}.message{margin-top:14px;padding:15px;border-radius:12px;background:#111d3c;line-height:1.55;white-space:pre-wrap}.meta{margin-top:12px;color:#93a4c7;font-size:12px}@media(max-width:650px){.details{grid-template-columns:1fr}.wrap{padding:16px}.head{display:block}.head .badge{display:inline-block;margin-top:8px}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">ESTATENOVA CONTROL CENTER</div><h1>Property Inquiries</h1><div class="muted" id="summary">Loading…</div></div><button class="btn" onclick="location.href='/admin-dashboard'">← Dashboard</button></div><div class="tools"><input id="q" class="search" placeholder="Search buyer, seller, email, phone, property, city or message…"><button class="filter active" data-status="all">All</button><button class="filter" data-status="new">New</button><button class="filter" data-status="contacted">Contacted</button><button class="filter" data-status="closed">Closed</button></div><div id="list">Loading inquiries…</div></div><script>'use strict';const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console',token=sessionStorage.getItem('estatenova_admin_session');let inquiries=[],users=[],listings=[],status='all';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=v=>v===null||v===undefined||v===''?'—':String(v);async function api(a,x={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token||''},cache:'no-store',body:JSON.stringify({action:a,...x})});if(r.status===401){sessionStorage.removeItem('estatenova_admin_session');location.href='/admin';throw Error('Session expired.')}if(!r.ok)throw Error('Admin service error');return r.json()}function render(){const q=$('q').value.trim().toLowerCase();const ub=id=>users.find(u=>String(u.id)===String(id)),lb=id=>listings.find(l=>String(l.id)===String(id));const a=inquiries.filter(x=>{const b=ub(x.buyer_id),s=ub(x.seller_id),l=lb(x.listing_id);const text=[x.message,x.buyer_email,x.buyer_phone,x.status,b?.full_name,b?.email,b?.phone,s?.full_name,s?.email,s?.phone,l?.title,l?.city,l?.locality].map(v=>String(v||'').toLowerCase()).join(' ');return(status==='all'||String(x.status||'new').toLowerCase()===status)&&(!q||text.includes(q))});$('summary').textContent=inquiries.length+' inquiries · '+a.length+' shown';$('list').innerHTML=a.length?a.map(x=>{const b=ub(x.buyer_id),s=ub(x.seller_id),l=lb(x.listing_id);const fields=[['Inquiry ID',x.id],['Status',x.status||'new'],['Buyer name',b?.full_name],['Buyer email',x.buyer_email||b?.email],['Buyer phone',x.buyer_phone||b?.phone],['Buyer ID',x.buyer_id],['Seller name',s?.full_name],['Seller email',s?.email],['Seller phone',s?.phone],['Seller ID',x.seller_id],['Property',l?.title],['Property type',l?.property_type],['Property city',l?.city],['Property locality',l?.locality],['Listing ID',x.listing_id]];return '<article class="item"><div class="head"><div class="title">'+esc(l?.title||'Property inquiry')+'</div><span class="badge">'+esc(x.status||'new')+'</span></div><div class="details">'+fields.map(f=>'<div class="kv"><div class="k">'+esc(f[0])+'</div><div class="v">'+esc(val(f[1]))+'</div></div>').join('')+'</div><div class="message"><b>Message from buyer</b><br>'+esc(x.message||'No message provided.')+'</div><div class="meta">Inquiry created: '+esc(x.created_at?new Date(x.created_at).toLocaleString():'—')+'</div></article>'}).join(''):'<p class="muted">No inquiries match the selected filter.</p>'}async function load(){if(!token){location.href='/admin';return}try{const d=await api('overview');inquiries=Array.isArray(d.inquiries)?d.inquiries:[];users=Array.isArray(d.users)?d.users:[];listings=Array.isArray(d.listings)?d.listings:[];render()}catch(e){$('list').textContent=e.message}}document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{status=b.dataset.status;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));$('q').addEventListener('input',render);load();</script></body></html>
