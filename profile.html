<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova — My Profile</title><style>:root{--bg:#050816;--text:#f5f7ff;--muted:#9ba9c5;--blue:#2563eb;--violet:#7c3aed;--line:#25365f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#17316d,transparent 34%),radial-gradient(circle at 90% 0,#40156d,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}.wrap{max-width:1000px;margin:auto;padding:0 20px}.nav{position:sticky;top:0;z-index:20;background:#050816e8;backdrop-filter:blur(20px);border-bottom:1px solid #fff1}.navin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900;color:#fff;text-decoration:none}.g{background:linear-gradient(90deg,#60a5fa,#a78bfa,#e9d5ff);-webkit-background-clip:text;color:transparent}.navlinks{display:flex;gap:10px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));font-weight:800;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.55;cursor:not-allowed}.ghost{background:#ffffff0d;border:1px solid #ffffff18}.panel{margin:38px 0;background:#08132cdd;border:1px solid #ffffff18;border-radius:24px;padding:28px}.profilehead{display:flex;align-items:center;gap:18px;margin-bottom:28px}.avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:28px;font-weight:950;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.label{font-size:12px;color:#8495b8;text-transform:uppercase;letter-spacing:.7px}.input{width:100%;padding:13px;background:#07122a;border:1px solid var(--line);color:#fff;border-radius:11px;outline:0}.input:focus{border-color:#6d7efc;box-shadow:0 0 0 3px #5865f233}.readonly{opacity:.7}.info{min-height:47px;padding:13px;background:#07122a;border:1px solid var(--line);border-radius:11px;display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.photoRow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.photoPreview{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#07122a;border:1px solid var(--line)}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.message{min-height:22px;margin-top:12px}.ok{color:#86efac}.error{color:#fca5a5}.section{margin-top:30px;padding-top:25px;border-top:1px solid #ffffff12}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{padding:16px;border:1px solid #ffffff12;border-radius:15px;background:#07122a}.count{font-size:25px;font-weight:950}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.field.full{grid-column:auto}.navlinks .optional{display:none}}</style></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Estate<span class="g">Nova</span></a><div class="navlinks"><a class="btn ghost optional" href="/properties">Browse</a><button id="logout" class="btn ghost" type="button">Sign out</button></div></div></header><main class="wrap"><section class="panel"><div class="profilehead"><div id="avatar" class="avatar">?</div><div><h1 style="margin:0 0 5px">My Profile</h1><div id="emailHead" class="muted">Loading account…</div></div></div><div class="grid"><div class="field"><label class="label">Full name</label><input id="fullName" class="input" placeholder="Your name" autocomplete="name"></div><div class="field"><label class="label">Phone</label><input id="phone" class="input" type="tel" placeholder="Phone number" autocomplete="tel"></div><div class="field"><label class="label">Email</label><div id="email" class="info">Loading…</div></div><div class="field"><label class="label">Account type</label><div id="role" class="info">Loading…</div></div><div class="field"><label class="label">Profile ID</label><div id="profileId" class="info" title="Profile ID">Loading…</div></div><div class="field"><label class="label">Company name</label><input id="companyName" class="input" placeholder="Company / agency (optional)"></div><div class="field full"><label class="label">Profile photo</label><div class="photoRow"><img id="photoPreview" class="photoPreview" alt="Profile photo"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div></div><div class="field full"><label class="label">Bio</label><textarea id="bio" class="input" rows="4" placeholder="Tell people a little about yourself"></textarea></div></div><div id="message" class="message"></div><div class="actions"><button id="save" class="btn" type="button">Save changes</button><a class="btn ghost" href="/">Back to home</a></div><div class="section"><h2>My EstateNova activity</h2><div class="cards"><div class="mini"><div class="muted">My listings</div><div id="listingCount" class="count">—</div></div><div class="mini"><div class="muted">My inquiries</div><div id="inquiryCount" class="count">—</div></div><div class="mini"><div class="muted">Member since</div><div id="memberSince" class="count" style="font-size:18px">—</div></div></div></div></section></main><script>const API='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0';const $=id=>document.getElementById(id);const fields={fullName:$('fullName'),phone:$('phone'),email:$('email'),role:$('role'),profileId:$('profileId'),companyName:$('companyName'),bio:$('bio'),photo:$('photo'),photoPreview:$('photoPreview'),avatar:$('avatar'),emailHead:$('emailHead'),message:$('message'),save:$('save')};function clearAuth(){['en_access_token','en_refresh_token','en_user_id','en_email'].forEach(k=>localStorage.removeItem(k));location.href='/auth'}async function refresh(){const rt=localStorage.getItem('en_refresh_token');if(!rt)return null;const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});if(!r.ok){clearAuth();return null}const d=await r.json();localStorage.setItem('en_access_token',d.access_token);if(d.refresh_token)localStorage.setItem('en_refresh_token',d.refresh_token);if(d.user?.id)localStorage.setItem('en_user_id',d.user.id);if(d.user?.email)localStorage.setItem('en_email',d.user.email);return d.access_token}async function getToken(){let t=localStorage.getItem('en_access_token');if(!t)return null;let r=await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t}});if(r.ok)return t;return refresh()}async function api(path,opts={}){let t=await getToken();if(!t)throw Error('Please sign in again.');const headers={apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opts.headers||{})};let r=await fetch(API+path,{...opts,headers});if(r.status===401){t=await refresh();if(!t)throw Error('Session expired. Please sign in again.');headers.Authorization='Bearer '+t;r=await fetch(API+path,{...opts,headers})}return r}async function uploadImage(file,uid){if(!file)return null;if(file.size>8*1024*1024)throw Error('Profile photo must be smaller than 8 MB.');if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw Error('Please choose a JPG, PNG, WEBP or GIF image.');const token=await getToken();const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path='profiles/'+uid+'/'+Date.now()+'.'+ext;const r=await fetch(API+'/storage/v1/object/property-images/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':file.type,x-upsert:'true'},body:file});if(!r.ok)throw Error('Profile photo upload failed.');return API+'/storage/v1/object/public/property-images/'+path}async function load(){const t=await getToken();if(!t){location.href='/auth?next='+encodeURIComponent('/profile');return}const uid=localStorage.getItem('en_user_id');if(!uid)throw Error('Account session is incomplete. Please sign in again.');const r=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(uid)+'&select=*');const d=await r.json();if(!r.ok)throw Error('Unable to load profile.');let p=d[0];if(!p){const u=await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t}}).then(x=>x.json());const create=await api('/rest/v1/profiles',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({id:uid,email:u.email||localStorage.getItem('en_email'),full_name:null,role:'buyer'})});const cd=await create.json();if(!create.ok||!cd[0])throw Error('Profile could not be created.');p=cd[0]}fields.fullName.value=p.full_name||'';fields.phone.value=p.phone||'';fields.email.textContent=p.email||localStorage.getItem('en_email')||'—';fields.role.textContent=p.role||'buyer';fields.profileId.textContent=p.id||uid;fields.profileId.title=p.id||uid;fields.companyName.value=p.company_name||'';fields.bio.value=p.bio||'';fields.emailHead.textContent=p.email||localStorage.getItem('en_email')||'';fields.avatar.innerHTML='';if(p.avatar_url){const im=new Image();im.src=p.avatar_url;im.alt='Profile photo';fields.avatar.appendChild(im);fields.photoPreview.src=p.avatar_url}else{fields.avatar.textContent=(p.full_name||p.email||'?').trim().charAt(0).toUpperCase();fields.photoPreview.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2276%22 height=%2276%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%2307122a%22/%3E%3Ctext x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 fill=%22%23aebbd5%22 font-size=%2228%22%3E%3F%3C/text%3E%3C/svg%3E'}fields.memberSince.textContent=p.created_at?new Date(p.created_at).toLocaleDateString('en-IN',{month:'short',year:'numeric'}):'—';const l=await api('/rest/v1/listings?owner_id=eq.'+encodeURIComponent(uid)+'&select=id');const li=await l.json();$('listingCount').textContent=Array.isArray(li)?li.length:'0';const iq=await api('/rest/v1/inquiries?or=(buyer_id.eq.'+encodeURIComponent(uid)+',seller_id.eq.'+encodeURIComponent(uid)+')&select=id');const ii=await iq.json();$('inquiryCount').textContent=Array.isArray(ii)?ii.length:'0'}fields.photo.onchange=()=>{const f=fields.photo.files[0];if(f){fields.photoPreview.src=URL.createObjectURL(f)}};fields.save.onclick=async()=>{fields.save.disabled=true;fields.message.className='message';fields.message.textContent='Saving…';try{const uid=localStorage.getItem('en_user_id');if(!uid)throw Error('Please sign in again.');let avatarUrl=null;if(fields.photo.files[0])avatarUrl=await uploadImage(fields.photo.files[0],uid);const payload={full_name:fields.fullName.value.trim()||null,phone:fields.phone.value.trim()||null,company_name:fields.companyName.value.trim()||null,bio:fields.bio.value.trim()||null};if(avatarUrl)payload.avatar_url=avatarUrl;let r=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(uid),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>[]);if(!r.ok||!Array.isArray(d)||!d[0])throw Error('Profile changes could not be saved.');fields.message.className='message ok';fields.message.textContent='Profile updated successfully.';fields.emailHead.textContent=fields.email.textContent;fields.avatar.innerHTML='';if(avatarUrl){const im=new Image();im.src=avatarUrl;im.alt='Profile photo';fields.avatar.appendChild(im)}else{fields.avatar.textContent=(fields.fullName.value||fields.email.textContent||'?').trim().charAt(0).toUpperCase()}fields.photo.value=''}catch(e){fields.message.className='message error';fields.message.textContent=e.message||'Unable to save profile.'}finally{fields.save.disabled=false}};$('logout').onclick=clearAuth;load().catch(e=>{fields.message.className='message error';fields.message.textContent=e.message||'Unable to load profile.'});</script></body></html>
