<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Manage your EstateNova profile."><title>EstateNova — My Profile</title><link rel="stylesheet" href="/site.css"></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Estate<span class="g">Nova</span></a><div class="navlinks"><a class="btn ghost optional" href="/properties">Browse</a><button id="logout" class="btn ghost" type="button">Sign out</button></div></div></header><main class="wrap"><section class="panel en-reveal" style="margin:38px 0;padding:30px"><div class="profilehead"><div id="avatar" class="avatar">?</div><div style="min-width:0"><div class="tag">ACCOUNT</div><h1 style="margin:8px 0 5px">My Profile</h1><div id="emailHead" class="muted">Loading account…</div></div></div><div class="grid"><div class="field"><label class="label" for="fullName">Full name</label><input id="fullName" class="input" placeholder="Your name" autocomplete="name"></div><div class="field"><label class="label" for="phone">Phone</label><input id="phone" class="input" type="tel" placeholder="Phone number" autocomplete="tel"></div><div class="field"><label class="label">Email</label><div id="email" class="info">Loading…</div></div><div class="field"><label class="label">Account type</label><div id="role" class="info">Loading…</div></div><div class="field"><label class="label">Profile ID</label><div class="info" style="gap:8px"><span id="profileId" style="overflow:hidden;text-overflow:ellipsis">Loading…</span><button id="copyId" class="btn ghost" type="button" style="padding:7px 10px;margin-left:auto">Copy</button></div></div><div class="field"><label class="label">Member since</label><div id="memberSince" class="info">Loading…</div></div><div class="field full"><label class="label" for="companyName">Company name</label><input id="companyName" class="input" placeholder="Company / agency (optional)" autocomplete="organization"></div><div class="field full"><label class="label">Profile photo</label><div class="en-drop"><strong>Choose a profile photo</strong><div class="muted" style="font-size:13px;margin:5px 0 12px">JPG, PNG, WEBP or GIF · maximum 8 MB</div><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" style="max-width:100%"><div style="margin-top:12px"><img id="photoPreview" class="photoPreview" alt="Profile photo preview" style="display:none"></div></div></div><div class="field full"><label class="label" for="bio">Bio</label><textarea id="bio" class="input" rows="5" maxlength="1000" placeholder="Tell people a little about yourself"></textarea><small id="bioCount" class="muted" style="text-align:right">0 / 1000</small></div></div><div id="message" class="message" aria-live="polite"></div><div class="actions"><button id="save" class="btn" type="button">Save changes</button><button id="reload" class="btn ghost" type="button">Reload profile</button><a class="btn ghost" href="/">Back to home</a></div><div class="section"><h2>My EstateNova activity</h2><div class="cards"><div class="mini"><div class="muted">My listings</div><div id="listingCount" class="count">—</div></div><div class="mini"><div class="muted">My inquiries</div><div id="inquiryCount" class="count">—</div></div><div class="mini"><div class="muted">Member since</div><div id="memberSince2" class="count" style="font-size:18px">—</div></div></div></div></section></main><script>const API='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0';const $=id=>document.getElementById(id),ui={fullName:$('fullName'),phone:$('phone'),email:$('email'),role:$('role'),profileId:$('profileId'),memberSince:$('memberSince'),memberSince2:$('memberSince2'),companyName:$('companyName'),bio:$('bio'),photo:$('photo'),photoPreview:$('photoPreview'),avatar:$('avatar'),emailHead:$('emailHead'),message:$('message'),save:$('save')};function clearAuth(){['en_access_token','en_refresh_token','en_user_id','en_email'].forEach(k=>localStorage.removeItem(k));location.href='/auth?next='+encodeURIComponent('/profile')}function timeout(ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return{signal:c.signal,done:()=>clearTimeout(t)}}async function refresh(){const rt=localStorage.getItem('en_refresh_token');if(!rt)return null;const z=timeout(12000);try{const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt}),signal:z.signal});if(!r.ok)return null;const d=await r.json();localStorage.setItem('en_access_token',d.access_token||'');if(d.refresh_token)localStorage.setItem('en_refresh_token',d.refresh_token);if(d.user?.id)localStorage.setItem('en_user_id',d.user.id);if(d.user?.email)localStorage.setItem('en_email',d.user.email);return d.access_token||null}catch{return null}finally{z.done()}}async function getToken(){let t=localStorage.getItem('en_access_token');if(!t)return await refresh();let z=timeout(10000);try{const r=await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t},signal:z.signal});if(r.ok)return t}catch{}finally{z.done()}return await refresh()}async function api(path,opts={}){let t=await getToken();if(!t)throw Error('Your session has expired. Please sign in again.');const base={apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'};let z=timeout(15000);try{let r=await fetch(API+path,{...opts,headers:{...base,...(opts.headers||{})},signal:z.signal});if(r.status===401){t=await refresh();if(!t)throw Error('Your session has expired. Please sign in again.');r=await fetch(API+path,{...opts,headers:{...base,Authorization:'Bearer '+t,...(opts.headers||{})},signal:z.signal})}return r}catch(e){if(e.name==='AbortError')throw Error('The server took too long to respond. Please check your connection and try again.');throw e}finally{z.done()}}function message(text,type=''){ui.message.className='message '+(type==='ok'?'ok':type==='error'?'error':'');ui.message.textContent=text}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){message('Loading your profile…');ui.save.disabled=true;try{const t=await getToken();if(!t){clearAuth();return}const uid=localStorage.getItem('en_user_id');if(!uid)throw Error('Account ID is missing. Please sign in again.');const uRes=await api('/auth/v1/user');const user=await uRes.json().catch(()=>({}));if(!uRes.ok)throw Error('Unable to verify your account.');const id=user.id||uid,email=user.email||localStorage.getItem('en_email')||'';localStorage.setItem('en_user_id',id);localStorage.setItem('en_email',email);ui.email.textContent=email||'—';ui.emailHead.textContent=email;ui.profileId.textContent=id;let r=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(id)+'&select=*');let d=await r.json().catch(()=>[]);if(!r.ok)throw Error('Profile data could not be loaded.');let p=d[0];if(!p){r=await api('/rest/v1/profiles',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({id,email,role:'buyer'})});d=await r.json().catch(()=>[]);if(!r.ok||!d[0])throw Error('Your profile could not be initialized.');p=d[0]}ui.fullName.value=p.full_name||'';ui.phone.value=p.phone||'';ui.role.textContent=p.role||'buyer';ui.companyName.value=p.company_name||'';ui.bio.value=p.bio||'';ui.bio.dispatchEvent(new Event('input'));const since=p.created_at?new Date(p.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';ui.memberSince.textContent=since;ui.memberSince2.textContent=since;ui.avatar.innerHTML='';if(p.avatar_url){ui.photoPreview.src=p.avatar_url+'?v='+Date.now();ui.photoPreview.style.display='block';const im=new Image();im.src=p.avatar_url+'?v='+Date.now();im.alt='Profile photo';ui.avatar.appendChild(im)}else{ui.avatar.textContent=(p.full_name||email||'?').trim().charAt(0).toUpperCase();ui.photoPreview.removeAttribute('src');ui.photoPreview.style.display='none'}const [lr,ir]=await Promise.all([api('/rest/v1/listings?owner_id=eq.'+encodeURIComponent(id)+'&select=id'),api('/rest/v1/inquiries?or=(buyer_id.eq.'+encodeURIComponent(id)+',seller_id.eq.'+encodeURIComponent(id)+')&select=id')]);const li=await lr.json().catch(()=>[]),ii=await ir.json().catch(()=>[]);$('listingCount').textContent=lr.ok&&Array.isArray(li)?li.length:'0';$('inquiryCount').textContent=ir.ok&&Array.isArray(ii)?ii.length:'0';message('Profile loaded.','ok')}catch(e){message(e.message||'Unable to load profile.','error')}finally{ui.save.disabled=false}}async function uploadImage(file,uid){if(file.size>8*1024*1024)throw Error('Profile photo must be smaller than 8 MB.');if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw Error('Use JPG, PNG, WEBP or GIF for the profile photo.');const t=await getToken();if(!t)throw Error('Your session has expired. Please sign in again.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path='profiles/'+uid+'/'+crypto.randomUUID()+'.'+ext,z=timeout(30000);try{const r=await fetch(API+'/storage/v1/object/property-images/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':file.type,'x-upsert':'false','cache-control':'3600'},body:file,signal:z.signal});if(!r.ok){const detail=await r.text().catch(()=> '');throw Error('Photo upload failed ('+r.status+'). '+detail.slice(0,160))}return API+'/storage/v1/object/public/property-images/'+path}catch(e){if(e.name==='AbortError')throw Error('Photo upload timed out. Try a smaller image or check your connection.');throw e}finally{z.done()}}ui.photo.onchange=()=>{const f=ui.photo.files[0];if(!f)return;try{if(f.size>8*1024*1024)throw Error('Photo must be smaller than 8 MB.');if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type))throw Error('Unsupported image format.');ui.photoPreview.src=URL.createObjectURL(f);ui.photoPreview.style.display='block';message('Photo selected. Press Save changes to upload it.','ok')}catch(e){ui.photo.value='';ui.photoPreview.removeAttribute('src');ui.photoPreview.style.display='none';message(e.message,'error')}};ui.bio.oninput=()=>$('bioCount').textContent=ui.bio.value.length+' / 1000';$('copyId').onclick=async()=>{try{await navigator.clipboard.writeText(ui.profileId.textContent);message('Profile ID copied.','ok')}catch{message('Could not copy the Profile ID.','error')}};ui.save.onclick=async()=>{ui.save.disabled=true;message('Saving changes…');try{const uid=localStorage.getItem('en_user_id');if(!uid)throw Error('Please sign in again.');let avatarUrl=null;if(ui.photo.files[0]){message('Uploading profile photo…');avatarUrl=await uploadImage(ui.photo.files[0],uid)}const payload={full_name:ui.fullName.value.trim()||null,phone:ui.phone.value.trim()||null,company_name:ui.companyName.value.trim()||null,bio:ui.bio.value.trim()||null};if(avatarUrl)payload.avatar_url=avatarUrl;const r=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(uid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});if(!r.ok){const detail=await r.text().catch(()=> '');throw Error('Profile could not be saved ('+r.status+'). '+detail.slice(0,180))}ui.photo.value='';message('Profile updated successfully.','ok');if(avatarUrl){ui.photoPreview.src=avatarUrl+'?v='+Date.now();ui.photoPreview.style.display='block';ui.avatar.innerHTML='<img src="'+esc(avatarUrl)+'?v='+Date.now()+'" alt="Profile photo">'}else{ui.avatar.innerHTML='';ui.avatar.textContent=(ui.fullName.value||ui.email.textContent||'?').trim().charAt(0).toUpperCase()}}catch(e){message(e.message||'Unable to save profile.','error')}finally{ui.save.disabled=false}};$('reload').onclick=load;$('logout').onclick=clearAuth;load();</script><script src="/site.js"></script></body></html>
