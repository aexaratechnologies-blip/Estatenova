<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateNova — My Profile</title><style>:root{--bg:#050816;--text:#f5f7ff;--muted:#9ba9c5;--blue:#2563eb;--violet:#7c3aed;--line:#25365f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#17316d,transparent 34%),radial-gradient(circle at 90% 0,#40156d,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}.wrap{max-width:1000px;margin:auto;padding:0 20px}.nav{position:sticky;top:0;z-index:20;background:#050816e8;backdrop-filter:blur(20px);border-bottom:1px solid #fff1}.navin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900;color:#fff;text-decoration:none}.g{background:linear-gradient(90deg,#60a5fa,#a78bfa,#e9d5ff);-webkit-background-clip:text;color:transparent}.navlinks{display:flex;gap:10px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));font-weight:800;cursor:pointer;text-decoration:none}.ghost{background:#ffffff0d;border:1px solid #ffffff18}.panel{margin:38px 0;background:#08132cdd;border:1px solid #ffffff18;border-radius:24px;padding:28px}.profilehead{display:flex;align-items:center;gap:18px;margin-bottom:28px}.avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:28px;font-weight:950}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.label{font-size:12px;color:#8495b8;text-transform:uppercase;letter-spacing:.7px}.input{width:100%;padding:13px;background:#07122a;border:1px solid var(--line);color:#fff;border-radius:11px;outline:0}.input:focus{border-color:#6d7efc;box-shadow:0 0 0 3px #5865f233}.readonly{opacity:.7}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.message{min-height:22px;margin-top:12px}.ok{color:#86efac}.error{color:#fca5a5}.section{margin-top:30px;padding-top:25px;border-top:1px solid #ffffff12}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{padding:16px;border:1px solid #ffffff12;border-radius:15px;background:#07122a}.count{font-size:25px;font-weight:950}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.field.full{grid-column:auto}.navlinks .optional{display:none}}</style></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Estate<span class="g">Nova</span></a><div class="navlinks"><a class="btn ghost optional" href="/properties">Browse</a><button id="logout" class="btn ghost">Sign out</button></div></div></header><main class="wrap"><section class="panel"><div class="profilehead"><div id="avatar" class="avatar">?</div><div><h1 style="margin:0 0 5px">My Profile</h1><div id="emailHead" class="muted">Loading account…</div></div></div><div class="grid"><div class="field"><label class="label">Full name</label><input id="full_name" class="input" placeholder="Your name"></div><div class="field"><label class="label">Phone</label><input id="phone" class="input" type="tel" placeholder="Phone number"></div><div class="field"><label class="label">Email</label><input id="email" class="input readonly" type="email" readonly></div><div class="field"><label class="label">Account type</label><input id="role" class="input readonly" readonly></div><div class="field"><label class="label">Company name</label><input id="company_name" class="input" placeholder="Company / agency (optional)"></div><div class="field"><label class="label">Profile ID</label><input id="id" class="input readonly" readonly></div><div class="field full"><label class="label">Bio</label><textarea id="bio" class="input" rows="4" placeholder="Tell people a little about yourself"></textarea></div></div><div id="message" class="message"></div><div class="actions"><button id="save" class="btn">Save changes</button><a class="btn ghost" href="/">Back to home</a></div><div class="section"><h2>My EstateNova activity</h2><div class="cards"><div class="mini"><div class="muted">My listings</div><div id="listingCount" class="count">—</div></div><div class="mini"><div class="muted">My inquiries</div><div id="inquiryCount" class="count">—</div></div><div class="mini"><div class="muted">Member since</div><div id="memberSince" class="count" style="font-size:18px">—</div></div></div></div></section></main><script>const API='https://bttujypzchanhvdmqutv.supabase.co',KEY='sb_publishable_j4O7PGss7-wWXkY5YnwyOw_i3X1p1l0';const $=id=>document.getElementById(id);function clearAuth(){['en_access_token','en_refresh_token','en_user_id','en_email'].forEach(k=>localStorage.removeItem(k));location.href='/auth'}async function refresh(){const rt=localStorage.getItem('en_refresh_token');if(!rt)return null;const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});if(!r.ok){clearAuth();return null}const d=await r.json();localStorage.setItem('en_access_token',d.access_token);if(d.refresh_token)localStorage.setItem('en_refresh_token',d.refresh_token);if(d.user?.id)localStorage.setItem('en_user_id',d.user.id);if(d.user?.email)localStorage.setItem('en_email',d.user.email);return d.access_token}async function token(){let t=localStorage.getItem('en_access_token');if(!t)return null;let r=await fetch(API+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t}});if(r.ok)return t;return await refresh()}async function api(path,opts={}){let t=await token();if(!t)throw Error('Please sign in again.');const headers={apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opts.headers||{})};let r=await fetch(API+path,{...opts,headers});if(r.status===401){t=await refresh();if(!t)throw Error('Session expired. Please sign in again.');headers.Authorization='Bearer '+t;r=await fetch(API+path,{...opts,headers})}return r}async function load(){const t=await token();if(!t){location.href='/auth?next='+encodeURIComponent('/profile');return}const uid=localStorage.getItem('en_user_id');const r=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(uid)+'&select=*');const d=await r.json();if(!r.ok||!d[0]){message.className='message error';message.textContent='Profile could not be loaded.';return}const p=d[0];$('full_name').value=p.full_name||'';$('phone').value=p.phone||'';$('email').value=p.email||localStorage.getItem('en_email')||'';$('role').value=p.role||'buyer';$('company_name').value=p.company_name||'';$('bio').value=p.bio||'';$('id').value=p.id||uid;$('emailHead').textContent=p.email||localStorage.getItem('en_email')||'';$('avatar').textContent=(p.full_name||p.email||'?').trim().charAt(0).toUpperCase();$('memberSince').textContent=p.created_at?new Date(p.created_at).toLocaleDateString('en-IN',{month:'short',year:'numeric'}):'—';const l=await api('/rest/v1/listings?owner_id=eq.'+encodeURIComponent(uid)+'&select=id');const li=await l.json();$('listingCount').textContent=Array.isArray(li)?li.length:'0';const iq=await api('/rest/v1/inquiries?or=(buyer_id.eq.'+encodeURIComponent(uid)+',seller_id.eq.'+encodeURIComponent(uid)+')&select=id');const ii=await iq.json();$('inquiryCount').textContent=Array.isArray(ii)?ii.length:'0'}save.onclick=async()=>{save.disabled=true;message.className='message';message.textContent='Saving…';try{const uid=localStorage.getItem('en_user_id');const r=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(uid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({full_name:$('full_name').value.trim()||null,phone:$('phone').value.trim()||null,company_name:$('company_name').value.trim()||null,bio:$('bio').value.trim()||null})});if(!r.ok){const e=await r.text();throw Error(e||'Unable to save profile.')}message.className='message ok';message.textContent='Profile updated successfully.';$('emailHead').textContent=$('email').value;$('avatar').textContent=($('full_name').value||$('email').value||'?').trim().charAt(0).toUpperCase()}catch(e){message.className='message error';message.textContent=e.message||'Unable to save profile.'}finally{save.disabled=false}}logout.onclick=()=>clearAuth();load().catch(e=>{message.className='message error';message.textContent=e.message||'Unable to load profile.'});</script></body></html>
