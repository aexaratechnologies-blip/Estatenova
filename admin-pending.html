<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>EstateNova Admin — Pending</title><style>*{box-sizing:border-box}body{margin:0;background:#050816;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.eyebrow,.muted{color:#93a4c7}.eyebrow{font-size:10px;letter-spacing:3px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#6d4aff;color:#fff;font-weight:800;cursor:pointer}.item{margin:14px 0;background:#0b1530;border:1px solid #ffffff15;border-radius:20px;padding:20px}.title{font-size:21px;font-weight:850}.badge{display:inline-block;margin-left:7px;padding:4px 9px;border-radius:99px;background:#17264a;color:#c9d3eb;font-size:11px}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}.kv{padding:10px;border-radius:10px;background:#07112a}.k{font-size:11px;color:#7182a8;text-transform:uppercase}.v{margin-top:3px;word-break:break-word}.desc{margin-top:14px;padding:13px;background:#07112a;border-radius:12px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.ok{background:#18a874}.danger{background:#9d294a}@media(max-width:650px){.details{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">ESTATENOVA CONTROL CENTER</div><h1>Pending Approvals</h1><div class="muted" id="summary">Loading…</div></div><button class="btn" onclick="location.href='/admin-dashboard'">← Dashboard</button></div><div id="list">Loading pending properties…</div></div><script>'use strict';const FN='https://bttujypzchanhvdmqutv.supabase.co/functions/v1/estatenova-admin-console',token=sessionStorage.getItem('estatenova_admin_session');let listings=[],users=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=v=>v===null||v===undefined||v===''?'—':Array.isArray(v)?v.join(', '):String(v);async function api(a,x={}){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token||''},cache:'no-store',body:JSON.stringify({action:a,...x})});if(r.status===401){sessionStorage.removeItem('estatenova_admin_session');location.href='/admin';throw Error('Session expired.')}if(!r.ok)throw Error('Admin service error');return r.json()}function card(x){const owner=users.find(u=>u.id===x.owner_id);const fields=[['Listing ID',x.id],['Owner',owner?.full_name||x.owner_id],['Owner email',owner?.email],['Owner phone',owner?.phone],['Property type',x.property_type],['Listing type',x.listing_type],['Price',x.price_label||x.price],['Area',x.area&&x.area_unit?x.area+' '+x.area_unit:x.area],['Bedrooms',x.bedrooms],['Bathrooms',x.bathrooms],['Balconies',x.balconies],['Floor',x.floor&&x.total_floors?x.floor+' / '+x.total_floors:x.floor],['Furnishing',x.furnishing],['Construction year',x.construction_year],['Possession',x.possession],['Facing',x.facing],['Parking',x.parking],['Address',x.address],['Locality',x.locality],['City',x.city],['District',x.district],['State',x.state],['Pincode',x.pincode],['Latitude',x.latitude],['Longitude',x.longitude],['Status',x.status],['Approval',x.approval_status],['Featured',x.featured?'Yes':'No'],['Verified',x.verified?'Yes':'No'],['Views',x.views],['Created',x.created_at?new Date(x.created_at).toLocaleString():'—']];return '<article class="item"><div class="title">'+esc(x.title||'Untitled')+' <span class="badge">PENDING</span></div><div class="desc">'+esc(x.description||'No description provided.')+'</div><div class="details">'+fields.map(f=>'<div class="kv"><div class="k">'+esc(f[0])+'</div><div class="v">'+esc(val(f[1]))+'</div></div>').join('')+'</div><div class="desc"><b>Amenities:</b> '+esc(val(x.amenities))+'</div><div class="actions"><button class="btn ok" onclick="act(\''+esc(x.id)+'\',\'approved\')">Approve</button><button class="btn" onclick="act(\''+esc(x.id)+'\',\'rejected\')">Reject</button></div></article>'}async function load(){if(!token){location.href='/admin';return}try{const d=await api('overview');listings=(Array.isArray(d.listings)?d.listings:[]).filter(x=>String(x.approval_status||'pending').toLowerCase()==='pending');users=Array.isArray(d.users)?d.users:[];$('summary').textContent=listings.length+' pending properties';$('list').innerHTML=listings.length?listings.map(card).join(''):'<p class="muted">No pending properties.</p>'}catch(e){$('list').textContent=e.message}}async function act(id,status){try{await api('approval',{id,status});await load()}catch(e){alert(e.message)}}load();</script></body></html>
